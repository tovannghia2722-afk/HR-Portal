<style>
:root {
  --bg: #090d16;
  --cd: #111827;
  --cd-hover: #1f293d;
  --tx: #f3f4f6;

  --ok: #10b981;

  padding-bottom: env(safe-area-inset-bottom, 0px);

:root[data-theme="light"] {
  --bg: #f8fafc;
  --cd: #ffffff;
  --cd-hover: #f1f5f9;
  --tx: #0f172a;
  --mu: #64748b;
  --bd: #e2e8f0;
  --ac: #4f46e5;

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--tx); font: 14px/1.6 "Plus Jakarta Sans", system-ui, -apple-system, sans-serif; }

header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--cd); border-bottom: 1px solid var(--bd); box-shadow: var(--sh); }
h1 { font-size: 18px; margin: 0; display: flex; align-items: center; font-weight: 600; }
h2 { font-size: 16px; margin: 0 0 12px; font-weight: 600; letter-spacing: -0.01em; }

.logo { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--ac), var(--ac2)); color: #fff; font-weight: 700; font-size: 14px; margin-right: 10px; box-shadow: 0 4px 12px color-mix(in srgb, var(--ac) 40%, transparent); }
.logo.big { width: 60px; height: 60px; font-size: 22px; border-radius: 16px; margin: 0 auto 16px; display: flex; }

button:hover { border-color: var(--ac); background: var(--cd-hover); }
button.p { background: linear-gradient(135deg, var(--ac), var(--ac2)); border-color: transparent; color: #fff; font-weight: 600; box-shadow: 0 4px 14px color-mix(in srgb, var(--ac) 35%, transparent); }

main { padding: 12px 24px 40px; max-width: 1080px; margin: auto; }
.cd { background: var(--cd); border: 1px solid var(--bd); border-radius: 20px; padding: 22px; margin-bottom: 18px; box-shadow: var(--sh); backdrop-filter: blur(8px); }
.g { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 18px; }
.g .cd { margin: 0; }

.mu { color: var(--mu); font-size: 13px; }
.no { color: var(--no); }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 12px 12px; border-bottom: 1px solid var(--bd); white-space: nowrap; font-size: 13px; }
th { color: var(--mu); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }

.f { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 14px; }

.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
aside { background: var(--cd); border-right: 1px solid var(--bd); padding: 20px 14px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; box-shadow: 4px 0 24px rgba(0,0,0,0.02); }

.hb { display: flex; gap: 10px; flex-wrap: wrap; }

.gl { background: rgba(255, 255, 255, 0.15); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(8px); }

.row { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }

.qa { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin-bottom: 8px; padding: 12px 14px; border-radius: 12px; font-weight: 500; }

.mini { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 13px; }

.ai-stat { display: flex; gap: 14px; align-items: center; }
.ai-ico { width: 46px; height: 46px; border-radius: 14px; background: color-mix(in srgb, var(--ac) 15%, transparent); color: var(--ac); display: grid; place-items: center; font-size: 22px; flex: none; }
.ai-item { padding: 14px 0; border-bottom: 1px solid var(--bd); }
.ai-item:last-child { border-bottom: 0; }
.ai-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.ai-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

.scorebar { height: 8px; background: var(--bd); border-radius: 99px; overflow: hidden; margin: 10px 0; }

.ai-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.ai-form textarea { grid-column: 1/-1; min-height: 120px; }
.ai-form label { font-size: 12px; font-weight: 600; color: var(--mu); display: block; margin-bottom: 6px; }

@media(max-width:860px) {

  aside { flex-direction: row; height: auto; position: static; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--bd); padding: 10px; gap: 4px; }
  .brand { display: none; }
  .ni { width: auto; white-space: nowrap; padding: 10px 12px; }
  .ni.out { margin-top: 0; }
  .row { grid-template-columns: 1fr; }
  .top { padding: 12px 16px; }
  main { padding: 12px 16px 32px; }
}
