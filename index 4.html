  main { padding: 12px 16px 32px; }
}

for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d));c+=`<div class="${k==td?"t":""}"><b>${d}</b>${(ev[k]||[]).map(e=>`<span class="ev ${e.s}">${esc(e.n)}</span>`).join("")}</div>`}
return`<div class="cd"><h2><button class="sm" onclick="mv(-1)">‹</button> Tháng ${m+1}/${y} <button class="sm" onclick="mv(1)">›</button></h2><div class="cal">${["T2","T3","T4","T5","T6","T7","CN"].map(x=>`<div class="h">${x}</div>`).join("")}${c}</div><p class="mu" style="margin-top:12px">Xanh: đã duyệt. Cam: chờ duyệt.</p></div>`},

</div>
<div class="f"><select id="lt"><option>Phép năm</option><option>Nghỉ ốm</option><option>Nghỉ không lương</option><option>Thai sản</option><option>Cưới hỏi</option><option>Hiếu hỉ</option></select><input id="lf" type="date" value="${td}"><input id="lo" type="date" value="${td}"><textarea id="lr" placeholder="Lý do chi tiết..."></textarea></div><button class="p" onclick="addLv()">Gửi đơn</button></div><div class="cd"><h2>${hr()?"Tất cả đơn":"Đơn của tôi"}</h2><select style="margin-bottom:14px" onchange="FS=this.value;draw()">${[["all","Tất cả trạng thái"],["Cho","Chờ duyệt"],["Duyet","Đã duyệt"],["Tu","Từ chối"]].map(x=>`<option value="${x[0]}" ${FS==x[0]?"selected":""}>${x[1]}</option>`).join("")}</select><div class="tw"><table><thead><tr><th>Nhân viên</th><th>Loại</th><th>Từ</th><th>Đến</th><th>Ngày</th><th>Lý do</th><th>Trạng thái</th><th></th></tr></thead><tbody>${L.filter(l=>FS=="all"||l.status==FS).map(l=>`<tr><td>${esc(em(l.user_id).name)}</td><td>${esc(l.type)}</td><td>${l.from_date}</td><td>${l.to_date}</td><td>${dl(l.from_date,l.to_date).length}</td><td>${esc(l.reason)}${l.reject_reason?` <span class="no">(Từ chối: ${esc(l.reject_reason)})</span>`:""}</td><td><span class="tag ${l.status}">${LT[l.status]}</span></td><td>${l.status=="Cho"?(hr()?`<button class="sm" onclick="dec(${l.id},'Duyet')">Duyệt</button> <button class="sm" onclick="dec(${l.id},'Tu')">Từ chối</button>`:`<button class="sm" onclick="cancel(${l.id})">Hủy</button>`):""}${hr()?` <button class="sm" onclick="if(confirm('Xóa đơn này?'))cancel(${l.id})">Xóa</button>`:""}</td></tr>`).join("")||`<tr><td colspan="8" class="mu">Chưa có đơn nào</td></tr>`}</tbody></table></div></div>`},
pay(){const rows=payRows(),locked=RUN.some(x=>x.month==PM);
return`<div class="cd"><h2>Bảng lương</h2><div class="f"><input type="month" value="${PM}" onchange="PM=this.value;draw()"></div>${locked?`<p class="mu"><i class="ti ti-lock"></i> Tháng này đã chốt, số liệu không đổi khi sửa lương.</p>`:`<p class="mu">Chưa chốt: tính theo mức lương hiện tại. Trừ nghỉ không lương theo 22 ngày công, bảo hiểm 10,5%, chưa tính thuế TNCN.</p>`}<div class="f" style="margin-top:14px"><button onclick="csv()"><i class="ti ti-download"></i> Xuất CSV</button>${hr()&&!locked?`<button class="p" onclick="lockPay()">Chốt lương tháng</button>`:""}${hr()&&locked?`<button onclick="unlockPay()">Mở chốt</button>`:""}</div><div class="tw"><table><thead><tr><th>Nhân viên</th><th>Lương cơ bản</th><th>Phụ cấp</th><th>Nghỉ không lương</th><th>Bảo hiểm</th><th>Thực nhận</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${vnd(r.sal)}</td><td>${vnd(r.al)}</td><td>${r.u} ngày (-${vnd(r.dd)})</td><td>-${vnd(r.b)}</td><td><b>${vnd(r.net)}</b></td></tr>`).join("")||`<tr><td colspan="6" class="mu">Chưa có dữ liệu</td></tr>`}</tbody></table></div></div>`},
emp(){return`<div class="cd"><h2>Danh sách nhân viên</h2><p class="mu" style="margin-bottom:14px">Thêm nhân viên mới: vào Supabase, Authentication, Users, Add user (tick Auto Confirm User). Quay lại đây để nhập họ tên, phòng ban, lương.</p><div class="tw"><table><thead><tr><th>Họ tên</th><th>Email</th><th>Phòng ban</th><th>Chức vụ</th><th>Vai trò</th><th>Lương</th><th>Phụ cấp</th><th>Ngày vào</th><th>SĐT</th></tr></thead><tbody>${P.map(e=>{const s=sal(e.id);return`<tr><td><input style="width:150px" value="${esc(e.name)}" onchange="upd('profiles','id','${e.id}','name',this.value)"></td><td>${esc(e.email)}</td><td><input style="width:110px" value="${esc(e.dept)}" onchange="upd('profiles','id','${e.id}','dept',this.value)"></td><td><input style="width:130px" value="${esc(e.pos)}" onchange="upd('profiles','id','${e.id}','pos',this.value)"></td><td><select ${e.id==ME.id?"disabled":""} onchange="upd('profiles','id','${e.id}','role',this.value)"><option value="nv" ${e.role=="nv"?"selected":""}>Nhân viên</option><option value="hr" ${e.role=="hr"?"selected":""}>Quản lý</option></select></td><td><input style="width:120px" type="number" value="${s.sal}" onchange="upd('salaries','user_id','${e.id}','sal',+this.value||0)"></td><td><input style="width:110px" type="number" value="${s.al}" onchange="upd('salaries','user_id','${e.id}','al',+this.value||0)"></td><td><input type="date" value="${e.start_date\vert{}\vert{}""}" onchange="upd('profiles','id','${e.id}','start_date',this.value||null)"></td><td><input style="width:120px" value="${esc(e.phone)}" onchange="upd('profiles','id','${e.id}','phone',this.value)"></td></tr>`}).join("")}</tbody></table></div></div>`}};

V.ai=function(){return `<div class="hero"><div><h2>HR AI Workspace</h2><p>Trợ lý tuyển dụng & vận hành nhân sự</p></div><div class="hb"><button class="wh" onclick="go('mailai')"><i class="ti ti-mail"></i> Hộp thư AI</button><button class="gl" onclick="go('cvai')"><i class="ti ti-file-cv"></i> Sàng lọc CV</button></div></div>
<div class="ai-grid"><div class="cd ai-stat"><span class="ai-ico"><i class="ti ti-mail"></i></span><div><div class="mu">Email mẫu cần xử lý</div><b style="font-size:26px">${AI_MAILS.length}</b></div></div><div class="cd ai-stat"><span class="ai-ico"><i class="ti ti-list-check"></i></span><div><div class="mu">Nhiệm vụ chưa hoàn tất</div><b style="font-size:26px">${AI_TASKS.filter(t=>t.status!="Hoàn thành").length}</b></div></div><div class="cd ai-stat"><span class="ai-ico"><i class="ti ti-file-cv"></i></span><div><div class="mu">CV đã đánh giá</div><b style="font-size:26px">${AI_CVS.length}</b></div></div><div class="cd ai-stat"><span class="ai-ico"><i class="ti ti-calendar-event"></i></span><div><div class="mu">Lịch phỏng vấn đã tạo</div><b style="font-size:26px">${AI_EVENTS.length}</b></div></div></div>
<div class="cd"><div class="ai-line"><h2>Quy trình tự động lúc 08:00</h2><span class="pill">${AI_AUTORUN?"Đã bật trong giao diện":"Chưa bật"}</span></div><p class="mu" style="margin-top:4px">Mô phỏng: phân loại Gmail → tổng hợp Jira → tạo bản tin công việc đầu ngày.</p><div class="ai-note" style="margin:14px 0"><b>Lưu ý kết nối:</b> Bật nút này chỉ lưu lựa chọn trong phiên hiện tại. Để chạy thật lúc 08:00 kể cả khi đóng webapp, cần backend/scheduler và quyền OAuth cho Gmail, Jira.</div><div class="ai-actions"><button class="p" onclick="AI_AUTORUN=!AI_AUTORUN;draw()">${AI_AUTORUN?"Tắt lịch mô phỏng":"Bật lịch mô phỏng"}</button><button onclick="go('tasksai')">Xem nhiệm vụ</button><button onclick="go('interviewai')">Tạo lịch phỏng vấn</button></div></div>
<div class="cd"><h2>Bản tin công việc hôm nay</h2>${AI_MAILS.filter(m=>m.urgent).length?AI_MAILS.filter(m=>m.urgent).map(m=>`<div class="ai-item"><div class="ai-line"><b>${esc(m.subject)}</b><span class="tag Tu">Ưu tiên cao</span></div><div class="mu">${esc(m.from)} ·${m.time}</div><div style="margin-top:4px">${esc(m.preview)}</div></div>`).join(""):`<p class="mu">Không có việc gấp trong dữ liệu mẫu.</p>`}</div>`};
V.mailai=function(){const cats=["Tất cả","Ứng viên","Nội bộ","Việc gấp"];const shown=AI_MAILS.filter(m=>AI_MAIL_FILTER=="Tất cả"||m.category==AI_MAIL_FILTER||(AI_MAIL_FILTER=="Việc gấp"&&m.urgent));return `<div class="cd"><div class="ai-line"><h2>Hộp thư AI</h2><span class="pill">Dữ liệu minh họa</span></div><p class="mu" style="margin-top:4px">Phân nhóm email để HR xử lý nhanh hơn. Hiện chưa kết nối Gmail thật.</p><div class="ai-actions" style="margin:14px 0">${cats.map(c=>`<button class="sm ${AI_MAIL_FILTER==c?"p":""}" onclick="AI_MAIL_FILTER='${c}';draw()">${c}</button>`).join("")}<button class="sm" onclick="AI_MAILS=AI_DEMO_EMAILS.map(x=>({...x}));draw()">Khôi phục dữ liệu</button></div>${shown.map(m=>`<div class="ai-item"><div class="ai-line"><b>${esc(m.subject)}</b><span class="tag ${m.urgent?"Tu":"Duyet"}">${m.urgent?"Cần xử lý gấp":esc(m.category)}</span></div><div class="mu">${esc(m.from)} ·${m.time}</div><p style="margin:6px 0">${esc(m.preview)}</p><div class="ai-actions"><button class="sm" onclick="alert('Bản demo: cần kết nối Gmail API để mở thư thật.')">Mở thư</button><button class="sm" onclick="addMailTask(${m.id})">Tạo nhiệm vụ</button><button class="sm" onclick="AI_MAILS=AI_MAILS.filter(x=>x.id!=${m.id});draw()">Ẩn khỏi danh sách</button></div></div>`).join("")||`<p class="mu">Không có email trong nhóm này.</p>`}</div><div class="ai-note">Khi tích hợp thật: dùng Gmail OAuth với quyền tối thiểu, lấy email theo nhãn/truy vấn.</div>`};
V.tasksai=function(){return `<div class="cd"><h2>Jira & quản lý công việc</h2><p class="mu" style="margin-bottom:14px">Bạn có thể tạo và cập nhật nhiệm vụ trong bản demo. Đồng bộ Jira thật cần Jira Cloud API/OAuth và cấu hình dự án.</p><div class="ai-form"><div><label>Tên nhiệm vụ</label><input id="aititle" placeholder="VD: Gọi xác nhận ứng viên"></div><div><label>Dự án / nhóm</label><input id="aiproj" placeholder="Tuyển dụng" value="Tuyển dụng"></div><div><label>Hạn xử lý</label><input id="aidue" type="date" value="${td}"></div><div><label>Mức ưu tiên</label><select id="aipri"><option>Cao</option><option selected>Vừa</option><option>Thấp</option></select></div><div class="wide"><label>Ghi chú</label><input id="ainote" placeholder="Thông tin cần theo dõi"></div></div><div class="ai-actions"><button class="p" onclick="addAITask()">+ Thêm nhiệm vụ</button><button onclick="exportTasks()">Xuất CSV</button></div></div><div class="cd"><h2>Danh sách nhiệm vụ (${AI_TASKS.length})</h2><div class="tw"><table><thead><tr><th>Nhiệm vụ</th><th>Dự án</th><th>Hạn</th><th>Ưu tiên</th><th>Trạng thái</th><th>Ghi chú</th><th></th></tr></thead><tbody>${AI_TASKS.map(t=>`<tr><td>${esc(t.title)}</td><td>${esc(t.project)}</td><td>${esc(t.due)}</td><td><span class="tag ${t.priority=="Cao"?"Tu":"Cho"}">${esc(t.priority)}</span></td><td><select onchange="setTaskStatus(${t.id},this.value)">${["Chưa làm","Đang làm","Hoàn thành"].map(s=>`<option ${t.status==s?"selected":""}>${s}</option>`).join("")}</select></td><td>${esc(t.note)}</td><td><button class="sm" onclick="deleteAITask(${t.id})">Xóa</button></td></tr>`).join("")||`<tr><td colspan="7" class="mu">Chưa có nhiệm vụ.</td></tr>`}</tbody></table></div></div>`};
V.cvai=function(){return `<div class="cd"><h2>Sàng lọc CV có hỗ trợ AI</h2><p class="mu" style="margin-bottom:14px">Dán nội dung CV và tiêu chí tuyển dụng. Công cụ demo chấm điểm theo từ khóa.</p><div class="ai-form"><div><label>Tên ứng viên</label><input id="cvname" placeholder="Tên ứng viên"></div><div><label>Vị trí tuyển dụng</label><input id="cvrole" placeholder="VD: Chuyên viên C&B"></div><div class="wide"><label>Tiêu chí tuyển dụng (từ khóa, ngăn cách bằng dấu phẩy)</label><textarea id="cvcriteria">C&B, Excel, BHXH, luật lao động, tính lương, nhân sự</textarea></div><div class="wide"><label>Nội dung CV / kinh nghiệm ứng viên</label><textarea id="cvtext" placeholder="Dán phần kinh nghiệm, kỹ năng và học vấn của CV tại đây..."></textarea></div></div><div class="ai-actions"><button class="p" onclick="scoreCV()">Đánh giá mức độ phù hợp</button><button onclick="exportCVs()">Xuất báo cáo CSV</button></div><div class="ai-note" style="margin-top:14px">Nguyên tắc: đánh giá theo kỹ năng liên quan đến công việc; không dùng tuổi, giới tính, tình trạng hôn nhân, ảnh hoặc thông tin nhạy cảm làm tiêu chí loại ứng viên.</div></div><div class="cd"><h2>Kết quả đánh giá</h2>${AI_CVS.slice().sort((a,b)=>b.score-a.score).map(c=>`<div class="ai-item"><div class="ai-line"><b>${esc(c.name)} · ${esc(c.role)}</b><b>${c.score}%</b></div><div class="scorebar"><span style="width:${c.score}%"></span></div><div class="mu">Khớp từ khóa: ${esc(c.matches.join(", ")\vert{}\vert{}"Chưa tìm thấy")} · ${c.date}</div><div style="margin-top:4px">${esc(c.summary)}</div><div class="ai-actions"><button class="sm" onclick="deleteCV(${c.id})">Xóa kết quả</button></div></div>`).join("")||`<p class="mu">Chưa có CV nào được đánh giá.</p>`}</div>`};
V.interviewai=function(){return `<div class="cd"><h2>Lên lịch phỏng vấn</h2><p class="mu" style="margin-bottom:14px">Tạo lịch dự kiến trong webapp.</p><div class="ai-form"><div><label>Tên ứng viên</label><input id="ivname" placeholder="Họ tên ứng viên"></div><div><label>Email ứng viên</label><input id="ivemail" type="email" placeholder="name@example.com"></div><div><label>Vị trí</label><input id="ivrole" placeholder="Vị trí tuyển dụng"></div><div><label>Ngày phỏng vấn</label><input id="ivdate" type="date" value="${td}"></div><div><label>Giờ bắt đầu</label><input id="ivtime" type="time" value="09:00"></div><div><label>Thời lượng</label><select id="ivduration"><option>30</option><option selected>45</option><option>60</option></select></div><div class="wide"><label>Người phỏng vấn / ghi chú</label><input id="ivnote" placeholder="Tên người phỏng vấn, hình thức online/offline"></div></div><div class="ai-actions"><button class="p" onclick="addInterview()">Tạo lịch dự kiến</button><button onclick="exportInterviews()">Xuất lịch CSV</button></div></div><div class="cd"><h2>Lịch phỏng vấn đã tạo (${AI_EVENTS.length})</h2>${AI_EVENTS.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(e=>`<div class="ai-item"><div class="ai-line"><b>${esc(e.name)} ·${esc(e.role)}</b><span class="pill">${esc(e.date)}${esc(e.time)}</span></div><div class="mu">${esc(e.email)} ·${e.duration} phút</div><div style="margin-top:4px">${esc(e.note)}</div><div class="ai-actions"><button class="sm" onclick="deleteInterview(${e.id})">Xóa lịch</button></div></div>`).join("")||`<p class="mu">Chưa có lịch phỏng vấn.</p>`}</div>`};
function addAITask(){const title=(document.getElementById('aititle')?.value||'').trim();if(!title){alert('Nhập tên nhiệm vụ trước nhé.');return}AI_TASKS.unshift({id:Date.now(),title,project:document.getElementById('aiproj').value||'Chung',due:document.getElementById('aidue').value||td,status:'Chưa làm',priority:document.getElementById('aipri').value,note:document.getElementById('ainote').value||''});saveAI();draw()}
function addMailTask(id){const m=AI_MAILS.find(x=>x.id==id);if(!m)return;AI_TASKS.unshift({id:Date.now(),title:'Xử lý email: '+m.subject,project:'Email / HR',due:td,status:'Chưa làm',priority:m.urgent?'Cao':'Vừa',note:m.from+' — '+m.preview});saveAI();alert('Đã tạo nhiệm vụ từ email mẫu.');go('tasksai')}
function setTaskStatus(id,status){const t=AI_TASKS.find(x=>x.id==id);if(t)t.status=status;saveAI();draw()}
function deleteAITask(id){AI_TASKS=AI_TASKS.filter(x=>x.id!=id);saveAI();draw()}
function scoreCV(){const name=(document.getElementById('cvname').value||'Ứng viên chưa đặt tên').trim(),role=(document.getElementById('cvrole').value||'Chưa xác định').trim(),criteria=document.getElementById('cvcriteria').value.split(',').map(x=>x.trim()).filter(Boolean),txt=document.getElementById('cvtext').value.toLocaleLowerCase('vi');if(!txt.trim()){alert('Hãy dán nội dung CV trước.');return}const matches=criteria.filter(k=>txt.includes(k.toLocaleLowerCase('vi'))),score=criteria.length?Math.round(matches.length/criteria.length*100):0;AI_CVS.unshift({id:Date.now(),name,role,score,matches,summary:score>=70?'Có nhiều từ khóa liên quan; cần xác minh kinh nghiệm và mức độ thành thạo.':score>=40?'Có một số từ khóa phù hợp; nên xem kỹ các bằng chứng kinh nghiệm.':'Ít từ khóa khớp; không nên tự động loại, cần xem xét CV đầy đủ.',date:td});saveAI();draw()}
function deleteCV(id){AI_CVS=AI_CVS.filter(c=>c.id!=id);saveAI();draw()}
function addInterview(){const name=(document.getElementById('ivname').value||'').trim(),email=(document.getElementById('ivemail').value||'').trim(),role=(document.getElementById('ivrole').value||'').trim(),date=document.getElementById('ivdate').value,time=document.getElementById('ivtime').value;if(!name||!email||!role||!date||!time){alert('Vui lòng nhập tên, email, vị trí, ngày và giờ.');return}AI_EVENTS.push({id:Date.now(),name,email,role,date,time,duration:document.getElementById('ivduration').value,note:document.getElementById('ivnote').value||''});saveAI();draw()}
function deleteInterview(id){AI_EVENTS=AI_EVENTS.filter(e=>e.id!=id);saveAI();draw()}
function exportTasks(){downloadCSV('jira-tasks-demo.csv',['Nhiệm vụ','Dự án','Hạn','Trạng thái','Ưu tiên','Ghi chú'],AI_TASKS.map(t=>[t.title,t.project,t.due,t.status,t.priority,t.note]))}
function exportCVs(){downloadCSV('bao-cao-sang-loc-cv.csv',['Ứng viên','Vị trí','Điểm phù hợp','Từ khóa khớp','Nhận xét','Ngày'],AI_CVS.map(c=>[c.name,c.role,c.score+'%',c.matches.join('; '),c.summary,c.date]))}
function exportInterviews(){downloadCSV('lich-phong-van-demo.csv',['Ứng viên','Email','Vị trí','Ngày','Giờ','Thời lượng','Ghi chú'],AI_EVENTS.map(e=>[e.name,e.email,e.role,e.date,e.time,e.duration,e.note]))}
function downloadCSV(name,heads,rows){const data='\ufeff'+[heads,...rows].map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');dlf(data,'text/csv;charset=utf-8',name)}

function setTemplate(text){ const lr=document.getElementById('lr'); if(lr) lr.value=text; }

function mini(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),ev={};C.forEach(l=>dl(l.from_date,l.to_date).forEach(d=>ev[d]=1));const first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();let c=["T2","T3","T4","T5","T6","T7","CN"].map(x=>`<i class="mh">${x}</i>`).join("");for(let i=0;i<first;i++)c+="<i></i>";for(let d=1;d<=days;d++){const k=iso(new Date(y,m,d));c+=`<i class="md ${k==td?"td":""} ${ev[k]?"hv":""}">${d}</i>`}return`<div class="cd"><h2>Tháng ${m+1}, ${y}</h2><div class="mini">${c}</div><p class="mu" style="margin:10px 0 0">Chấm nhỏ: có người nghỉ</p></div>`}
function payRows(){const run=RUN.filter(x=>x.month==PM);if(run.length)return run.filter(x=>hr()||x.user_id==ME.id).map(x=>({name:em(x.user_id).name,sal:x.sal,al:x.al,u:x.unpaid_days,dd:x.deduct,b:x.insurance,net:x.net}));
return P.filter(e=>hr()||e.id==ME.id).map(e=>{const t=sal(e.id),u=L.filter(l=>l.user_id==e.id&&l.status=="Duyet"&&l.type=="Nghỉ không lương").reduce((x,l)=>x+dl(l.from_date,l.to_date).filter(d=>d.slice(0,7)==PM).length,0),dd=Math.round(t.sal/22*u),b=Math.round(t.sal*.105);return{id:e.id,name:e.name,sal:+t.sal,al:+t.al,u,dd,b,net:+t.sal+ +t.al-dd-b}})}
const lockPay=()=>run(sb.from("payroll_runs").upsert(payRows().map(r=>({month:PM,user_id:r.id,sal:r.sal,al:r.al,unpaid_days:r.u,deduct:r.dd,insurance:r.b,net:r.net}))));
const unlockPay=()=>run(sb.from("payroll_runs").delete().eq("month",PM));
function dlf(t,type,name){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type}));a.download=name;a.click()}
function csv(){const r=payRows();dlf("\ufeffHọ tên,Lương cơ bản,Phụ cấp,Ngày nghỉ KL,Trừ nghỉ KL,Bảo hiểm,Thực nhận\n"+r.map(x=>[x.name,x.sal,x.al,x.u,x.dd,x.b,x.net].map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n"),"text/csv;charset=utf-8","bang-luong-"+PM+".csv")}
V.att=function(){const r=AT.find(a=>a.user_id==ME.id&&a.day==td)||{},f=t=>t?new Date(t).toTimeString().slice(0,5):"--",list=AT.filter(a=>hr()||a.user_id==ME.id).slice(0,60);
return`<div class="cd"><h2>Hôm nay (${td})</h2><p class="mu" style="margin-bottom:12px">Vào: ${f(r.check_in)} · Ra: ${f(r.check_out)}</p><button class="p" onclick="ck('in')" ${r.check_in?"disabled":""}>Check-in</button> <button onclick="ck('out')" ${!r.check_in||r.check_out?"disabled":""}>Check-out</button></div><div class="cd"><h2>Lịch sử chấm công</h2><div class="tw"><table><thead><tr><th>Ngày</th><th>Nhân viên</th><th>Vào</th><th>Ra</th></tr></thead><tbody>${list.map(a=>`<tr><td>${a.day}</td><td>${esc(em(a.user_id).name)}</td><td>${f(a.check_in)}</td><td>${f(a.check_out)}</td></tr>`).join("")||`<tr><td colspan="4" class="mu">Chưa có dữ liệu</td></tr>`}</tbody></table></div></div>`};
const ck=k=>k=="in"?run(sb.from("attendance").insert({day:td,check_in:new Date().toISOString()})):run(sb.from("attendance").update({check_out:new Date().toISOString()}).eq("user_id",ME.id).eq("day",td));
V.me=function(){return`<div class="cd"><h2>Hồ sơ của tôi</h2><div class="f" style="margin-bottom:16px"><div><span class="mu">Họ tên</span><br><b>${esc(ME.name)}</b></div><div><span class="mu">Email</span><br><b>${esc(ME.email)}</b></div><div><span class="mu">Phòng ban</span><br><b>${esc(ME.dept)||"--"}</b></div><div><span class="mu">Chức vụ</span><br><b>${esc(ME.pos)||"--"}</b></div><div><span class="mu">Ngày vào làm</span><br><b>${ME.start_date||"--"}</b></div></div><div class="f"><input id="ph" placeholder="Số điện thoại" value="${esc(ME.phone)}"><input id="bd" type="date" value="${ME.birthday||""}"></div><button class="p" onclick="saveMe()">Lưu thông tin</button></div><div class="cd"><h2>Đổi mật khẩu</h2><div class="f"><input id="np" type="password" placeholder="Mật khẩu mới"><input id="np2" type="password" placeholder="Nhập lại mật khẩu"></div><button class="p" onclick="setPw()">Đổi mật khẩu</button></div>`};
const saveMe=()=>run(sb.rpc("update_my_profile",{p_phone:v("ph"),p_birthday:v("bd")||null}));
async function setPw(){const a=v("np"),b=v("np2");if(a.length<6||a!=b){MSG="Mật khẩu tối thiểu 6 ký tự và hai ô phải giống nhau";return draw()}const r=await sb.auth.updateUser({password:a});if(r.error){MSG="Lỗi: "+r.error.message;return draw()}RECOV=false;MSG="Đã đổi mật khẩu";await load()}
async function forgot(){const e=v("le");if(!e){MSG="Nhập email rồi bấm lại";return draw()}const r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});MSG=r.error?"Lỗi: "+r.error.message:"Nếu email tồn tại, hệ thống đã gửi thư đặt lại mật khẩu";draw()}
V.set=function(){return`<div class="cd"><h2>Ngày lễ (không tính vào ngày nghỉ)</h2><div class="f"><input id="hd" type="date"><input id="hn" placeholder="Tên ngày lễ"><button class="p" onclick="addHol()">Thêm</button></div>${HD.map(h=>`<div class="an"><i class="ti ti-confetti"></i><div><b>${esc(h.name)}</b><div class="mu">${h.day}</div></div><button class="sm" onclick="delHol('${h.day}')">Xóa</button></div>`).join("")||`<p class="mu">Chưa có ngày lễ</p>`}</div><div class="cd"><h2>Sao lưu dữ liệu</h2><p class="mu" style="margin-bottom:12px">Tải toàn bộ dữ liệu về máy dạng JSON. Nên làm mỗi tuần.</p><button class="p" onclick="backup()"><i class="ti ti-download"></i> Tải bản sao lưu</button></div>`};
const addHol=()=>v("hd")&&run(sb.from("holidays").insert({day:v("hd"),name:v("hn")||"Ngày lễ"}));
const delHol=d=>run(sb.from("holidays").delete().eq("day",d));
const backup=()=>dlf(JSON.stringify({profiles:P,salaries:SL,leaves:L,attendance:AT,payroll_runs:RUN,holidays:HD,announcements:A},null,1),"application/json","hr-backup-"+td+".json");
const mv=k=>{CM=new Date(CM.getFullYear(),CM.getMonth()+k,1);draw()};
async function run(p){const r=await p;MSG=r.error?"Lỗi: "+r.error.message:"";await load()}
const addAnn=()=>v("at")&&run(sb.from("announcements").insert({title:v("at")}));
const delAnn=id=>run(sb.from("announcements").delete().eq("id",id));
function addLv(){const f=v("lf"),o=v("lo"),t=v("lt"),n=f&&o&&o>=f?dl(f,o).length:-1;
if(n<0){MSG="Ngày không hợp lệ";return draw()}if(!n){MSG="Khoảng ngày chỉ có thứ Bảy, Chủ Nhật";return draw()}
if(t=="Phép năm"&&n>QUOTA-used(ME.id)){MSG="Không đủ ngày phép năm còn lại";return draw()}
run(sb.from("leaves").insert({type:t,from_date:f,to_date:o,reason:v("lr")}))}
const dec=(id,s)=>{let x={status:s};if(s=="Tu"){const r=prompt("Lý do từ chối (có thể để trống)");if(r===null)return;x.reject_reason=r}run(sb.from("leaves").update(x).eq("id",id))};
const cancel=id=>run(sb.from("leaves").delete().eq("id",id));
const upd=(tb,k,id,f,x)=>run(sb.from(tb).update({[f]:x}).eq(k,id));
sb.auth.onAuthStateChange(ev=>{if(ev=="PASSWORD_RECOVERY"){RECOV=true;draw()}});sb.auth.getSession().then(load);
</script></body></html>
