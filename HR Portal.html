<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>HR Portal</title>
<style>
:root{--bg:#f6f7f9;--cd:#fff;--tx:#1a1d23;--mu:#667085;--bd:#e4e7ec;--ac:#2563eb;--ok:#16a34a;--no:#dc2626;--wa:#d97706;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--cd:#181b21;--tx:#e8eaee;--mu:#98a2b3;--bd:#2a2f38;--ac:#5b8def;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--cd:#181b21;--tx:#e8eaee;--mu:#98a2b3;--bd:#2a2f38;--ac:#5b8def;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--cd);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0}h2{font-size:16px;margin:0 0 10px}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}nav button{white-space:nowrap}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:7px 11px}
button{cursor:pointer}button.on,button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.5}
main{padding:0 16px 24px;max-width:1000px;margin:auto}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.st b{display:block;font-size:26px}.mu{color:var(--mu);font-size:13px}.no{color:var(--no)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:13px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}.f textarea{grid-column:1/-1}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}.Duyet{color:var(--ok)}.Tu{color:var(--no)}.Cho{color:var(--wa)}
.sm{padding:3px 8px;font-size:12px}
.lg{max-width:380px;margin:60px auto}.lg input{width:100%;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal>div{min-height:72px;border:1px solid var(--bd);border-radius:8px;padding:4px;font-size:11px;overflow:hidden}
.cal .h{min-height:0;border:0;text-align:center;color:var(--mu)}.cal .t{border-color:var(--ac)}.cal .x{opacity:.45}
.ev{display:block;margin-top:2px;padding:1px 4px;border-radius:4px;background:color-mix(in srgb,var(--ok) 22%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev.Cho{background:color-mix(in srgb,var(--wa) 25%,transparent)}
</style></head><body><div id="app"></div>
<script>
const K="hrp2",iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),td=iso(new Date()),QUOTA=12;
let S,ME=null,T="home",MSG="",CM=new Date(),PM=td.slice(0,7);
const seed={n:10,emps:[
{id:1,name:"Trần Thị Bình",email:"binh@congty.vn",pw:"quanly123",role:"hr",dept:"Nhân sự",pos:"Trưởng phòng HR",sal:25000000,al:2000000},
{id:2,name:"Nguyễn Văn An",email:"an@congty.vn",pw:"nv123456",role:"nv",dept:"Kỹ thuật",pos:"Lập trình viên",sal:20000000,al:1000000},
{id:3,name:"Lê Hoàng Cường",email:"cuong@congty.vn",pw:"nv123456",role:"nv",dept:"Kinh doanh",pos:"Sales",sal:15000000,al:1500000},
{id:4,name:"Phạm Minh Dung",email:"dung@congty.vn",pw:"nv123456",role:"nv",dept:"Kế toán",pos:"Kế toán viên",sal:16000000,al:800000}],
leaves:[],ann:[{t:"Chào mừng đến với HR Portal",d:td}]};
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed;
try{const i=localStorage.getItem(K+"s");if(i)ME=S.emps.find(e=>e.id==i)||null}catch(e){}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const em=id=>S.emps.find(e=>e.id==id)||{name:"?"},vnd=n=>Number(n).toLocaleString("vi-VN")+" ₫",hr=()=>ME&&ME.role=="hr",v=i=>document.getElementById(i).value.trim();
const LT={Duyet:"Đã duyệt",Tu:"Từ chối",Cho:"Chờ duyệt"};
function dl(f,o){const a=[],d=new Date(f+"T12:00:00"),e=new Date(o+"T12:00:00");while(d<=e){if(d.getDay()%6)a.push(iso(d));d.setDate(d.getDate()+1)}return a}
function used(id){return S.leaves.filter(l=>l.e==id&&l.t=="Phép năm"&&l.st!="Tu"&&l.f.slice(0,4)==td.slice(0,4)).reduce((s,l)=>s+dl(l.f,l.o).length,0)}
function go(t){T=t;MSG="";draw()}
function draw(){const A=document.getElementById("app");
if(!ME){A.innerHTML=`<div class="cd lg"><h2>Đăng nhập HR Portal</h2><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Mật khẩu"><p class="no">${esc(MSG)}</p><button class="p" onclick="login()">Đăng nhập</button><p class="mu">Tài khoản demo: binh@congty.vn / quanly123 (quản lý), an@congty.vn / nv123456 (nhân viên)</p></div>`;return}
const tabs=[["home","Tổng quan"],["cal","Lịch nghỉ"],["leave","Đơn nghỉ phép"],["pay","Bảng lương"]];if(hr())tabs.push(["emp","Nhân viên"]);
A.innerHTML=`<header><h1>HR Portal</h1><div>${esc(ME.name)} <span class="tag">${hr()?"Quản lý":"Nhân viên"}</span> <button class="sm" onclick="logout()">Đăng xuất</button></div></header><nav>${tabs.map(x=>`<button class="${x[0]==T?"on":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}</nav><main>${MSG?`<p class="no">${esc(MSG)}</p>`:""}${V[T]()}</main>`}
function login(){const e=S.emps.find(x=>x.email==v("le").toLowerCase()&&x.pw==v("lp"));if(!e){MSG="Sai email hoặc mật khẩu";return draw()}ME=e;MSG="";try{localStorage.setItem(K+"s",e.id)}catch(x){}draw()}
function logout(){ME=null;T="home";try{localStorage.removeItem(K+"s")}catch(e){}draw()}
const V={
home(){const p=S.leaves.filter(l=>l.st=="Cho"&&(hr()||l.e==ME.id)).length,o=S.leaves.filter(l=>l.st=="Duyet"&&dl(l.f,l.o).includes(td)).map(l=>em(l.e).name);
return`<div class="g"><div class="cd st">${hr()?`<b>${S.emps.length}</b><span class="mu">Nhân viên</span>`:`<b>${QUOTA-used(ME.id)}/${QUOTA}</b><span class="mu">Ngày phép năm còn lại</span>`}</div><div class="cd st"><b>${p}</b><span class="mu">${hr()?"Đơn chờ duyệt":"Đơn của tôi chờ duyệt"}</span></div><div class="cd st"><b>${o.length}</b><span class="mu">Nghỉ hôm nay${o.length?": "+esc(o.join(", ")):""}</span></div></div><div class="cd"><h2>Thông báo</h2>${S.ann.map(a=>`<p><b>${esc(a.t)}</b> <span class="mu">${a.d}</span></p>`).join("")}${hr()?`<div class="f"><input id="at" placeholder="Nội dung thông báo"><button class="p" onclick="addAnn()">Đăng</button></div>`:""}</div>`},
cal(){const y=CM.getFullYear(),m=CM.getMonth(),ev={};S.leaves.filter(l=>l.st!="Tu").forEach(l=>dl(l.f,l.o).forEach(d=>(ev[d]=ev[d]||[]).push({n:em(l.e).name.split(" ").pop(),s:l.st})));
const first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();let c="";for(let i=0;i<first;i++)c+="<div class='x'></div>";
for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d));c+=`<div class="${k==td?"t":""}"><b>${d}</b>${(ev[k]||[]).map(e=>`<span class="ev ${e.s}">${esc(e.n)}</span>`).join("")}</div>`}
return`<div class="cd"><h2><button class="sm" onclick="mv(-1)">‹</button> Tháng ${m+1}/${y} <button class="sm" onclick="mv(1)">›</button></h2><div class="cal">${["T2","T3","T4","T5","T6","T7","CN"].map(x=>`<div class="h">${x}</div>`).join("")}${c}</div><p class="mu">Xanh: đã duyệt. Cam: chờ duyệt.</p></div>`},
leave(){const L=S.leaves.filter(l=>hr()||l.e==ME.id).slice().reverse();
return`<div class="cd"><h2>Xin nghỉ phép</h2><p class="mu">Phép năm còn lại: ${QUOTA-used(ME.id)}/${QUOTA} ngày (không tính thứ Bảy, Chủ Nhật)</p><div class="f"><select id="lt"><option>Phép năm</option><option>Nghỉ ốm</option><option>Nghỉ không lương</option></select><input id="lf" type="date" value="${td}"><input id="lo" type="date" value="${td}"><textarea id="lr" placeholder="Lý do"></textarea></div><button class="p" onclick="addLv()">Gửi đơn</button></div><div class="cd"><h2>${hr()?"Tất cả đơn":"Đơn của tôi"}</h2><div class="tw"><table><thead><tr><th>Nhân viên</th><th>Loại</th><th>Từ</th><th>Đến</th><th>Ngày</th><th>Lý do</th><th>Trạng thái</th><th></th></tr></thead><tbody>${L.map(l=>`<tr><td>${esc(em(l.e).name)}</td><td>${esc(l.t)}</td><td>${l.f}</td><td>${l.o}</td><td>${dl(l.f,l.o).length}</td><td>${esc(l.r)}</td><td><span class="tag ${l.st}">${LT[l.st]}</span></td><td>${l.st=="Cho"?(hr()?`<button class="sm" onclick="dec(${l.id},'Duyet')">Duyệt</button> <button class="sm" onclick="dec(${l.id},'Tu')">Từ chối</button>`:`<button class="sm" onclick="cancel(${l.id})">Hủy</button>`):""}</td></tr>`).join("")||`<tr><td colspan="8" class="mu">Chưa có đơn nào</td></tr>`}</tbody></table></div></div>`},
pay(){const L=S.emps.filter(e=>hr()||e.id==ME.id);
return`<div class="cd"><h2>Bảng lương</h2><div class="f"><input type="month" value="${PM}" onchange="PM=this.value;draw()"></div><p class="mu">Demo: trừ nghỉ không lương theo 22 ngày công, bảo hiểm 10,5% lương cơ bản, chưa tính thuế TNCN.</p><div class="tw"><table><thead><tr><th>Nhân viên</th><th>Lương cơ bản</th><th>Phụ cấp</th><th>Nghỉ không lương</th><th>Bảo hiểm</th><th>Thực nhận</th></tr></thead><tbody>${L.map(e=>{const u=S.leaves.filter(l=>l.e==e.id&&l.st=="Duyet"&&l.t=="Nghỉ không lương").reduce((s,l)=>s+dl(l.f,l.o).filter(d=>d.slice(0,7)==PM).length,0),dd=Math.round(e.sal/22*u),b=Math.round(e.sal*.105);return`<tr><td>${esc(e.name)}</td><td>${vnd(e.sal)}</td><td>${vnd(e.al)}</td><td>${u} ngày (-${vnd(dd)})</td><td>-${vnd(b)}</td><td><b>${vnd(e.sal+e.al-dd-b)}</b></td></tr>`}).join("")}</tbody></table></div></div>`},
emp(){return`<div class="cd"><h2>Danh sách nhân viên</h2><div class="tw"><table><thead><tr><th>Họ tên</th><th>Email</th><th>Phòng ban</th><th>Chức vụ</th><th>Vai trò</th><th>Lương</th><th>Phụ cấp</th><th></th></tr></thead><tbody>${S.emps.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.email)}</td><td>${esc(e.dept)}</td><td>${esc(e.pos)}</td><td>${e.role=="hr"?"Quản lý":"Nhân viên"}</td><td><input style="width:120px" type="number" value="${e.sal}" onchange="upd(${e.id},'sal',this.value)"></td><td><input style="width:110px" type="number" value="${e.al}" onchange="upd(${e.id},'al',this.value)"></td><td>${e.id==ME.id?"":`<button class="sm" onclick="del(${e.id})">Xóa</button>`}</td></tr>`).join("")}</tbody></table></div></div><div class="cd"><h2>Thêm nhân viên</h2><div class="f"><input id="n1" placeholder="Họ tên"><input id="n2" placeholder="Email"><input id="n3" placeholder="Mật khẩu"><input id="n4" placeholder="Phòng ban"><input id="n5" placeholder="Chức vụ"><input id="n6" type="number" placeholder="Lương cơ bản"><select id="n7"><option value="nv">Nhân viên</option><option value="hr">Quản lý</option></select></div><button class="p" onclick="addEmp()">Thêm</button></div>`}};
function mv(k){CM=new Date(CM.getFullYear(),CM.getMonth()+k,1);draw()}
function addAnn(){if(!v("at"))return;S.ann.unshift({t:v("at"),d:td});sv();draw()}
function addLv(){const f=v("lf"),o=v("lo"),t=v("lt");MSG="";if(!f||!o||o<f)MSG="Ngày không hợp lệ";else{const n=dl(f,o).length;if(!n)MSG="Khoảng ngày chỉ có thứ Bảy, Chủ Nhật";else if(t=="Phép năm"&&n>QUOTA-used(ME.id))MSG="Không đủ ngày phép năm còn lại";else{S.leaves.push({id:++S.n,e:ME.id,t,f,o,r:v("lr"),st:"Cho"});sv()}}draw()}
function dec(id,s){S.leaves.forEach(l=>{if(l.id==id)l.st=s});sv();draw()}
function cancel(id){S.leaves=S.leaves.filter(l=>l.id!=id);sv();draw()}
function upd(id,k,x){S.emps.forEach(e=>{if(e.id==id)e[k]=+x||0});sv()}
function del(id){S.emps=S.emps.filter(e=>e.id!=id);S.leaves=S.leaves.filter(l=>l.e!=id);sv();draw()}
function addEmp(){const e=v("n2").toLowerCase();if(!v("n1")||!e||!v("n3"))MSG="Cần nhập họ tên, email, mật khẩu";else if(S.emps.some(x=>x.email==e))MSG="Email đã tồn tại";else{S.emps.push({id:++S.n,name:v("n1"),email:e,pw:v("n3"),role:v("n7"),dept:v("n4"),pos:v("n5"),sal:+v("n6")||0,al:0});sv()}draw()}
draw();
</script></body></html>
