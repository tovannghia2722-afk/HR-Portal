<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>HR Portal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ APPLE-INSPIRED DESIGN SYSTEM ============ */
:root{
  --bg:#f5f5f7;
  --bg-elev:#ffffff;
  --cd:rgba(255,255,255,.72);
  --cd-solid:#ffffff;
  --tx:#1d1d1f;
  --mu:#6e6e73;
  --bd:rgba(0,0,0,.07);
  --bd-strong:rgba(0,0,0,.12);
  --ac:#0071e3;
  --ac2:#0077ed;
  --ac-soft:rgba(0,113,227,.10);
  --ok:#30b14b;
  --no:#ff3b30;
  --wa:#ff9500;
  --sh-sm:0 1px 2px rgba(0,0,0,.04);
  --sh:0 2px 8px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.06);
  --sh-lg:0 4px 16px rgba(0,0,0,.06),0 24px 60px rgba(0,0,0,.10);
  --r-sm:10px;--r:14px;--r-lg:20px;--r-xl:28px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Be Vietnam Pro",system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000;--bg-elev:#1c1c1e;--cd:rgba(28,28,30,.72);--cd-solid:#1c1c1e;
    --tx:#f5f5f7;--mu:#98989d;--bd:rgba(255,255,255,.08);--bd-strong:rgba(255,255,255,.16);
    --ac:#0a84ff;--ac2:#3395ff;--ac-soft:rgba(10,132,255,.16);
    --ok:#30d158;--no:#ff453a;--wa:#ff9f0a;
    --sh-sm:0 1px 2px rgba(0,0,0,.4);--sh:0 2px 8px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);
    --sh-lg:0 4px 16px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000;--bg-elev:#1c1c1e;--cd:rgba(28,28,30,.72);--cd-solid:#1c1c1e;
  --tx:#f5f5f7;--mu:#98989d;--bd:rgba(255,255,255,.08);--bd-strong:rgba(255,255,255,.16);
  --ac:#0a84ff;--ac2:#3395ff;--ac-soft:rgba(10,132,255,.16);
  --ok:#30d158;--no:#ff453a;--wa:#ff9f0a;
  --sh-sm:0 1px 2px rgba(0,0,0,.4);--sh:0 2px 8px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);
  --sh-lg:0 4px 16px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg);color:var(--tx);font:15px/1.5 var(--font);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  letter-spacing:-.01em;
}
h1,h2,h3{letter-spacing:-.02em;font-weight:600}
h1{font-size:17px}
h2{font-size:17px;margin:0 0 14px}
a{color:var(--ac);text-decoration:none}
a:hover{text-decoration:underline}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh;background:var(--bg)}
aside{
  background:var(--cd);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-right:1px solid var(--bd);padding:20px 14px;
  display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-size:16px;font-weight:600;letter-spacing:-.02em}
.brand .logo{margin:0}
.logo{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,#0a84ff,#5e5ce6);
  color:#fff;font-weight:600;font-size:13px;
  box-shadow:0 4px 12px rgba(10,132,255,.35);
}
.logo.big{width:64px;height:64px;font-size:22px;border-radius:18px;margin:0 auto 16px;display:flex;box-shadow:0 8px 24px rgba(10,132,255,.4)}

.ni{
  display:flex;align-items:center;gap:11px;border:0;background:transparent;text-align:left;
  padding:9px 12px;border-radius:10px;color:var(--tx);font-weight:500;width:100%;
  font-size:14px;transition:background .18s ease,color .18s ease;
}
.ni i{font-size:18px}
.ni:hover{background:var(--ac-soft)}
.ni.on{background:var(--ac-soft);color:var(--ac)}
.ni .ni-i{display:none}
.ni i.ti{color:inherit}
.sl{font-size:11px;color:var(--mu);font-weight:600;padding:16px 12px 6px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;background:rgba(120,120,128,.12);border-radius:9px;padding:2px;margin:0 4px 12px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:6px;border-radius:7px;font-weight:500;color:var(--mu);font-size:12px;transition:all .18s ease}
.seg button.on{background:var(--cd-solid);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.08),0 1px 1px rgba(0,0,0,.04)}
.ub{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px 4px;border-top:1px solid var(--bd)}
.ub>div{flex:1;line-height:1.25;min-width:0}
.ub b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ub .mu{font-size:11px}
.gb{border:0;background:transparent;font-size:17px;color:var(--mu);padding:6px;border-radius:8px;transition:all .18s}
.gb:hover{color:var(--no);background:rgba(255,59,48,.08)}
.av{
  display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,#0a84ff,#5e5ce6);
  color:#fff;font-size:13px;font-weight:600;flex:none;
}

section{background:var(--bg);min-width:0;display:flex;flex-direction:column}
.top{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:20px 32px;flex-wrap:wrap;border-bottom:1px solid var(--bd);
  background:rgba(245,245,247,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  position:sticky;top:0;z-index:10;
}
.top>b,.top div>b{font-size:15px;letter-spacing:-.02em}
main{padding:28px 32px 40px;flex:1;width:100%;max-width:1200px;margin:0 auto}

.cd{
  background:var(--cd-solid);border:1px solid var(--bd);border-radius:var(--r-lg);
  padding:22px;margin-bottom:18px;box-shadow:var(--sh-sm);transition:box-shadow .25s ease;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .cd{background:var(--bg-elev)}}
:root[data-theme="dark"] .cd{background:var(--bg-elev)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.g .cd{margin:0}
.st{border-top:0;position:relative;overflow:hidden}
.st::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--ac));border-radius:var(--r-lg) var(--r-lg) 0 0}
.g .st:nth-child(2){--c:#5e5ce6}
.g .st:nth-child(3){--c:#30b14b}
.st b{display:block;font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.15;margin-top:4px}
.mu{color:var(--mu);font-size:13px}
.no{color:var(--no)}
.ok{color:var(--ok)}

button,select,input,textarea{
  font:inherit;color:var(--tx);background:var(--cd-solid);
  border:1px solid var(--bd-strong);border-radius:var(--r-sm);
  padding:9px 13px;transition:all .18s ease;letter-spacing:-.01em;
}
button{cursor:pointer;font-weight:500}
button:hover:not(:disabled){border-color:var(--bd-strong);background:rgba(120,120,128,.06)}
button:disabled{opacity:.4;cursor:not-allowed}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px var(--ac-soft)}
button.p{background:var(--ac);border-color:transparent;color:#fff;font-weight:500;box-shadow:0 1px 2px rgba(0,113,227,.3),0 4px 12px rgba(0,113,227,.25)}
button.p:hover:not(:disabled){background:var(--ac2);filter:none}
textarea{resize:vertical}

.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--bd);white-space:nowrap;font-size:13.5px}
th{color:var(--mu);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:rgba(120,120,128,.05);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover td{background:rgba(0,113,227,.04)}

.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.f textarea{grid-column:1/-1;min-height:76px}

.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500;background:color-mix(in srgb,currentColor 14%,transparent)}
.Duyet{color:var(--ok)}
.Tu{color:var(--no)}
.Cho{color:var(--wa)}
.sm{padding:5px 11px;font-size:12px;border-radius:7px}

.lg{max-width:400px;margin:10vh auto;padding:36px;text-align:center;border-radius:var(--r-xl);background:var(--cd);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:var(--sh-lg)}
.lg input{width:100%;margin-bottom:10px;padding:12px 14px}
.lg h2{font-size:22px;margin-bottom:6px}
.lg .p{width:100%;padding:12px;border-radius:12px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal>div{min-height:84px;border:1px solid var(--bd);border-radius:12px;padding:8px;font-size:11px;overflow:hidden;background:var(--cd-solid);transition:all .18s}
.cal .h{min-height:0;border:0;text-align:center;color:var(--mu);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:transparent}
.cal .t{border-color:var(--ac);border-width:2px;background:var(--ac-soft)}
.cal .x{opacity:.25;border-style:dashed;background:transparent}
.ev{display:block;margin-top:4px;padding:2px 7px;border-radius:6px;background:rgba(48,177,75,.16);color:var(--ok);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ev.Cho{background:rgba(255,149,0,.16);color:var(--wa)}

.hero{
  position:relative;overflow:hidden;border-radius:var(--r-xl);min-height:220px;padding:32px;margin-bottom:22px;
  display:flex;flex-direction:column;justify-content:space-between;gap:24px;
  background:linear-gradient(135deg,#0a84ff 0%,#5e5ce6 50%,#bf5af2 100%);color:#fff;
  box-shadow:0 8px 24px rgba(10,132,255,.28),0 24px 60px rgba(94,92,230,.20);
}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 60%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:28px;margin:0;color:#fff;font-weight:600;letter-spacing:-.03em}
.hero p{margin:6px 0 0;opacity:.85;color:#fff;font-size:14px;text-transform:capitalize}
.hb{display:flex;gap:10px;flex-wrap:wrap}
.hb button{border-radius:99px;padding:10px 20px;font-weight:500;font-size:14px}
.wh{background:#fff;color:#0071e3;border-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.wh:hover{background:#f5f5f7}
.gl{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.gl:hover{background:rgba(255,255,255,.28)}

.row{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}

.an{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.an:last-child{border-bottom:0}
.an>div{flex:1;min-width:0}
.an b{font-size:14px;font-weight:500}
.an i{font-size:18px;color:var(--ac);background:var(--ac-soft);border-radius:10px;padding:8px;flex:none}
.qa{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  margin-bottom:8px;padding:14px 16px;border-radius:12px;
  border:1px solid var(--bd);background:var(--cd-solid);
}
.qa:hover{background:rgba(0,113,227,.04);border-color:var(--bd-strong)}
.qa span{flex:1;font-weight:500;font-size:14px}
.qa i:first-child{color:var(--ac);font-size:19px}
.qa i:last-child{color:var(--mu);font-size:15px}

.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:13px}
.mini i{font-style:normal;padding:7px 0;border-radius:50%;position:relative;font-variant-numeric:tabular-nums}
.mini .mh{color:var(--mu);font-size:11px;font-weight:600}
.mini .td{background:var(--ac);color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(0,113,227,.35)}
.mini .hv::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ok)}

.oc-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.oc{
  position:relative;background:var(--cd-solid);border:1px solid var(--bd);
  border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-sm);
  display:flex;flex-direction:column;gap:4px;min-height:180px;
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s;
}
.oc.ck{cursor:pointer}
.oc.ck:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.oc.ck:active{transform:scale(.98)}
.oc b{font-size:16px;margin-top:12px;font-weight:600;letter-spacing:-.02em}
.dt{position:absolute;top:16px;right:16px;font-size:11px;font-weight:600;color:var(--ok);display:flex;align-items:center;gap:4px}
.dt.w{color:var(--wa)}
.ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.ic.b{background:linear-gradient(135deg,#0a84ff,#5e5ce6)}
.ic.p{background:linear-gradient(135deg,#bf5af2,#5e5ce6)}
.ic.n{background:linear-gradient(135deg,#5e5ce6,#3634a3)}
.ic.g{background:linear-gradient(135deg,#30d158,#0a9f3a)}
.ic.o{background:linear-gradient(135deg,#ff9f0a,#ff6b00)}
.oa{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:14px}
.oa button{border-radius:99px;padding:7px 15px;font-size:13px;font-weight:500}

.ac4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.ac{
  display:flex;flex-direction:column;justify-content:space-between;gap:22px;
  text-align:left;min-height:180px;padding:20px;border-radius:var(--r-lg);
  border:1px solid var(--bd);background:var(--cd-solid);box-shadow:var(--sh-sm);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s;
}
.ac:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:var(--bd-strong)}
.ac:active{transform:scale(.98)}
.acr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tile{
  width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:23px;
  background:linear-gradient(135deg,var(--tc),color-mix(in srgb,var(--tc) 65%,#000));
  box-shadow:0 6px 16px color-mix(in srgb,var(--tc) 35%,transparent);
}
.bd{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ok)}
.bd::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.bd.wa{color:var(--wa)}
.ac b{font-size:17px;font-weight:600;letter-spacing:-.02em}

.bars{display:flex;gap:10px;align-items:flex-end;height:190px}
.bc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;gap:4px;min-width:0}
.bv{width:100%;max-width:44px;background:linear-gradient(180deg,var(--ac),var(--ac2));border-radius:8px 8px 3px 3px;min-height:3px;box-shadow:0 2px 8px rgba(0,113,227,.25)}
.bc b{font-weight:600;font-size:12px}
.bc span{color:var(--mu);font-size:11px}
.hb2{display:grid;grid-template-columns:120px 1fr 44px;gap:12px;align-items:center;margin-bottom:10px;font-size:13px}
.hb2>div{background:rgba(120,120,128,.14);border-radius:99px;height:8px;overflow:hidden}
.hb2 i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.hb2 b{font-weight:600;font-size:13px;text-align:right}

.cmd{
  position:sticky;bottom:16px;margin:8px 32px 20px;padding:12px 16px;
  background:var(--cd);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);
}
.cmdr{display:flex;gap:10px;align-items:center}
.cmdr input{flex:1;border:0;padding:8px 4px;background:transparent;font-size:14px;box-shadow:none}
.cmdr input:focus{outline:0;box-shadow:none}
.send{width:32px;height:32px;border-radius:9px;background:var(--ac);color:#fff;border:0;display:grid;place-items:center;padding:0;transition:all .18s}
.send:hover{background:var(--ac2);transform:scale(1.05)}
.chips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chips button{border:0;background:rgba(120,120,128,.10);color:var(--mu);font-weight:500;font-size:12px;padding:5px 13px;border-radius:99px}
.chips button:hover{color:var(--ac);background:var(--ac-soft)}

.hh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.clk{text-align:right}
.clk b{display:block;font-size:38px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.lang{font-size:13px;padding:7px 15px;border-radius:99px;font-weight:500;background:var(--cd-solid)}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  aside{
    flex-direction:row;height:auto;position:sticky;top:0;z-index:20;overflow-x:auto;
    border-right:0;border-bottom:1px solid var(--bd);padding:8px 10px;gap:4px;
    -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  }
  .brand,.ub{display:none}
  .ni{width:auto;white-space:nowrap;padding:8px 12px;font-size:13px}
  .sl{display:none}
  .seg{margin:0;flex:0 0 auto;padding:2px}
  .seg button{padding:6px 10px;white-space:nowrap}
  .row{grid-template-columns:1fr}
  .top{padding:14px 18px}
  main{padding:18px 16px 32px}
  .cd{padding:18px;border-radius:16px}
  .hero{padding:24px;min-height:190px;border-radius:22px}
  .hero h2{font-size:24px}
  .clk b{font-size:30px}
  .cmd{margin:8px 16px 16px}
  .lg{margin:6vh 16px}
  .oc-g,.ac4{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){
  .oc-g,.ac4{grid-template-columns:1fr}
  .cal>div{min-height:68px;padding:5px;font-size:10px}
  .hero h2{font-size:22px}
  th,td{padding:10px 10px;font-size:12.5px}
}

main{animation:fadeIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cd{animation:cardIn .35s cubic-bezier(.2,.8,.2,1) both}
.cd:nth-child(2){animation-delay:.04s}
.cd:nth-child(3){animation-delay:.08s}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(120,120,128,.3);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(120,120,128,.5);background-clip:padding-box;border:2px solid transparent}
::-webkit-scrollbar-track{background:transparent}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
