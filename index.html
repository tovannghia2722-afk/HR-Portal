<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>HR Portal</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--cd:#fff;--tx:#1b1f3b;--mu:#6b7194;--bd:#e6e8f2;--ac:#4f46e5;--ac2:#7c3aed;--ok:#16a34a;--no:#dc2626;--wa:#d97706;--sh:0 1px 2px rgba(27,31,59,.05),0 6px 20px rgba(27,31,59,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1020;--cd:#171a30;--tx:#eceefb;--mu:#9aa0c4;--bd:#262a48;--ac:#818cf8;--ac2:#a78bfa;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1020;--cd:#171a30;--tx:#eceefb;--mu:#9aa0c4;--bd:#262a48;--ac:#818cf8;--ac2:#a78bfa;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--cd);border-bottom:1px solid var(--bd);box-shadow:var(--sh)}
h1{font-size:18px;margin:0;display:flex;align-items:center;font-weight:600}h2{font-size:16px;margin:0 0 12px;font-weight:600}
.logo{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:600;font-size:14px;margin-right:10px}
.logo.big{width:58px;height:58px;font-size:20px;border-radius:16px;margin:0 auto 14px;display:flex}
.us{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.av{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;font-size:13px;font-weight:500}
nav{display:flex;gap:6px;padding:14px 20px 6px;overflow-x:auto;max-width:1040px;margin:auto}nav button{white-space:nowrap;border:0;background:transparent;color:var(--mu);padding:8px 16px;border-radius:999px;font-weight:500}
nav button:hover{background:color-mix(in srgb,var(--ac) 10%,transparent);color:var(--tx)}nav button.on{background:var(--ac);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--ac) 40%,transparent)}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;transition:all .15s}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--ac) 45%,transparent);border-color:var(--ac)}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff;font-weight:500}button.p:hover{filter:brightness(1.08)}
main{padding:6px 20px 32px;max-width:1040px;margin:auto}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}.g .cd{margin:0}
.st{border-top:4px solid var(--c,var(--ac))}.g .st:nth-child(2){--c:var(--wa)}.g .st:nth-child(3){--c:var(--ok)}
.st b{display:block;font-size:32px;font-weight:600;line-height:1.2}.mu{color:var(--mu);font-size:13px}.no{color:var(--no)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}tbody tr:hover td{background:color-mix(in srgb,var(--ac) 6%,transparent)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.f textarea{grid-column:1/-1;min-height:70px}
.tag{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:500;background:color-mix(in srgb,currentColor 12%,transparent)}.Duyet{color:var(--ok)}.Tu{color:var(--no)}.Cho{color:var(--wa)}
.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.lg{max-width:400px;margin:8vh auto;padding:30px;text-align:center}.lg input{width:100%;margin-bottom:10px}.lg h2{font-size:20px;margin-bottom:4px}.lg .p{width:100%;padding:11px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal>div{min-height:78px;border:1px solid var(--bd);border-radius:12px;padding:6px;font-size:11px;overflow:hidden}
.cal .h{min-height:0;border:0;text-align:center;color:var(--mu);font-weight:500}.cal .t{border:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent)}.cal .x{opacity:.35;border-style:dashed}
.ev{display:block;margin-top:3px;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--ok) 22%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev.Cho{background:color-mix(in srgb,var(--wa) 25%,transparent)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head><body><div id="app"><p style="padding:20px">Đang tải...</p></div>
<script>
const URL_="https://mpbderzyyldygoqlgzxk.supabase.co",KEY="sb_publishable_lOB0LPHLZU33v9nZno0KNQ_iSCaJOqq",QUOTA=12;
const sb=supabase.createClient(URL_,KEY);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),td=iso(new Date());
let ME=null,P=[],L=[],C=[],A=[],SL=[],T="home",MSG="",CM=new Date(),PM=td.slice(0,7);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const em=id=>P.find(e=>e.id==id)||{name:"?"},sal=id=>SL.find(x=>x.user_id==id)||{sal:0,al:0},vnd=n=>Number(n).toLocaleString("vi-VN")+" ₫",hr=()=>ME&&ME.role=="hr",v=i=>document.getElementById(i).value.trim();
const LT={Duyet:"Đã duyệt",Tu:"Từ chối",Cho:"Chờ duyệt"};
function dl(f,o){const a=[],d=new Date(f+"T12:00:00"),e=new Date(o+"T12:00:00");while(d<=e){if(d.getDay()%6)a.push(iso(d));d.setDate(d.getDate()+1)}return a}
const used=id=>L.filter(l=>l.user_id==id&&l.type=="Phép năm"&&l.status!="Tu"&&l.from_date.slice(0,4)==td.slice(0,4)).reduce((s,l)=>s+dl(l.from_date,l.to_date).length,0);
function go(t){T=t;MSG="";draw()}
async function load(){const u=(await sb.auth.getUser()).data.user;if(!u){ME=null;return draw()}
const r=await Promise.all([sb.from("profiles").select("*").order("name"),sb.from("leaves").select("*").order("id",{ascending:false}),sb.rpc("team_calendar"),sb.from("announcements").select("*").order("id",{ascending:false}),sb.from("salaries").select("*")]);
const er=r.find(x=>x.error);if(er)MSG="Lỗi tải dữ liệu: "+er.error.message;
[P,L,C,A,SL]=r.map(x=>x.data||[]);ME=P.find(x=>x.id==u.id)||null;if(!ME&&!er)MSG="Không tìm thấy hồ sơ của tài khoản này";draw()}
function draw(){const A_=document.getElementById("app");
if(!ME){A_.innerHTML=`<div class="cd lg"><div class="logo big">HR</div><h2>Đăng nhập HR Portal</h2><p class="mu" style="margin:0 0 16px">Cổng nhân sự nội bộ</p><input id="le" placeholder="Email" type="email"><input id="lp" type="password" placeholder="Mật khẩu" onkeydown="if(event.key=='Enter')login()"><p class="no">${esc(MSG)}</p><button class="p" onclick="login()">Đăng nhập</button></div>`;return}
const tabs=[["home","Tổng quan"],["cal","Lịch nghỉ"],["leave","Đơn nghỉ phép"],["pay","Bảng lương"]];if(hr())tabs.push(["emp","Nhân viên"]);
A_.innerHTML=`<header><h1><span class="logo">HR</span>HR Portal</h1><div class="us"><span class="av">${esc(ME.name.trim().charAt(0).toUpperCase())}</span>${esc(ME.name)} <span class="tag">${hr()?"Quản lý":"Nhân viên"}</span> <button class="sm" onclick="logout()">Đăng xuất</button></div></header><nav>${tabs.map(x=>`<button class="${x[0]==T?"on":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}</nav><main>${MSG?`<p class="no">${esc(MSG)}</p>`:""}${V[T]()}</main>`}
async function login(){MSG="";const r=await sb.auth.signInWithPassword({email:v("le"),password:v("lp")});if(r.error){MSG="Sai email hoặc mật khẩu";return draw()}await load()}
async function logout(){await sb.auth.signOut();ME=null;T="home";MSG="";draw()}
const V={
home(){const p=L.filter(l=>l.status=="Cho"&&(hr()||l.user_id==ME.id)).length,o=C.filter(l=>l.status=="Duyet"&&dl(l.from_date,l.to_date).includes(td)).map(l=>l.name);
return`<div class="g"><div class="cd st">${hr()?`<b>${P.length}</b><span class="mu">Nhân viên</span>`:`<b>${QUOTA-used(ME.id)}/${QUOTA}</b><span class="mu">Ngày phép năm còn lại</span>`}</div><div class="cd st"><b>${p}</b><span class="mu">${hr()?"Đơn chờ duyệt":"Đơn của tôi chờ duyệt"}</span></div><div class="cd st"><b>${o.length}</b><span class="mu">Nghỉ hôm nay${o.length?": "+esc(o.join(", ")):""}</span></div></div><div class="cd"><h2>Thông báo</h2>${A.map(a=>`<p><b>${esc(a.title)}</b> <span class="mu">${a.created_at.slice(0,10)}</span> ${hr()?`<button class="sm" onclick="delAnn(${a.id})">Xóa</button>`:""}</p>`).join("")||`<p class="mu">Chưa có thông báo</p>`}${hr()?`<div class="f"><input id="at" placeholder="Nội dung thông báo"><button class="p" onclick="addAnn()">Đăng</button></div>`:""}</div>`},
cal(){const y=CM.getFullYear(),m=CM.getMonth(),ev={};C.forEach(l=>dl(l.from_date,l.to_date).forEach(d=>(ev[d]=ev[d]||[]).push({n:l.name.split(" ").pop(),s:l.status})));
const first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();let c="";for(let i=0;i<first;i++)c+="<div class='x'></div>";
for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d));c+=`<div class="${k==td?"t":""}"><b>${d}</b>${(ev[k]||[]).map(e=>`<span class="ev ${e.s}">${esc(e.n)}</span>`).join("")}</div>`}
return`<div class="cd"><h2><button class="sm" onclick="mv(-1)">‹</button> Tháng ${m+1}/${y} <button class="sm" onclick="mv(1)">›</button></h2><div class="cal">${["T2","T3","T4","T5","T6","T7","CN"].map(x=>`<div class="h">${x}</div>`).join("")}${c}</div><p class="mu">Xanh: đã duyệt. Cam: chờ duyệt.</p></div>`},
leave(){return`<div class="cd"><h2>Xin nghỉ phép</h2><p class="mu">Phép năm còn lại: ${QUOTA-used(ME.id)}/${QUOTA} ngày (không tính thứ Bảy, Chủ Nhật)</p><div class="f"><select id="lt"><option>Phép năm</option><option>Nghỉ ốm</option><option>Nghỉ không lương</option></select><input id="lf" type="date" value="${td}"><input id="lo" type="date" value="${td}"><textarea id="lr" placeholder="Lý do"></textarea></div><button class="p" onclick="addLv()">Gửi đơn</button></div><div class="cd"><h2>${hr()?"Tất cả đơn":"Đơn của tôi"}</h2><div class="tw"><table><thead><tr><th>Nhân viên</th><th>Loại</th><th>Từ</th><th>Đến</th><th>Ngày</th><th>Lý do</th><th>Trạng thái</th><th></th></tr></thead><tbody>${L.map(l=>`<tr><td>${esc(em(l.user_id).name)}</td><td>${esc(l.type)}</td><td>${l.from_date}</td><td>${l.to_date}</td><td>${dl(l.from_date,l.to_date).length}</td><td>${esc(l.reason)}</td><td><span class="tag ${l.status}">${LT[l.status]}</span></td><td>${l.status=="Cho"?(hr()?`<button class="sm" onclick="dec(${l.id},'Duyet')">Duyệt</button> <button class="sm" onclick="dec(${l.id},'Tu')">Từ chối</button>`:`<button class="sm" onclick="cancel(${l.id})">Hủy</button>`):""}${hr()?` <button class="sm" onclick="if(confirm('Xóa đơn này?'))cancel(${l.id})">Xóa</button>`:""}</td></tr>`).join("")||`<tr><td colspan="8" class="mu">Chưa có đơn nào</td></tr>`}</tbody></table></div></div>`},
pay(){return`<div class="cd"><h2>Bảng lương</h2><div class="f"><input type="month" value="${PM}" onchange="PM=this.value;draw()"></div><p class="mu">Trừ nghỉ không lương theo 22 ngày công, bảo hiểm 10,5% lương cơ bản, chưa tính thuế TNCN.</p><div class="tw"><table><thead><tr><th>Nhân viên</th><th>Lương cơ bản</th><th>Phụ cấp</th><th>Nghỉ không lương</th><th>Bảo hiểm</th><th>Thực nhận</th></tr></thead><tbody>${P.filter(e=>hr()||e.id==ME.id).map(e=>{const s=sal(e.id),u=L.filter(l=>l.user_id==e.id&&l.status=="Duyet"&&l.type=="Nghỉ không lương").reduce((x,l)=>x+dl(l.from_date,l.to_date).filter(d=>d.slice(0,7)==PM).length,0),dd=Math.round(s.sal/22*u),b=Math.round(s.sal*.105);return`<tr><td>${esc(e.name)}</td><td>${vnd(s.sal)}</td><td>${vnd(s.al)}</td><td>${u} ngày (-${vnd(dd)})</td><td>-${vnd(b)}</td><td><b>${vnd(+s.sal+ +s.al-dd-b)}</b></td></tr>`}).join("")}</tbody></table></div></div>`},
emp(){return`<div class="cd"><h2>Danh sách nhân viên</h2><p class="mu">Thêm nhân viên mới: vào Supabase, Authentication, Users, Add user (tick Auto Confirm User). Quay lại đây để nhập họ tên, phòng ban, lương.</p><div class="tw"><table><thead><tr><th>Họ tên</th><th>Email</th><th>Phòng ban</th><th>Chức vụ</th><th>Vai trò</th><th>Lương</th><th>Phụ cấp</th></tr></thead><tbody>${P.map(e=>{const s=sal(e.id);return`<tr><td><input style="width:150px" value="${esc(e.name)}" onchange="upd('profiles','id','${e.id}','name',this.value)"></td><td>${esc(e.email)}</td><td><input style="width:110px" value="${esc(e.dept)}" onchange="upd('profiles','id','${e.id}','dept',this.value)"></td><td><input style="width:130px" value="${esc(e.pos)}" onchange="upd('profiles','id','${e.id}','pos',this.value)"></td><td><select ${e.id==ME.id?"disabled":""} onchange="upd('profiles','id','${e.id}','role',this.value)"><option value="nv" ${e.role=="nv"?"selected":""}>Nhân viên</option><option value="hr" ${e.role=="hr"?"selected":""}>Quản lý</option></select></td><td><input style="width:120px" type="number" value="${s.sal}" onchange="upd('salaries','user_id','${e.id}','sal',+this.value||0)"></td><td><input style="width:110px" type="number" value="${s.al}" onchange="upd('salaries','user_id','${e.id}','al',+this.value||0)"></td></tr>`}).join("")}</tbody></table></div></div>`}};
const mv=k=>{CM=new Date(CM.getFullYear(),CM.getMonth()+k,1);draw()};
async function run(p){const r=await p;MSG=r.error?"Lỗi: "+r.error.message:"";await load()}
const addAnn=()=>v("at")&&run(sb.from("announcements").insert({title:v("at")}));
const delAnn=id=>run(sb.from("announcements").delete().eq("id",id));
function addLv(){const f=v("lf"),o=v("lo"),t=v("lt"),n=f&&o&&o>=f?dl(f,o).length:-1;
if(n<0){MSG="Ngày không hợp lệ";return draw()}if(!n){MSG="Khoảng ngày chỉ có thứ Bảy, Chủ Nhật";return draw()}
if(t=="Phép năm"&&n>QUOTA-used(ME.id)){MSG="Không đủ ngày phép năm còn lại";return draw()}
run(sb.from("leaves").insert({type:t,from_date:f,to_date:o,reason:v("lr")}))}
const dec=(id,s)=>run(sb.from("leaves").update({status:s}).eq("id",id));
const cancel=id=>run(sb.from("leaves").delete().eq("id",id));
const upd=(tb,k,id,f,x)=>run(sb.from(tb).update({[f]:x}).eq(k,id));
sb.auth.getSession().then(load);
</script></body></html>
