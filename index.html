<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HR Portal Pro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f7;--cd:#fff;--tx:#1d1d1f;--mu:#6e6e73;--bd:rgba(0,0,0,.08);--ac:#0071e3;--ac2:#0077ed;--ok:#30b14b;--no:#ff3b30;--wa:#ff9500;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Be Vietnam Pro",sans-serif;--sh:0 2px 8px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--cd:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--bd:rgba(255,255,255,.1);--ac:#0a84ff;--ac2:#3395ff;--sh:0 2px 8px rgba(0,0,0,.4)}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h2{font-size:19px;margin:0 0 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd);padding-bottom:12px}h2 i{color:var(--ac)}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--cd);border-right:1px solid var(--bd);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-size:16px;font-weight:600}
.logo{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(10,132,255,.35)}
.ni{display:flex;align-items:center;gap:11px;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:10px;color:var(--tx);font-weight:500;width:100%;font-size:14px;cursor:pointer}
.ni:hover,.ni.on{background:rgba(0,113,227,.1);color:var(--ac)}
.ub{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px 4px;border-top:1px solid var(--bd)}
.av{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--ac);color:#fff;font-weight:600}
section{display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;border-bottom:1px solid var(--bd);background:var(--cd);position:sticky;top:0;z-index:10}
.top-title{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}.top-title i{color:var(--ac)}
main{padding:28px 32px;width:100%;max-width:1200px;margin:0 auto}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:var(--sh)}
.mu{color:var(--mu);font-size:13px}.no{color:var(--no)}.ok{color:var(--ok)}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:9px 13px;transition:all .18s}
button{cursor:pointer;font-weight:500}button:hover{background:rgba(120,120,128,.1)}button.p{background:var(--ac);color:#fff;border:0}button.p:hover{background:var(--ac2)}
.tw{overflow-x:auto;border-radius:14px;border:1px solid var(--bd);background:var(--cd)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--bd);font-size:13.5px}
th{font-weight:700;font-size:12px;text-transform:uppercase;background:rgba(120,120,128,.05)}
.tag{display:inline-flex;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(0,113,227,.1);color:var(--ac)}
.Duyet{color:var(--ok);background:rgba(48,177,75,.15)}.Tu{color:var(--no);background:rgba(255,59,48,.15)}.Cho{color:var(--wa);background:rgba(255,149,0,.15)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;border-radius:24px;padding:32px;margin-bottom:22px}
.hero h2{border:0;color:#fff;font-size:28px;padding:0;margin:0 0 10px}
.row{display:grid;grid-template-columns:1fr 340px;gap:20px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body><div id="app"><p style="padding:20px">Đang tải hệ thống...</p></div>
<script>
const sb = supabase.createClient("https://mpbderzyyldygoqlgzxk.supabase.co","sb_publishable_lOB0LPHLZU33v9nZno0KNQ_iSCaJOqq");
let ME=null, P=[], L=[], AT=[], SL=[], C=[], DB={}, HOL=new Set();
const td = new Date().toISOString().slice(0,10);
const PM = td.slice(0,7);
const v = id => document.getElementById(id).value;
const esc = s => String(s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vnd = n => Number(n).toLocaleString('vi-VN') + ' ₫';
const hr = () => ME && ME.role === 'hr';

async function load() {
  try {
    const u = (await sb.auth.getUser()).data.user;
    if(!u) { ME=null; return draw(); }
    const r = await Promise.all([
      sb.from("profiles").select("*"),
      sb.from("leaves").select("*"),
      sb.from("attendance").select("*"),
      sb.from("salaries").select("*"),
      sb.from("holidays").select("*"),
      sb.from("candidates").select("*"),
      sb.from("assets").select("*"),
      sb.from("assets_handover").select("*")
    ]);
    P = r[0].data||[]; L = r[1].data||[]; AT = r[2].data||[]; SL = r[3].data||[];
    HOL = new Set((r[4].data||[]).map(h=>h.day));
    DB = { candidates: r[5].data||[], assets: r[6].data||[], handovers: r[7].data||[] };
    ME = P.find(p => p.id === u.id) || null;
  } catch(e) { console.error(e); }
  draw();
}

function draw() {
  const A = document.getElementById("app");
  if(!ME) {
    A.innerHTML = `<div class="cd" style="max-width:400px;margin:10vh auto;text-align:center">
      <div class="logo" style="margin:0 auto 20px;width:60px;height:60px;font-size:20px">HR</div>
      <h2 style="justify-content:center">Đăng nhập</h2>
      <input id="le" placeholder="Email" style="width:100%;margin-bottom:10px">
      <input id="lp" type="password" placeholder="Mật khẩu" style="width:100%;margin-bottom:20px">
      <button class="p" style="width:100%;padding:12px" onclick="login()">Đăng nhập</button>
    </div>`; return;
  }
  
  const path = window.location.hash.replace('#','') || 'home';
  const titles = { home:'Tổng quan', emp:'Nhân viên', pay:'Bảng lương', leave:'Đơn từ', att:'Chấm công', as:'Tài sản' };
  const icons = { home:'ti-home', emp:'ti-users', pay:'ti-cash', leave:'ti-file-text', att:'ti-clock', as:'ti-laptop' };

  A.innerHTML = `<div class="app">
    <aside>
      <div class="brand"><span class="logo">HR</span> HR Portal</div>
      <button class="ni ${path=='home'?'on':''}" onclick="go('home')"><i class="ti ti-home"></i> Tổng quan</button>
      <button class="ni ${path=='leave'?'on':''}" onclick="go('leave')"><i class="ti ti-file-text"></i> Đơn từ</button>
      <button class="ni ${path=='att'?'on':''}" onclick="go('att')"><i class="ti ti-clock"></i> Chấm công GPS</button>
      <button class="ni ${path=='pay'?'on':''}" onclick="go('pay')"><i class="ti ti-cash"></i> Bảng lương</button>
      ${hr()?`
        <div style="font-size:11px;font-weight:700;color:var(--mu);padding:16px 12px 4px">QUẢN LÝ</div>
        <button class="ni ${path=='emp'?'on':''}" onclick="go('emp')"><i class="ti ti-users"></i> Nhân viên</button>
        <button class="ni ${path=='as'?'on':''}" onclick="go('as')"><i class="ti ti-laptop"></i> Tài sản</button>
      `:''}
      <div class="ub">
        <div class="av">${ME.name[0]}</div>
        <div style="flex:1"><b>${ME.name}</b><div class="mu">${hr()?'Admin':'Nhân viên'}</div></div>
        <button onclick="sb.auth.signOut().then(()=>location.reload())" style="border:0;background:transparent"><i class="ti ti-logout"></i></button>
      </div>
    </aside>
    <section>
      <div class="top">
        <div class="top-title"><i class="ti ${icons[path]}"></i> ${titles[path]}</div>
        <button onclick="location.reload()" class="mu" style="border:0;background:transparent">Tải lại</button>
      </div>
      <main>${renderPage(path)}</main>
    </section>
  </div>`;
}

function go(page) { window.location.hash = page; draw(); }

function renderPage(p) {
  if(p=='home') return `<div class="hero"><h2>Chào ${ME.name}</h2><p>Hệ thống HR Pro đã sẵn sàng.</p></div>`;
  
  if(p=='emp' && hr()) return `<div class="cd"><h2><i class="ti ti-users"></i> Danh sách nhân viên</h2>
    <div class="tw"><table><thead><tr><th>Họ tên</th><th>Email</th><th>Phòng ban</th><th>Quyền</th></tr></thead><tbody>
    ${P.map(e=>`<tr><td><b>${e.name}</b></td><td>${e.email}</td><td>${e.dept||'--'}</td><td>${e.role=='hr'?'<span class="tag">Quản lý</span>':'Nhân viên'}</td></tr>`).join('')}
    </tbody></table></div></div>`;

  if(p=='leave') return `<div class="cd"><h2><i class="ti ti-file-text"></i> Đơn xin nghỉ (Duyệt đa cấp)</h2>
    <div class="tw"><table><thead><tr><th>Nhân viên</th><th>Lý do</th><th>Trưởng phòng</th><th>HR</th><th>Giám đốc</th></tr></thead><tbody>
    ${L.map(l=>`<tr><td>${P.find(x=>x.id==l.user_id)?.name||'?'}</td><td>${l.reason}</td>
      <td><span class="tag ${l.manager_status||'Cho'}">${l.manager_status||'Chờ'}</span></td>
      <td><span class="tag ${l.status||'Cho'}">${l.status||'Chờ'}</span></td>
      <td><span class="tag ${l.director_status||'Cho'}">${l.director_status||'Chờ'}</span></td>
    </tr>`).join('')}</tbody></table></div></div>`;

  if(p=='pay') return `<div class="cd"><h2><i class="ti ti-cash"></i> Bảng lương (Có Hoa hồng, KPI)</h2>
    <div class="tw"><table><thead><tr><th>Nhân viên</th><th>Lương CB</th><th>Hoa hồng</th><th>KPI</th><th>Thực nhận</th></tr></thead><tbody>
    ${P.map(e=>{
      const s = SL.find(x=>x.user_id===e.id)||{};
      const net = (+s.sal||0) + (+s.commission||0) + (+s.kpi||0);
      return `<tr><td>${e.name}</td><td>${vnd(s.sal)}</td><td>${vnd(s.commission)}</td><td>${vnd(s.kpi)}</td><td><b style="color:var(--ok)">${vnd(net)}</b></td></tr>`
    }).join('')}</tbody></table></div></div>`;

  if(p=='att') return `<div class="cd"><h2><i class="ti ti-map-pin"></i> Chấm công GPS</h2>
    <p class="mu">Bạn phải ở trong bán kính 1000m của công ty.</p>
    <button class="p" style="margin-bottom:20px" onclick="checkIn()">📍 Chấm công ngay</button>
    <div class="tw"><table><thead><tr><th>Ngày</th><th>Nhân viên</th><th>Vị trí</th></tr></thead><tbody>
    ${AT.map(a=>`<tr><td>${a.day}</td><td>${P.find(x=>x.id==a.user_id)?.name||'?'}</td><td>${a.location||'N/A'}</td></tr>`).join('')}</tbody></table></div></div>`;

  if(p=='as' && hr()) return `<div class="cd"><h2><i class="ti ti-laptop"></i> Quản lý Tài sản & Upload File</h2>
    <p class="mu">Tính năng Upload hợp đồng và Bàn giao tài sản đã được kích hoạt.</p>
    <div class="f"><input type="file" id="ff"><button class="p" onclick="upload()">Upload</button></div>
    <div class="tw"><table><thead><tr><th>Thiết bị</th><th>Người nhận</th><th>Trạng thái</th></tr></thead><tbody>
    ${DB.handovers.map(h=>`<tr><td>${DB.assets.find(a=>a.id==h.asset_id)?.name||'?'}</td><td>${P.find(x=>x.id==h.user_id)?.name||'?'}</td><td><span class="tag">${h.status}</span></td></tr>`).join('')}</tbody></table></div></div>`;

  return `<p>Đang cập nhật...</p>`;
}

// CHỨC NĂNG CHẤM CÔNG GPS
function checkIn() {
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    await sb.from("attendance").insert({ user_id: ME.id, day: td, location: `${lat},${lng}`, check_in: new Date().toISOString() });
    alert("Chấm công thành công tại " + lat + "," + lng);
    load();
  }, err => alert("Vui lòng bật định vị GPS để chấm công!"));
}

// CHỨC NĂNG UPLOAD FILE
async function upload() {
  const f = document.getElementById('ff').files[0];
  if(!f) return alert("Chọn file đi!");
  const res = await sb.storage.from('hr-documents').upload(ME.id+'/'+Date.now()+'_'+f.name, f);
  if(!res.error) alert("Upload thành công!");
}

async function login() {
  await sb.auth.signInWithPassword({ email: v('le'), password: v('lp') });
  load();
}

// KHỞI ĐỘNG
sb.auth.onAuthStateChange(() => load());
</script>
</body>
</html>
