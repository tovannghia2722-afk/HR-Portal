<style>

.us{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.ev{display:block;margin-top:3px;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--ok) 22%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev.Cho{background:color-mix(in srgb,var(--wa) 25%,transparent)}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{background:var(--cd);border-right:1px solid var(--bd);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 24px;flex-wrap:wrap}

.hero::after{content:"";position:absolute;left:50%;top:48%;width:110px;height:110px;margin-left:-55px;border-radius:50%;background:radial-gradient(circle,#fff3c4 0%,rgba(255,200,120,.6) 45%,rgba(255,160,100,0) 70%);pointer-events:none}
.hero>*{position:relative;z-index:1}.hero h2{font-size:26px;margin:0;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.35)}.hero p{margin:4px 0 0;opacity:.92;text-transform:capitalize;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.hb{display:flex;gap:10px;flex-wrap:wrap}.hb button{border-radius:999px;padding:9px 18px;font-weight:500}.wh{background:#fff;color:#1b1f3b;border-color:#fff}.gl{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.4);backdrop-filter:blur(6px)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.rg{display:flex;align-items:center;gap:14px}.rg svg{flex:none}
.an{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}.an>div{flex:1}.an>i{font-size:20px;color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);border-radius:10px;padding:8px}
.qa{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;border-radius:12px}.qa span{flex:1}.qa i:first-child{color:var(--ac);font-size:20px}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}.mini i{font-style:normal;padding:6px 0;border-radius:50%;position:relative}.mini .mh{color:var(--mu);font-size:11px}
.mini .td{background:var(--ac);color:#fff;font-weight:600}.mini .hv::after{content:"";position:absolute;left:50%;bottom:1px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ok)}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{flex-direction:row;height:auto;position:static;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd);padding:10px}.brand{display:none}.ni{width:auto;white-space:nowrap}.ni.out{margin-top:0}.row{grid-template-columns:1fr}.top{padding:12px 16px}main{padding:6px 14px 28px}}

<script>

const sb=supabase.createClient(URL_,KEY);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),td=iso(new Date());

const em=id=>P.find(e=>e.id==id)||{name:"?"},sal=id=>SL.find(x=>x.user_id==id)||{sal:0,al:0},vnd=n=>Number(n).toLocaleString("vi-VN")+" ₫",hr=()=>ME&&ME.role=="hr",v=i=>document.getElementById(i).value.trim();

[P,L,C,A,SL]=r.map(x=>x.data||[]);ME=P.find(x=>x.id==u.id)||null;if(!ME&&!er)MSG="Không tìm thấy hồ sơ của tài khoản này";draw()}

home(){const p=L.filter(l=>l.status=="Cho"&&(hr()||l.user_id==ME.id)).length,o=C.filter(l=>l.status=="Duyet"&&dl(l.from_date,l.to_date).includes(td)).map(l=>l.name),u=used(ME.id),rem=QUOTA-u,hh=new Date().getHours(),g=hh<11?"Chào buổi sáng":hh<18?"Chào buổi chiều":"Chào buổi tối",fn=ME.name.trim().split(" ").pop(),cc=2*Math.PI*34;

<div class="row"><div><div class="g"><div class="cd st rg"><svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--bd)" stroke-width="8"/><circle cx="42" cy="42" r="34" fill="none" stroke="var(--ac)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${cc}" stroke-dashoffset="${cc*(1-rem/QUOTA)}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">${rem}/${QUOTA}</text></svg><div><b style="font-size:15px">Ngày phép còn lại</b><div class="mu">Đã dùng ${u} ngày</div></div></div><div class="cd st"><span class="mu">${hr()?"Đơn chờ duyệt":"Đơn của tôi chờ duyệt"}</span><b>${p}</b><span class="mu">${hr()?"Cần xử lý":"Đang chờ quản lý"}</span></div><div class="cd st"><span class="mu">Nghỉ hôm nay</span><b>${o.length}</b><span class="mu">${o.length?esc(o.join(", ")):"Cả đội đi làm"}</span></div></div>
<div class="cd"><h2>Tin thông báo</h2>${A.map(a=>`<div class="an"><i class="ti ti-speakerphone"></i><div><b>${esc(a.title)}</b><div class="mu">${a.created_at.slice(0,10)}</div></div>${hr()?`<button class="sm" onclick="delAnn(${a.id})">Xóa</button>`:""}</div>`).join("")||`<p class="mu">Chưa có thông báo</p>`}${hr()?`<div class="f"><input id="at" placeholder="Nội dung thông báo"><button class="p" onclick="addAnn()">Đăng</button></div>`:""}</div></div>

pay(){return`<div class="cd"><h2>Bảng lương</h2><div class="f"><input type="month" value="${PM}" onchange="PM=this.value;draw()"></div><p class="mu">Trừ nghỉ không lương theo 22 ngày công, bảo hiểm 10,5% lương cơ bản, chưa tính thuế TNCN.</p><div class="tw"><table><thead><tr><th>Nhân viên</th><th>Lương cơ bản</th><th>Phụ cấp</th><th>Nghỉ không lương</th><th>Bảo hiểm</th><th>Thực nhận</th></tr></thead><tbody>${P.filter(e=>hr()||e.id==ME.id).map(e=>{const s=sal(e.id),u=L.filter(l=>l.user_id==e.id&&l.status=="Duyet"&&l.type=="Nghỉ không lương").reduce((x,l)=>x+dl(l.from_date,l.to_date).filter(d=>d.slice(0,7)==PM).length,0),dd=Math.round(s.sal/22*u),b=Math.round(s.sal*.105);return`<tr><td>${esc(e.name)}</td><td>${vnd(s.sal)}</td><td>${vnd(s.al)}</td><td>${u} ngày (-${vnd(dd)})</td><td>-${vnd(b)}</td><td><b>${vnd(+s.sal+ +s.al-dd-b)}</b></td></tr>`}).join("")}</tbody></table></div></div>`},
emp(){return`<div class="cd"><h2>Danh sách nhân viên</h2><p class="mu">Thêm nhân viên mới: vào Supabase, Authentication, Users, Add user (tick Auto Confirm User). Quay lại đây để nhập họ tên, phòng ban, lương.</p><div class="tw"><table><thead><tr><th>Họ tên</th><th>Email</th><th>Phòng ban</th><th>Chức vụ</th><th>Vai trò</th><th>Lương</th><th>Phụ cấp</th></tr></thead><tbody>${P.map(e=>{const s=sal(e.id);return`<tr><td><input style="width:150px" value="${esc(e.name)}" onchange="upd('profiles','id','${e.id}','name',this.value)"></td><td>${esc(e.email)}</td><td><input style="width:110px" value="${esc(e.dept)}" onchange="upd('profiles','id','${e.id}','dept',this.value)"></td><td><input style="width:130px" value="${esc(e.pos)}" onchange="upd('profiles','id','${e.id}','pos',this.value)"></td><td><select ${e.id==ME.id?"disabled":""} onchange="upd('profiles','id','${e.id}','role',this.value)"><option value="nv" ${e.role=="nv"?"selected":""}>Nhân viên</option><option value="hr" ${e.role=="hr"?"selected":""}>Quản lý</option></select></td><td><input style="width:120px" type="number" value="${s.sal}" onchange="upd('salaries','user_id','${e.id}','sal',+this.value||0)"></td><td><input style="width:110px" type="number" value="${s.al}" onchange="upd('salaries','user_id','${e.id}','al',+this.value||0)"></td></tr>`}).join("")}</tbody></table></div></div>`}};
function mini(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),ev={};C.forEach(l=>dl(l.from_date,l.to_date).forEach(d=>ev[d]=1));const first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();let c=["T2","T3","T4","T5","T6","T7","CN"].map(x=>`<i class="mh">${x}</i>`).join("");for(let i=0;i<first;i++)c+="<i></i>";for(let d=1;d<=days;d++){const k=iso(new Date(y,m,d));c+=`<i class="md ${k==td?"td":""} ${ev[k]?"hv":""}">${d}</i>`}return`<div class="cd"><h2>Tháng ${m+1}, ${y}</h2><div class="mini">${c}</div><p class="mu" style="margin:8px 0 0">Chấm nhỏ: có người nghỉ</p></div>`}
const mv=k=>{CM=new Date(CM.getFullYear(),CM.getMonth()+k,1);draw()};
async function run(p){const r=await p;MSG=r.error?"Lỗi: "+r.error.message:"";await load()}
const addAnn=()=>v("at")&&run(sb.from("announcements").insert({title:v("at")}));
const delAnn=id=>run(sb.from("announcements").delete().eq("id",id));
function addLv(){const f=v("lf"),o=v("lo"),t=v("lt"),n=f&&o&&o>=f?dl(f,o).length:-1;
if(n<0){MSG="Ngày không hợp lệ";return draw()}if(!n){MSG="Khoảng ngày chỉ có thứ Bảy, Chủ Nhật";return draw()}
if(t=="Phép năm"&&n>QUOTA-used(ME.id)){MSG="Không đủ ngày phép năm còn lại";return draw()}
run(sb.from("leaves").insert({type:t,from_date:f,to_date:o,reason:v("lr")}))}
const dec=(id,s)=>run(sb.from("leaves").update({status:s}).eq("id",id));
const cancel=id=>run(sb.from("leaves").delete().eq("id",id));
const upd=(tb,k,id,f,x)=>run(sb.from(tb).update({[f]:x}).eq(k,id));
sb.auth.getSession().then(load);
</script></body></html>
