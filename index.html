<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>HR Portal</title>
<style>
:root{--bg:#f6f7f9;--cd:#fff;--tx:#1a1d23;--mu:#667085;--bd:#e4e7ec;--ac:#2563eb;--ok:#16a34a;--no:#dc2626;--wa:#d97706;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--cd:#181b21;--tx:#e8eaee;--mu:#98a2b3;--bd:#2a2f38;--ac:#5b8def;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--cd:#181b21;--tx:#e8eaee;--mu:#98a2b3;--bd:#2a2f38;--ac:#5b8def;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--cd);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0}h2{font-size:16px;margin:0 0 10px}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}nav button{white-space:nowrap}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:7px 11px}
button{cursor:pointer}button.on,button.p{background:var(--ac);border-color:var(--ac);color:#fff}
main{padding:0 16px 24px;max-width:1000px;margin:auto}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.st b{display:block;font-size:26px}.mu{color:var(--mu);font-size:13px}.no{color:var(--no)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:13px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}.f textarea{grid-column:1/-1}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}.Duyet{color:var(--ok)}.Tu{color:var(--no)}.Cho{color:var(--wa)}
.sm{padding:3px 8px;font-size:12px}
.lg{max-width:380px;margin:60px auto}.lg input{width:100%;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal>div{min-height:72px;border:1px solid var(--bd);border-radius:8px;padding:4px;font-size:11px;overflow:hidden}
.cal .h{min-height:0;border:0;text-align:center;color:var(--mu)}.cal .t{border-color:var(--ac)}.cal .x{opacity:.45}
.ev{display:block;margin-top:2px;padding:1px 4px;border-radius:4px;background:color-mix(in srgb,var(--ok) 22%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev.Cho{background:color-mix(in srgb,var(--wa) 25%,transparent)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head><body><div id="app"><p style="padding:20px">Đang tải...</p></div>
<script>
const URL_="https://mpbderzyyldygoqlgzxk.supabase.co",KEY="sb_publishable_lOB0LPHLZU33v9nZno0KNQ_iSCaJOqq",QUOTA=12;
const sb=supabase.createClient(URL_,KEY);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),td=iso(new Date());
let ME=null,P=[],L=[],C=[],A=[],SL=[],T="home",MSG="",CM=new Date(),PM=td.slice(0,7);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const em=id=>P.find(e=>e.id==id)||{name:"?"},sal=id=>SL.find(x=>x.user_id==id)||{sal:0,al:0},vnd=n=>Number(n).toLocaleString("vi-VN")+" ₫",hr=()=>ME&&ME.role=="hr",v=i=>document.getElementById(i).value.trim();
const LT={Duyet:"Đã duyệt",Tu:"Từ chối",Cho:"Chờ duyệt"};
function dl(f,o){const a=[],d=new Date(f+"T12:00:00"),e=new Date(o+"T12:00:00");while(d<=e){if(d.getDay()%6)a.push(iso(d));d.setDate(d.getDate()+1)}return a}
const used=id=>L.filter(l=>l.user_id==id&&l.type=="Phép năm"&&l.status!="Tu"&&l.from_date.slice(0,4)==td.slice(0,4)).reduce((s,l)=>s+dl(l.from_date,l.to_date).length,0);
function go(t){T=t;MSG="";draw()}
async function load(){const u=(await sb.auth.getUser()).data.user;if(!u){ME=null;return draw()}
const r=await Promise.all([sb.from("profiles").select("*").order("name"),sb.from("leaves").select("*").order("id",{ascending:false}),sb.rpc("team_calendar"),sb.from("announcements").select("*").order("id",{ascending:false}),sb.from("salaries").select("*")]);
const er=r.find(x=>x.error);if(er)MSG="Lỗi tải dữ liệu: "+er.error.message;
[P,L,C,A,SL]=r.map(x=>x.data||[]);ME=P.find(x=>x.id==u.id)||null;if(!ME&&!er)MSG="Không tìm thấy hồ sơ của tài khoản này";draw()}
function draw(){const A_=document.getElementById("app");
if(!ME){A_.innerHTML=`<div class="cd lg"><h2>Đăng nhập HR Portal</h2><input id="le" placeholder="Email" type="email"><input id="lp" type="password" placeholder="Mật khẩu" onkeydown="if(event.key=='Enter')login()"><p class="no">${esc(MSG)}</p><button class="p" onclick="login()">Đăng nhập</button></div>`;return}
const tabs=[["home","Tổng quan"],["cal","Lịch nghỉ"],["leave","Đơn nghỉ phép"],["pay","Bảng lương"]];if(hr())tabs.push(["emp","Nhân viên"]);
A_.innerHTML=`<header><h1>HR Portal</h1><div>${esc(ME.name)} <span class="tag">${hr()?"Quản lý":"Nhân viên"}</span> <button class="sm" onclick="logout()">Đăng xuất</button></div></header><nav>${tabs.map(x=>`<button class="${x[0]==T?"on":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}</nav><main>${MSG?`<p class="no">${esc(MSG)}</p>`:""}${V[T]()}</main>`}
async function login(){MSG="";const r=await sb.auth.signInWithPassword({email:v("le"),password:v("lp")});if(r.error){MSG="Sai email hoặc mật khẩu";return draw()}await load()}
async function logout(){await sb.auth.signOut();ME=null;T="home";MSG="";draw()}
const V={
home(){const p=L.filter(l=>l.status=="Cho"&&(hr()||l.user_id==ME.id)).length,o=C.filter(l=>l.status=="Duyet"&&dl(l.from_date,l.to_date).includes(td)).map(l=>l.name);
return`<div class="g"><div class="cd st">${hr()?`<b>${P.length}</b><span class="mu">Nhân viên</span>`:`<b>${QUOTA-used(ME.id)}/${QUOTA}</b><span class="mu">Ngày phép năm còn lại</span>`}</div><div class="cd st"><b>${p}</b><span class="mu">${hr()?"Đơn chờ duyệt":"Đơn của tôi chờ duyệt"}</span></div><div class="cd st"><b>${o.length}</b><span class="mu">Nghỉ hôm nay${o.length?": "+esc(o.join(", ")):""}</span></div></div><div class="cd"><h2>Thông báo</h2>${A.map(a=>`<p><b>${esc(a.title)}</b> <span class="mu">${a.created_at.slice(0,10)}</span> ${hr()?`<button class="sm" onclick="delAnn(${a.id})">Xóa</button>`:""}</p>`).join("")||`<p class="mu">Chưa có thông báo</p>`}${hr()?`<div class="f"><input id="at" placeholder="Nội dung thông báo"><button class="p" onclick="addAnn()">Đăng</button></div>`:""}</div>`},
cal(){const y=CM.getFullYear(),m=CM.getMonth(),ev={};C.forEach(l=>dl(l.from_date,l.to_date).forEach(d=>(ev[d]=ev[d]||[]).push({n:l.name.split(" ").pop(),s:l.status})));
const first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();let c="";for(let i=0;i<first;i++)c+="<div class='x'></div>";
for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d));c+=`<div class="${k==td?"t":""}"><b>${d}</b>${(ev[k]||[]).map(e=>`<span class="ev ${e.s}">${esc(e.n)}</span>`).join("")}</div>`}
return`<div class="cd"><h2><button class="sm" onclick="mv(-1)">‹</button> Tháng ${m+1}/${y} <button class="sm" onclick="mv(1)">›</button></h2><div class="cal">${["T2","T3","T4","T5","T6","T7","CN"].map(x=>`<div class="h">${x}</div>`).join("")}${c}</div><p class="mu">Xanh: đã duyệt. Cam: chờ duyệt.</p></div>`},
leave(){return`<div class="cd"><h2>Xin nghỉ phép</h2><p class="mu">Phép năm còn lại: ${QUOTA-used(ME.id)}/${QUOTA} ngày (không tính thứ Bảy, Chủ Nhật)</p><div class="f"><select id="lt"><option>Phép năm</option><option>Nghỉ ốm</option><option>Nghỉ không lương</option></select><input id="lf" type="date" value="${td}"><input id="lo" type="date" value="${td}"><textarea id="lr" placeholder="Lý do"></textarea></div><button class="p" onclick="addLv()">Gửi đơn</button></div><div class="cd"><h2>${hr()?"Tất cả đơn":"Đơn của tôi"}</h2><div class="tw"><table><thead><tr><th>Nhân viên</th><th>Loại</th><th>Từ</th><th>Đến</th><th>Ngày</th><th>Lý do</th><th>Trạng thái</th><th></th></tr></thead><tbody>${L.map(l=>`<tr><td>${esc(em(l.user_id).name)}</td><td>${esc(l.type)}</td><td>${l.from_date}</td><td>${l.to_date}</td><td>${dl(l.from_date,l.to_date).length}</td><td>${esc(l.reason)}</td><td><span class="tag ${l.status}">${LT[l.status]}</span></td><td>${l.status=="Cho"?(hr()?`<button class="sm" onclick="dec(${l.id},'Duyet')">Duyệt</button> <button class="sm" onclick="dec(${l.id},'Tu')">Từ chối</button>`:`<button class="sm" onclick="cancel(${l.id})">Hủy</button>`):""}</td></tr>`).join("")||`<tr><td colspan="8" class="mu">Chưa có đơn nào</td></tr>`}</tbody></table></div></div>`},
pay(){return`<div class="cd"><h2>Bảng lương</h2><div class="f"><input type="month" value="${PM}" onchange="PM=this.value;draw()"></div><p class="mu">Trừ nghỉ không lương theo 22 ngày công, bảo hiểm 10,5% lương cơ bản, chưa tính thuế TNCN.</p><div class="tw"><table><thead><tr><th>Nhân viên</th><th>Lương cơ bản</th><th>Phụ cấp</th><th>Nghỉ không lương</th><th>Bảo hiểm</th><th>Thực nhận</th></tr></thead><tbody>${P.filter(e=>hr()||e.id==ME.id).map(e=>{const s=sal(e.id),u=L.filter(l=>l.user_id==e.id&&l.status=="Duyet"&&l.type=="Nghỉ không lương").reduce((x,l)=>x+dl(l.from_date,l.to_date).filter(d=>d.slice(0,7)==PM).length,0),dd=Math.round(s.sal/22*u),b=Math.round(s.sal*.105);return`<tr><td>${esc(e.name)}</td><td>${vnd(s.sal)}</td><td>${vnd(s.al)}</td><td>${u} ngày (-${vnd(dd)})</td><td>-${vnd(b)}</td><td><b>${vnd(+s.sal+ +s.al-dd-b)}</b></td></tr>`}).join("")}</tbody></table></div></div>`},
emp(){return`<div class="cd"><h2>Danh sách nhân viên</h2><p class="mu">Thêm nhân viên mới: vào Supabase, Authentication, Users, Add user (tick Auto Confirm User). Quay lại đây để nhập họ tên, phòng ban, lương.</p><div class="tw"><table><thead><tr><th>Họ tên</th><th>Email</th><th>Phòng ban</th><th>Chức vụ</th><th>Vai trò</th><th>Lương</th><th>Phụ cấp</th></tr></thead><tbody>${P.map(e=>{const s=sal(e.id);return`<tr><td><input style="width:150px" value="${esc(e.name)}" onchange="upd('profiles','id','${e.id}','name',this.value)"></td><td>${esc(e.email)}</td><td><input style="width:110px" value="${esc(e.dept)}" onchange="upd('profiles','id','${e.id}','dept',this.value)"></td><td><input style="width:130px" value="${esc(e.pos)}" onchange="upd('profiles','id','${e.id}','pos',this.value)"></td><td><select ${e.id==ME.id?"disabled":""} onchange="upd('profiles','id','${e.id}','role',this.value)"><option value="nv" ${e.role=="nv"?"selected":""}>Nhân viên</option><option value="hr" ${e.role=="hr"?"selected":""}>Quản lý</option></select></td><td><input style="width:120px" type="number" value="${s.sal}" onchange="upd('salaries','user_id','${e.id}','sal',+this.value||0)"></td><td><input style="width:110px" type="number" value="${s.al}" onchange="upd('salaries','user_id','${e.id}','al',+this.value||0)"></td></tr>`}).join("")}</tbody></table></div></div>`}};
const mv=k=>{CM=new Date(CM.getFullYear(),CM.getMonth()+k,1);draw()};
async function run(p){const r=await p;MSG=r.error?"Lỗi: "+r.error.message:"";await load()}
const addAnn=()=>v("at")&&run(sb.from("announcements").insert({title:v("at")}));
const delAnn=id=>run(sb.from("announcements").delete().eq("id",id));
function addLv(){const f=v("lf"),o=v("lo"),t=v("lt"),n=f&&o&&o>=f?dl(f,o).length:-1;
if(n<0){MSG="Ngày không hợp lệ";return draw()}if(!n){MSG="Khoảng ngày chỉ có thứ Bảy, Chủ Nhật";return draw()}
if(t=="Phép năm"&&n>QUOTA-used(ME.id)){MSG="Không đủ ngày phép năm còn lại";return draw()}
run(sb.from("leaves").insert({type:t,from_date:f,to_date:o,reason:v("lr")}))}
const dec=(id,s)=>run(sb.from("leaves").update({status:s}).eq("id",id));
const cancel=id=>run(sb.from("leaves").delete().eq("id",id));
const upd=(tb,k,id,f,x)=>run(sb.from(tb).update({[f]:x}).eq(k,id));
sb.auth.getSession().then(load);
</script></body></html>
