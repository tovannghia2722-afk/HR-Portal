<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>HR Portal</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"HR Portal","short_name":"HR","start_url":".","display":"standalone","background_color":"#f5f5f7","theme_color":"#0071e3","icons":[{"src":"https://ui-avatars.com/api/?name=HR&background=0a84ff&color=fff&size=192","sizes":"192x192","type":"image/png"}]}'>
<link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=HR&background=0a84ff&color=fff&size=192">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f7;--bg-elev:#fff;--cd:rgba(255,255,255,.72);--cd-solid:#fff;--tx:#1d1d1f;--mu:#6e6e73;--bd:rgba(0,0,0,.07);--bd-strong:rgba(0,0,0,.12);--ac:#0071e3;--ac2:#0077ed;--ac-soft:rgba(0,113,227,.10);--ok:#30b14b;--no:#ff3b30;--wa:#ff9500;--sh-sm:0 1px 2px rgba(0,0,0,.04);--sh:0 2px 8px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.06);--sh-lg:0 4px 16px rgba(0,0,0,.06),0 24px 60px rgba(0,0,0,.10);--r-sm:10px;--r:14px;--r-lg:20px;--r-xl:28px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Be Vietnam Pro",system-ui,sans-serif;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--bg-elev:#1c1c1e;--cd:rgba(28,28,30,.72);--cd-solid:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--bd:rgba(255,255,255,.08);--bd-strong:rgba(255,255,255,.16);--ac:#0a84ff;--ac2:#3395ff;--ac-soft:rgba(10,132,255,.16);--ok:#30d158;--no:#ff453a;--wa:#ff9f0a;--sh-sm:0 1px 2px rgba(0,0,0,.4);--sh:0 2px 8px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);--sh-lg:0 4px 16px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--bg-elev:#1c1c1e;--cd:rgba(28,28,30,.72);--cd-solid:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--bd:rgba(255,255,255,.08);--bd-strong:rgba(255,255,255,.16);--ac:#0a84ff;--ac2:#3395ff;--ac-soft:rgba(10,132,255,.16);--ok:#30d158;--no:#ff453a;--wa:#ff9f0a;--sh-sm:0 1px 2px rgba(0,0,0,.4);--sh:0 2px 8px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);--sh-lg:0 4px 16px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0 0 18px;display:flex;align-items:center;gap:10px;color:var(--tx);border:0;padding:0 0 0 14px;position:relative}
h2::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:4px;border-radius:4px;background:linear-gradient(180deg,var(--ac),#5e5ce6)}
h2 i{color:var(--ac);font-size:20px;background:var(--ac-soft);border-radius:8px;padding:6px}
h2 .badge{margin-left:auto;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--ac-soft);color:var(--ac);letter-spacing:0}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh;background:var(--bg)}
aside{background:var(--cd);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-right:1px solid var(--bd);padding:20px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-size:16px;font-weight:600;letter-spacing:-.02em}
.logo{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-weight:600;font-size:13px;box-shadow:0 4px 12px rgba(10,132,255,.35)}
.logo.big{width:64px;height:64px;font-size:22px;border-radius:18px;margin:0 auto 16px;display:flex;box-shadow:0 8px 24px rgba(10,132,255,.4)}
.ni{display:flex;align-items:center;gap:11px;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:10px;color:var(--tx);font-weight:500;width:100%;font-size:14px;transition:background .18s ease,color .18s ease}
.ni i{font-size:18px}.ni:hover{background:var(--ac-soft)}.ni.on{background:var(--ac-soft);color:var(--ac)}
.sl{font-size:11px;color:var(--mu);font-weight:600;padding:16px 12px 6px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;background:rgba(120,120,128,.15);border-radius:12px;padding:3px;margin:0 4px 16px;gap:2px;box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;font-weight:600;color:var(--mu);font-size:12px;transition:all .25s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--cd-solid);color:var(--ac);box-shadow:0 2px 8px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.04);transform:scale(1.02)}
.ub{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px 4px;border-top:1px solid var(--bd)}
.ub>div{flex:1;line-height:1.25;min-width:0}
.ub b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ub .mu{font-size:11px}
.gb{border:0;background:transparent;font-size:17px;color:var(--mu);padding:6px;border-radius:8px;transition:all .18s}
.gb:hover{color:var(--no);background:rgba(255,59,48,.08)}
.av{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-size:13px;font-weight:600;flex:none;border:0}
section{background:var(--bg);min-width:0;display:flex;flex-direction:column}

/* === TOPBAR FLOATING GLASS BAR === */
.top{position:sticky;top:0;z-index:30;padding:12px 32px 0;background:transparent;pointer-events:none;transition:padding .25s cubic-bezier(.2,.8,.2,1)}
.top.shrink{padding-top:6px}
.topbar{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:1px solid rgba(0,0,0,.06);border-radius:18px;box-shadow:0 4px 20px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);max-width:1140px;margin:0 auto;transition:all .3s cubic-bezier(.2,.8,.2,1)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .topbar{background:rgba(28,28,30,.78);border-color:rgba(255,255,255,.08);box-shadow:0 4px 20px rgba(0,0,0,.4)}}
:root[data-theme="dark"] .topbar{background:rgba(28,28,30,.78);border-color:rgba(255,255,255,.08);box-shadow:0 4px 20px rgba(0,0,0,.4)}
.top.shrink .topbar{padding:6px 10px 6px 14px;border-radius:99px;max-width:720px}
.tb-crumb{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--mu);white-space:nowrap;flex:none}
.tb-crumb i{font-size:15px;color:var(--mu)}
.tb-crumb .sep{opacity:.4;font-size:11px}
.tb-crumb .here{color:var(--tx);font-weight:600;display:flex;align-items:center;gap:6px}
.tb-crumb .here i{color:var(--ac);font-size:16px}
.tb-search{flex:1;display:flex;align-items:center;gap:8px;padding:7px 12px;background:rgba(120,120,128,.08);border:1px solid transparent;border-radius:10px;transition:all .18s;min-width:0}
.tb-search:focus-within{background:var(--cd-solid);border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.tb-search i{font-size:15px;color:var(--mu);flex:none}
.tb-search input{flex:1;border:0;background:transparent;padding:0;font-size:13px;box-shadow:none;min-width:0}
.tb-search input:focus{outline:0;box-shadow:none}
.tb-search kbd{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--cd-solid);border:1px solid var(--bd);color:var(--mu);font-family:var(--font);font-weight:600}
.top.shrink .tb-search{display:none}
.tb-actions{display:flex;align-items:center;gap:6px;flex:none}
.tb-btn{width:36px;height:36px;border-radius:10px;border:0;background:rgba(120,120,128,.08);color:var(--tx);font-size:17px;display:grid;place-items:center;padding:0;cursor:pointer;transition:all .18s;position:relative}
.tb-btn:hover{background:rgba(120,120,128,.16);transform:translateY(-1px)}
.tb-btn:active{transform:scale(.95)}
.tb-btn .badge-dot{position:absolute;top:-2px;right:-2px;background:var(--no);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
.tb-lang{padding:0 12px;height:36px;border-radius:10px;border:0;background:rgba(120,120,128,.08);color:var(--tx);font-size:12px;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:5px}
.tb-lang:hover{background:rgba(120,120,128,.16)}
.tb-lang i{font-size:13px}
.tb-avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-size:13px;font-weight:700;border:0;cursor:pointer;padding:0;display:grid;place-items:center;transition:all .18s;box-shadow:0 2px 8px rgba(10,132,255,.3)}
.tb-avatar:hover{transform:translateY(-1px) scale(1.04);box-shadow:0 4px 12px rgba(10,132,255,.4)}

main{padding:20px 32px 40px;flex:1;width:100%;max-width:1200px;margin:0 auto}
.cd{background:var(--cd-solid);border:1px solid var(--bd);border-radius:var(--r-lg);padding:22px;margin-bottom:18px;box-shadow:var(--sh-sm);transition:box-shadow .25s ease}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .cd{background:var(--bg-elev)}}
:root[data-theme="dark"] .cd{background:var(--bg-elev)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}.g .cd{margin:0}
.st{border-top:0;position:relative;overflow:hidden}
.st::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--ac));border-radius:var(--r-lg) var(--r-lg) 0 0}
.g .st:nth-child(2){--c:#5e5ce6}.g .st:nth-child(3){--c:#30b14b}
.st b{display:block;font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.15;margin-top:4px}
.mu{color:var(--mu);font-size:13px}.no{color:var(--no)}.ok{color:var(--ok)}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd-solid);border:1px solid var(--bd-strong);border-radius:var(--r-sm);padding:9px 13px;transition:all .18s ease;letter-spacing:-.01em}
button{cursor:pointer;font-weight:500}
button:hover:not(:disabled){border-color:var(--bd-strong);background:rgba(120,120,128,.06)}
button:disabled{opacity:.4;cursor:not-allowed}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px var(--ac-soft)}
button.p{background:var(--ac);border-color:transparent;color:#fff;font-weight:500;box-shadow:0 1px 2px rgba(0,113,227,.3),0 4px 12px rgba(0,113,227,.25)}
button.p:hover:not(:disabled){background:var(--ac2);filter:none}
textarea{resize:vertical}

/* === TABLE HEADER CANH GIỮA === */
.tw{overflow-x:auto;overflow-y:hidden;border-radius:var(--r);border:1px solid var(--bd);box-shadow:0 2px 10px rgba(0,0,0,.02);background:var(--cd-solid)}
table{width:100%;border-collapse:collapse}
th,td{padding:14px 16px;border-bottom:1px solid var(--bd);white-space:nowrap;font-size:13.5px;transition:background .2s}
th{color:#fff !important;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;background:var(--ac) !important;position:sticky;top:0;z-index:2;border-bottom:0 !important;text-align:center;border-right:1px solid rgba(255,255,255,.12);padding:15px 16px}
th:last-child{border-right:0}
th:first-child{text-align:left}
td{text-align:center}
td:first-child{text-align:left}
td.num,th.num{text-align:right}
td.mid,th.mid{text-align:center}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) th{background:var(--ac) !important;color:#fff !important}}
:root[data-theme="dark"] th{background:var(--ac) !important;color:#fff !important}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--ac-soft);cursor:default}

.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}.f textarea{grid-column:1/-1;min-height:76px}
.tag{display:inline-flex;align-items:center;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,currentColor 14%,transparent)}
.Duyet,.Hired{color:var(--ok);background:rgba(48,177,75,.15)}.Tu{color:var(--no);background:rgba(255,59,48,.15)}.Cho{color:var(--wa);background:rgba(255,149,0,.15)}
.sm{padding:6px 12px;font-size:12px;border-radius:8px}
.lg{max-width:400px;margin:10vh auto;padding:36px;text-align:center;border-radius:var(--r-xl);background:var(--cd);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:var(--sh-lg)}
.lg input{width:100%;margin-bottom:10px;padding:12px 14px}.lg h2{font-size:22px;margin-bottom:6px;justify-content:center;padding-left:0}.lg h2::before{display:none}.lg .p{width:100%;padding:12px;border-radius:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:16px}
.cal>div{min-height:92px;border:1px solid var(--bd);border-radius:14px;padding:10px;font-size:12px;overflow:hidden;background:var(--cd-solid);transition:all .2s;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.cal>div:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:var(--bd-strong)}
.cal .h{min-height:0;border:0;text-align:center;color:var(--mu);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:transparent;box-shadow:none;padding:0 0 8px 0}
.cal .h:hover{transform:none;box-shadow:none}
.cal .t{border-color:var(--ac);border-width:2px;background:var(--ac-soft);font-weight:600;color:var(--ac);box-shadow:0 4px 12px var(--ac-soft)}
.cal .x{opacity:.3;border-style:dashed;background:transparent;box-shadow:none}
.ev{display:block;margin-top:6px;padding:3px 8px;border-radius:6px;background:rgba(48,177,75,.15);color:var(--ok);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:11px;cursor:pointer}
.ev:hover{filter:brightness(.95)}
.ev.Cho{background:rgba(255,149,0,.15);color:var(--wa)}
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);min-height:220px;padding:32px;margin-bottom:22px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;background:linear-gradient(135deg,#0a84ff 0%,#5e5ce6 50%,#bf5af2 100%);color:#fff;box-shadow:0 8px 24px rgba(10,132,255,.28),0 24px 60px rgba(94,92,230,.20)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 60%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:28px;margin:0;color:#fff;font-weight:600;letter-spacing:-.03em;border:0;padding:0}
.hero h2::before{display:none}
.hero p{margin:6px 0 0;opacity:.85;color:#fff;font-size:14px;text-transform:capitalize}
.hb{display:flex;gap:10px;flex-wrap:wrap}
.hb button{border-radius:99px;padding:10px 20px;font-weight:500;font-size:14px}
.wh{background:#fff;color:#0071e3;border-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.15)}.wh:hover{background:#f5f5f7}
.gl{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}.gl:hover{background:rgba(255,255,255,.28)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.an{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.an:last-child{border-bottom:0}.an>div{flex:1;min-width:0}.an b{font-size:14px;font-weight:500}
.an i{font-size:18px;color:var(--ac);background:var(--ac-soft);border-radius:10px;padding:8px;flex:none}
.qa{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:8px;padding:14px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--cd-solid)}
.qa:hover{background:var(--ac-soft);border-color:var(--bd-strong)}
.qa span{flex:1;font-weight:500;font-size:14px}.qa i:first-child{color:var(--ac);font-size:19px}.qa i:last-child{color:var(--mu);font-size:15px}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:13px;margin-top:8px}
.mini i{font-style:normal;padding:8px 0;border-radius:50%;position:relative;font-variant-numeric:tabular-nums;transition:all .2s}
.mini .mh{color:var(--mu);font-size:11px;font-weight:600;padding-bottom:4px}
.mini .td{background:var(--ac);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(0,113,227,.4);transform:scale(1.1)}
.mini .hv::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ok)}
.oc-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.oc{position:relative;background:var(--cd-solid);border:1px solid var(--bd);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:4px;min-height:180px;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.oc.ck{cursor:pointer}.oc.ck:hover{transform:translateY(-3px);box-shadow:var(--sh)}.oc.ck:active{transform:scale(.98)}
.oc b{font-size:16px;margin-top:12px;font-weight:600;letter-spacing:-.02em}
.dt{position:absolute;top:16px;right:16px;font-size:11px;font-weight:600;color:var(--ok);display:flex;align-items:center;gap:4px}.dt.w{color:var(--wa)}
.ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.ic.b{background:linear-gradient(135deg,#0a84ff,#5e5ce6)}.ic.p{background:linear-gradient(135deg,#bf5af2,#5e5ce6)}.ic.n{background:linear-gradient(135deg,#5e5ce6,#3634a3)}.ic.g{background:linear-gradient(135deg,#30d158,#0a9f3a)}.ic.o{background:linear-gradient(135deg,#ff9f0a,#ff6b00)}
.oa{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:14px}.oa button{border-radius:99px;padding:7px 15px;font-size:13px;font-weight:500}
.ac4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.ac{display:flex;flex-direction:column;justify-content:space-between;gap:22px;text-align:left;min-height:180px;padding:20px;border-radius:var(--r-lg);border:1px solid var(--bd);background:var(--cd-solid);box-shadow:var(--sh-sm);transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.ac:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:var(--bd-strong)}.ac:active{transform:scale(.98)}
.acr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tile{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:23px;background:linear-gradient(135deg,var(--tc),color-mix(in srgb,var(--tc) 65%,#000));box-shadow:0 6px 16px color-mix(in srgb,var(--tc) 35%,transparent)}
.bd{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ok)}
.bd::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.bd.wa{color:var(--wa)}

function go(route,params){
  if(!ROUTES[route])return;
  if(ROUTES[route].mgmt&&!hr()){MSG=t("no_perm");return draw()}
  T=route;MODE=ROUTES[route].mgmt?"mg":"me";MSG="";
  if(params&&params.user)VIEW_USER=params.user;else if(route!=="me")VIEW_USER=null;
  if(params&&params.month)PM=params.month;
  if(params&&params.status)FS=params.status;
  syncHash();draw();
}
function syncHash(){
  const p=new URLSearchParams();
  if(VIEW_USER&&T==="emp")p.set("user",VIEW_USER);
  if(PM!==td.slice(0,7)&&(T==="pay"||T==="rp"))p.set("month",PM);
  if(FS!=="all"&&T==="leave")p.set("status",FS);
  const h=`#/${T}${p.toString()?"?"+p:""}`;
  if(location.hash!==h)history.replaceState(null,"",h);
}
function readHash(){
  const m=location.hash.match(/^#\/(\w+)(?:\?(.*))?$/);
  if(!m||!ROUTES[m[1]])return false;
  T=m[1];const p=new URLSearchParams(m[2]||"");
  VIEW_USER=p.get("user")||null;PM=p.get("month")||td.slice(0,7);FS=p.get("status")||"all";
  MODE=ROUTES[T].mgmt?"mg":"me";return true;
}

/* ===== BI REPORT ===== */
V.rp=function(){
  const year=BI_STATE.year||td.slice(0,4);
  const deptF=BI_STATE.dept,typeF=BI_STATE.type;

  const filtered=L.filter(l=>{
    if(l.status!=="Duyet")return false;
    if(typeF!=="all"&&l.type!==typeF)return false;
    if(deptF!=="all"&&(em(l.user_id).dept||t("no_dept"))!==deptF)return false;
    return dl(l.from_date,l.to_date).some(d=>d.slice(0,4)==year);
  });

  // Dimension data
  const dimData={month:Array(12).fill(0),dept:{},type:{},user:{}};
  filtered.forEach(l=>{
    const n=dl(l.from_date,l.to_date).length;
    const dept=em(l.user_id).dept||t("no_dept");
    const usr=em(l.user_id).name||"?";
    dimData.dept[dept]=(dimData.dept[dept]||0)+n;
    dimData.type[l.type]=(dimData.type[l.type]||0)+n;
    dimData.user[usr]=(dimData.user[usr]||0)+n;
    dl(l.from_date,l.to_date).forEach(d=>{if(d.slice(0,4)==year)dimData.month[+d.slice(5,7)-1]++});
  });
  P.forEach(e=>{
    const k=e.dept||t("no_dept");
    if(deptF==="all"||k===deptF)dimData.dept[k]=dimData.dept[k]||0;
  });

  const dimKey=BI_STATE.barDim;
  const dimLabels=dimKey==="month"?[(LANG=="en"?I18N.en.chart_months_short:I18N.vi.chart_months_short).split("|")]:Object.keys(dimData[dimKey]);
  const dimVals=dimKey==="month"?dimData.month:dimLabels.map(k=>dimData[dimKey][k]||0);
  const dimMax=Math.max(1,...dimVals);

  // Donut data
  const donutKey=BI_STATE.donutDim;
  const donutData=donutKey==="dept"?dimData.dept:(donutKey==="type"?dimData.type:{});
  if(donutKey==="status"){
    donutData.Cho=L.filter(l=>l.status=="Cho"&&(deptF==="all"||(em(l.user_id).dept||t("no_dept"))===deptF)).length;
    donutData.Duyet=L.filter(l=>l.status=="Duyet"&&(deptF==="all"||(em(l.user_id).dept||t("no_dept"))===deptF)).length;
    donutData.Tu=L.filter(l=>l.status=="Tu"&&(deptF==="all"||(em(l.user_id).dept||t("no_dept"))===deptF)).length;
  }
  const donutEntries=Object.entries(donutData).filter(([,v])=>v>0);
  const donutTotal=donutEntries.reduce((s,[,v])=>s+v,0)||1;

  // Status by month
  const statusByMonth=Array.from({length:12},()=>({Cho:0,Duyet:0,Tu:0}));
  L.forEach(l=>{
    if(deptF!=="all"&&(em(l.user_id).dept||t("no_dept"))!==deptF)return;
    if(typeF!=="all"&&l.type!==typeF)return;
    if(l.from_date.slice(0,4)!==year)return;
    const m=+l.from_date.slice(5,7)-1;
    if(statusByMonth[m][l.status]!==undefined)statusByMonth[m][l.status]++;
  });

  // Leaders
  const userDays={};
  filtered.forEach(l=>{userDays[l.user_id]=(userDays[l.user_id]||0)+dl(l.from_date,l.to_date).length});
  const leaders=Object.entries(userDays).map(([id,n])=>({id,n,name:em(id).name,dept:em(id).dept||t("no_dept")})).sort((a,b)=>b.n-a.n).slice(0,5);

  // Heatmap
  const heatDays=[],startHeat=new Date();startHeat.setDate(startHeat.getDate()-41);
  for(let i=0;i<42;i++){
    const d=new Date(startHeat);d.setDate(d.getDate()+i);const k=iso(d);
    const cnt=filtered.reduce((s,l)=>s+(dl(l.from_date,l.to_date).includes(k)?1:0),0);
    heatDays.push({date:k,dow:(d.getDay()+6)%7,cnt});
  }
  const heatMax=Math.max(1,...heatDays.map(x=>x.cnt));

  // KPIs
  const nCho=L.filter(l=>l.status=="Cho").length,nDuyet=L.filter(l=>l.status=="Duyet").length,nTu=L.filter(l=>l.status=="Tu").length;
  const totalReq=nCho+nDuyet+nTu,approveRate=totalReq?(nDuyet/totalReq*100).toFixed(1):0;
  const totalDays=dimVals.reduce((a,b)=>a+b,0);

  // Prev year
  const prevY=+year-1,prevMonths=Array(12).fill(0);
  L.filter(l=>l.status=="Duyet").forEach(l=>dl(l.from_date,l.to_date).forEach(d=>{if(d.slice(0,4)==prevY)prevMonths[+d.slice(5,7)-1]++}));
  const prevTotal=prevMonths.reduce((a,b)=>a+b,0);
  const delta=prevTotal?((totalDays-prevTotal)/prevTotal*100).toFixed(1):0;
  const deltaCls=+delta>0?"up":+delta<0?"down":"flat";
  const deltaTxt=+delta===0?"—":(+delta>0?"▲":"▼")+" "+Math.abs(delta)+"% "+t("bi_vs_prev");

  const monthLabels=(LANG=="en"?I18N.en.chart_months_short:I18N.vi.chart_months_short).split("|");
  const yearOptions=[+year-2,+year-1,+year,+year+1].filter(y=>y>=2020);
  const depts=[...new Set(P.map(e=>e.dept||t("no_dept")))];
  const themeCls="bi-theme-"+BI_STATE.theme;
  const chartColors=["var(--chart-1)","var(--chart-2)","var(--chart-3)","var(--chart-4)","var(--chart-5)","var(--chart-6)","var(--chart-7)","var(--chart-8)"];

  // Build bar chart SVG
  const barW=800,barH=280,padL=40,padR=20,padT=20,padB=40;
  const cw=barW-padL-padR,ch=barH-padT-padB;
  let barSvg="";
  if(BI_STATE.barAxis==="v"){
    const bw=cw/dimVals.length*0.65;
    const grid=[0,0.25,0.5,0.75,1].map(f=>{const y=padT+ch-ch*f,val=Math.round(dimMax*f);return `<line class="grid-line" x1="${padL}" y1="${y}" x2="${barW-padR}" y2="${y}"/><text class="axis-label" x="${padL-8}" y="${y+4}" text-anchor="end">${val}</text>`}).join("");
    const bars=dimVals.map((v,i)=>{
      const h=v/dimMax*ch,x=padL+i*(cw/dimVals.length)+(cw/dimVals.length-bw)/2,y=padT+ch-h;
      const lbl=dimLabels[i]||"";
      return `<g class="bar-group" style="--ox:${x+bw/2}px"><rect class="bar" x="${x}" y="${y}" width="${bw}" height="${Math.max(1,h)}" rx="4" onclick="go('pay',{month:'${year}-${String((dimKey==="month"?i:i+1)).padStart(2,"0")}'})"/><text class="bar-val" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${v}</text><text class="axis-label" x="${x+bw/2}" y="${barH-padB+18}" text-anchor="middle">${esc(lbl.length>6?lbl.slice(0,6)+"…":lbl)}</text></g>`;
    }).join("");
    barSvg=`<svg class="chart-svg" viewBox="0 0 ${barW} ${barH}"><defs><linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--chart-1)"/><stop offset="100%" stop-color="var(--chart-2)"/></linearGradient></defs>${grid}${bars}</svg>`;
  } else {
    const bh=ch/dimVals.length*0.65;
    const grid=[0,0.25,0.5,0.75,1].map(f=>{const x=padL+cw*f,val=Math.round(dimMax*f);return `<line class="grid-line" x1="${x}" y1="${padT}" x2="${x}" y2="${padT+ch}"/><text class="axis-label" x="${x}" y="${barH-padB+18}" text-anchor="middle">${val}</text>`}).join("");
    const bars=dimVals.map((v,i)=>{
      const w=v/dimMax*cw,x=padL,y=padT+i*(ch/dimVals.length)+(ch/dimVals.length-bh)/2;
      const lbl=dimLabels[i]||"";
      return `<g class="bar-group horizontal"><rect class="bar" x="${x}" y="${y}" width="${Math.max(1,w)}" height="${bh}" rx="4" onclick="go('pay',{month:'${year}-${String((dimKey==="month"?i:i+1)).padStart(2,"0")}'})"/><text class="bar-val" x="${x+w+6}" y="${y+bh/2+4}" text-anchor="start">${v}</text><text class="axis-label" x="${padL-8}" y="${y+bh/2+4}" text-anchor="end">${esc(lbl.length>8?lbl.slice(0,8)+"…":lbl)}</text></g>`;
    }).join("");
    barSvg=`<svg class="chart-svg" viewBox="0 0 ${barW} ${barH}"><defs><linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="var(--chart-1)"/><stop offset="100%" stop-color="var(--chart-2)"/></linearGradient></defs>${grid}${bars}</svg>`;
  }

  // Donut SVG
  const donutR=80,cx=100,cy=100;
  let cum=0,donutPaths="",donutLegend="";
  donutEntries.forEach(([k,v],i)=>{
    const pct=v/donutTotal,a0=cum*2*Math.PI-Math.PI/2,a1=(cum+pct)*2*Math.PI-Math.PI/2;
    cum+=pct;
    const x0=cx+donutR*Math.cos(a0),y0=cy+donutR*Math.sin(a0),x1=cx+donutR*Math.cos(a1),y1=cy+donutR*Math.sin(a1);
    const large=pct>0.5?1:0;
    const d=`M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${donutR},${donutR} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z`;
    donutPaths+=`<path class="slice" d="${d}" fill="${chartColors[i%8]}" style="animation-delay:${i*0.08}s" onclick="BI_STATE.${donutKey==="dept"?"dept":"type"}=BI_STATE.${donutKey==="dept"?"dept":"type"}==='${esc(k)}'?'all':'${esc(k)}';saveBI();draw()"/>`;
    donutLegend+=`<div class="row" onclick="BI_STATE.${donutKey==="dept"?"dept":"type"}=BI_STATE.${donutKey==="dept"?"dept":"type"}==='${esc(k)}'?'all':'${esc(k)}';saveBI();draw()"><span class="dot" style="background:${chartColors[i%8]}"></span><span class="name">${esc(k)}</span><span class="val">${v}</span><span class="pct">${(pct*100).toFixed(1)}%</span></div>`;
  });
  if(!donutEntries.length)donutPaths=`<text x="${cx}" y="${cy}" text-anchor="middle" class="donut-center-lbl">${t("report_no_data")}</text>`;

  // Stacked SVG
  const stackW=800,stackH=260,sPadL=40,sPadR=20,sPadT=20,sPadB=40;
  const scW=stackW-sPadL-sPadR,scH=stackH-sPadT-sPadB;
  const maxStack=Math.max(1,...statusByMonth.map(s=>s.Cho+s.Duyet+s.Tu));
  const sBW=scW/12*0.6;
  const stacked=statusByMonth.map((s,i)=>{
    const total=s.Cho+s.Duyet+s.Tu;
    const x=sPadL+i*(scW/12)+(scW/12-sBW)/2;
    let yB=sPadT+scH;
    const parts=[["Cho","var(--wa)"],["Duyet","var(--ok)"],["Tu","var(--no)"]];
    const rects=parts.map(([k,c])=>{
      const h=s[k]/maxStack*scH;
      if(h<=0)return"";
      yB-=h;
      return `<rect class="stack-bar" x="${x}" y="${yB}" width="${sBW}" height="${h}" fill="${c}" style="animation-delay:${i*0.04}s"/>`;
    }).join("");
    return `<g>${rects}<text class="axis-label" x="${x+sBW/2}" y="${stackH-sPadB+18}" text-anchor="middle">${monthLabels[i]}</text><text class="axis-label" x="${x+sBW/2}" y="${sPadT+scH-Math.max(0,total)/maxStack*scH-6}" text-anchor="middle" style="font-weight:700;fill:var(--tx)">${total||""}</text></g>`;
  }).join("");
  const sGrid=[0,0.5,1].map(f=>{const y=sPadT+scH-scH*f,val=Math.round(maxStack*f);return `<line class="grid-line" x1="${sPadL}" y1="${y}" x2="${stackW-sPadR}" y2="${y}"/><text class="axis-label" x="${sPadL-8}" y="${y+4}" text-anchor="end">${val}</text>`}).join("");
  const stackSvg=`<svg class="stack-svg" viewBox="0 0 ${stackW} ${stackH}">${sGrid}${stacked}</svg>`;

  // Leaders
  const maxLeader=Math.max(1,...leaders.map(l=>l.n));
  const lbHtml=leaders.map((l,i)=>`<div class="lb-row" onclick="go('emp',{user:'${l.id}'})"><span class="lb-rank">${i+1}</span><span class="lb-avatar">${esc(l.name.trim().charAt(0).toUpperCase())}</span><div class="lb-info"><div class="lb-name">${esc(l.name)}</div><div class="lb-dept">${esc(l.dept)}</div></div><div class="lb-bar-wrap"><div class="lb-bar" style="width:${l.n/maxLeader*100}%;animation-delay:${i*0.08}s"></div></div><span class="lb-val">${l.n}</span></div>`).join("")||`<p class="mu">${t("report_no_data")}</p>`;

  // Heatmap
  const weeks=6;
  let heatHtml=`<div class="heatmap"><div></div>${["mon","tue","wed","thu","fri","sat","sun"].map(x=>`<div class="hm-dow">${t(x)}</div>`).join("")}`;
  for(let w=0;w<weeks;w++){
    heatHtml+=`<div class="hm-week">${t("bi_week")} ${w+1}</div>`;
    for(let d=0;d<7;d++){
      const cell=heatDays[w*7+d];
      const intensity=cell?cell.cnt/heatMax:0;
      const bg=intensity===0?"rgba(120,120,128,.08)":`color-mix(in srgb,var(--chart-1) ${Math.round(15+intensity*85)}%,transparent)`;
      const title=cell?`${cell.date} · ${cell.cnt} ${LANG=="en"?"on leave":"nghỉ"}`:"";
      heatHtml+=`<div class="hm-cell" style="background:${bg};animation-delay:${(w*7+d)*0.01}s" title="${title}"></div>`;
    }
  }
  heatHtml+="</div>";

  // Filter chips
  const deptChips=depts.map(d=>`<button class="bi-chip ${deptF===d?"on":""}" onclick="BI_STATE.dept=BI_STATE.dept==='${esc(d)}'?'all':'${esc(d)}';saveBI();draw()">${esc(d)}</button>`).join("");
  const typeLabels=["type_annual","type_sick","type_unpaid","type_maternity","type_wedding","type_bereave"];
  const typeChips=typeLabels.map(k=>`<button class="bi-chip ${typeF===t(k)?"on":""}" onclick="BI_STATE.type=BI_STATE.type==='${t(k)}'?'all':'${t(k)}';saveBI();draw()">${t(k)}</button>`).join("");

  // KPI cards
  const kpiOrder=BI_STATE.kpiOrder;
  const kpiDefs={
    staff:{label:t("bi_kpi_staff"),icon:"ti-users",val:P.length,delta:"",cls:"flat"},
    pending:{label:t("bi_kpi_pending"),icon:"ti-clock",val:nCho,delta:`${nCho>0?"▲ "+nCho+" "+t("need_action"):"—"}`,cls:nCho>0?"down":"flat"},
    rate:{label:t("bi_kpi_rate"),icon:"ti-checks",val:approveRate+"%",delta:`${nDuyet}/${totalReq}`,cls:"up"},
    days:{label:t("bi_kpi_days"),icon:"ti-calendar-stats",val:totalDays,delta:deltaTxt,cls:deltaCls}
  };
  const kpiHtml=kpiOrder.map(k=>{const d=kpiDefs[k];return `<div class="kpi"><div class="kpi-label"><i class="ti ${d.icon}"></i> ${d.label}</div><div class="kpi-value">${d.val}</div><span class="kpi-delta ${d.cls}">${d.delta}</span></div>`}).join("");

  // Chart cards by order
  const cardMap={
    bar:()=>`<div class="bi-card draggable" draggable="true" data-key="bar"><div class="bi-card-h"><div class="l"><span class="drag-handle" title="${t("bi_drag")}">⠿</span><i class="ti ti-chart-bar"></i><span>${t("bi_bar",{dim:t("bi_dim_"+dimKey)})}</span></div><div class="ctrls"><button class="bi-ctrl ${BI_STATE.barAxis==="v"?"active":""}" onclick="BI_STATE.barAxis='v';saveBI();draw()" title="${t("bi_swap_axis")}">↕</button><button class="bi-ctrl ${BI_STATE.barAxis==="h"?"active":""}" onclick="BI_STATE.barAxis='h';saveBI();draw()" title="${t("bi_swap_axis")}">↔</button><select class="bi-select" onchange="BI_STATE.barDim=this.value;saveBI();draw()">${["month","dept","type","user"].map(k=>`<option value="${k}" ${dimKey===k?"selected":""}>${t("bi_dim_"+k)}</option>`).join("")}</select></div></div>${barSvg}</div>`,
    donut:()=>`<div class="bi-card draggable" draggable="true" data-key="donut"><div class="bi-card-h"><div class="l"><span class="drag-handle" title="${t("bi_drag")}">⠿</span><i class="ti ti-chart-pie"></i><span>${t("bi_donut",{dim:t("bi_dim_"+donutKey)})}</span></div><div class="ctrls"><select class="bi-select" onchange="BI_STATE.donutDim=this.value;saveBI();draw()">${["dept","type","status"].map(k=>`<option value="${k}" ${donutKey===k?"selected":""}>${t("bi_dim_"+k)}</option>`).join("")}</select></div></div><div class="donut-wrap"><svg class="donut-svg" viewBox="0 0 200 200">${donutPaths}<text x="${cx}" y="${cy-4}" text-anchor="middle" class="donut-center-val">${donutTotal}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" class="donut-center-lbl">${t("bi_total")}</text></svg><div class="donut-legend">${donutLegend}</div></div></div>`,
    stacked:()=>`<div class="bi-card draggable" draggable="true" data-key="stacked"><div class="bi-card-h"><div class="l"><span class="drag-handle" title="${t("bi_drag")}">⠿</span><i class="ti ti-chart-histogram"></i><span>${t("bi_stacked")}</span></div></div>${stackSvg}<div class="stack-legend"><span class="it"><span class="sw" style="background:var(--wa)"></span>${t("st_Cho")}</span><span class="it"><span class="sw" style="background:var(--ok)"></span>${t("st_Duyet")}</span><span class="it"><span class="sw" style="background:var(--no)"></span>${t("st_Tu")}</span></div></div>`,
    heatmap:()=>`<div class="bi-card draggable" draggable="true" data-key="heatmap"><div class="bi-card-h"><div class="l"><span class="drag-handle" title="${t("bi_drag")}">⠿</span><i class="ti ti-grid-dots"></i><span>${t("bi_heatmap")}</span></div></div>${heatHtml}</div>`
  };

  // Build layout in 2 rows: bar + donut, then stacked + heatmap, then leaderboard
  const cardsHtml=BI_STATE.order.map((k,i)=>{
    const isFirst=k==="bar"||k==="stacked";
    return cardMap[k]?cardMap[k]():'';
  });

  const layoutRow1=["bar","donut"].filter(k=>BI_STATE.order.includes(k));
  const layoutRow2=["stacked","heatmap"].filter(k=>BI_STATE.order.includes(k));
  const row1Html=layoutRow1.map(k=>cardMap[k]?cardMap[k]():'').join("");
  const row2Html=layoutRow2.map(k=>cardMap[k]?cardMap[k]():'').join("");

  const html=`<div class="${themeCls} bi-wrap">
    <div class="bi-header">
      <div><h1 class="bi-title">${t("report_title")}</h1><p class="bi-sub">${t("report_subtitle")}</p></div>
      <div class="bi-export"><button onclick="pdf()"><i class="ti ti-file-type-pdf"></i> ${t("bi_export_pdf")}</button><button onclick="biCsv()"><i class="ti ti-download"></i> ${t("bi_export_csv")}</button></div>
    </div>
    <div class="bi-filters">
      <label>${t("report_filter_year")}</label>
      <select onchange="BI_STATE.year=this.value;saveBI();draw()">${yearOptions.map(y=>`<option value="${y}" ${y==year?"selected":""}>${y}</option>`).join("")}</select>
      <label>${t("bi_filter_dept")}</label>
      <button class="bi-chip ${deptF==="all"?"on":""}" onclick="BI_STATE.dept='all';saveBI();draw()">${t("bi_all")}</button>
      ${deptChips}
      <label>${t("bi_filter_type")}</label>
      <button class="bi-chip ${typeF==="all"?"on":""}" onclick="BI_STATE.type='all';saveBI();draw()">${t("bi_all")}</button>
      ${typeChips}
      <button class="bi-reset" onclick="BI_STATE.dept='all';BI_STATE.type='all';BI_STATE.year=null;saveBI();draw()"><i class="ti ti-x"></i> ${t("bi_reset")}</button>
      <button class="bi-reset" style="margin-left:0" onclick="cycleTheme()"><i class="ti ti-palette"></i> ${t("bi_theme")}</button>
    </div>
    <div class="bi-kpis">${kpiHtml}</div>
    <div class="bi-grid" id="bi-row1">${row1Html}</div>
    <div class="bi-grid bi-grid-2" id="bi-row2">${row2Html}</div>
    <div class="bi-card"><div class="bi-card-h"><div class="l"><i class="ti ti-trophy"></i><span>${t("bi_top_staff")}</span></div></div><div class="leaderboard">${lbHtml}</div></div>
  </div>`;
  setTimeout(bindDragDrop,50);
  return html;
};

function cycleTheme(){
  const themes=["ocean","sunset","forest","mono"];
  const i=themes.indexOf(BI_STATE.theme);
  BI_STATE.theme=themes[(i+1)%themes.length];
  saveBI();draw();
}

function bindDragDrop(){
  document.querySelectorAll(".bi-card.draggable").forEach(card=>{
    card.addEventListener("dragstart",e=>{
      card.classList.add("dragging");
      e.dataTransfer.setData("text/plain",card.dataset.key);
    });
    card.addEventListener("dragend",()=>card.classList.remove("dragging"));
    card.addEventListener("dragover",e=>{e.preventDefault();card.classList.add("drag-over")});
    card.addEventListener("dragleave",()=>card.classList.remove("drag-over"));
    card.addEventListener("drop",e=>{
      e.preventDefault();card.classList.remove("drag-over");
      const srcKey=e.dataTransfer.getData("text/plain");
      const dstKey=card.dataset.key;
      if(!srcKey||srcKey===dstKey)return;
      const order=[...BI_STATE.order];
      const si=order.indexOf(srcKey),di=order.indexOf(dstKey);
      if(si<0||di<0)return;
      order.splice(si,1);order.splice(di,0,srcKey);
      BI_STATE.order=order;saveBI();draw();
    });
  });
}

function biCsv(){
  const year=BI_STATE.year||td.slice(0,4);
  const rows=[["Tháng","Đã duyệt","Chờ duyệt","Từ chối"]];
  const sbm=Array.from({length:12},()=>({Cho:0,Duyet:0,Tu:0}));
  L.forEach(l=>{
    if(BI_STATE.dept!=="all"&&(em(l.user_id).dept||t("no_dept"))!==BI_STATE.dept)return;
    if(BI_STATE.type!=="all"&&l.type!==BI_STATE.type)return;
    if(l.from_date.slice(0,4)!==year)return;
    const m=+l.from_date.slice(5,7)-1;
    if(sbm[m][l.status]!==undefined)sbm[m][l.status]++;
  });
  sbm.forEach((s,i)=>rows.push([i+1,s.Duyet,s.Cho,s.Tu]));
  dlf("\ufeff"+rows.map(r=>r.join(",")).join("\n"),"text/csv;charset=utf-8","bi-report-"+year+".csv");
}

const MW={1:5310000,2:4730000,3:4140000,4:3700000},LCS=ym=>ym>="2026-07"?2530000:2340000,BK=[[1e7,.05],[3e7,.1],[6e7,.2],[1e8,.3],[Infinity,.35]];
function pit(x){let tt=0,lo=0;for(const [hi,r] of BK){if(x>lo)tt+=(Math.min(x,hi)-lo)*r;lo=hi}return Math.round(tt)}
function calc(e){
  const tt=sal(e.id),j=ADJ.find(a=>a.month==PM&&a.user_id==e.id)||{},
    u=L.filter(l=>l.user_id==e.id&&l.status=="Duyet"&&l.type=="Nghỉ không lương").reduce((x,l)=>x+dl(l.from_date,l.to_date).filter(d=>d.slice(0,7)==PM).length,0),
    sl=+tt.sal||0,al=+tt.al||0,dd=Math.round(sl/22*u),bo=+j.bonus||0,ot=+j.ot||0,pe=+j.penalty||0,
    mw=MW[tt.region||1]||MW[1],ins=tt.insured!==false,base=Math.max(tt.ins_base!=null?+tt.ins_base:sl,mw),
    b1=Math.min(base,20*LCS(PM)),b2=Math.min(base,20*mw),R=Math.round;
  const xh=ins?R(b1*.08):0,yt=ins?R(b1*.015):0,tn=ins?R(b2*.01):0,b=xh+yt+tn,er=ins?R(b1*.175)+R(b1*.03)+R(b2*.01):0,
    income=Math.max(0,sl+al+bo+ot-dd),ttax=Math.max(0,income-15500000-6200000*(+tt.dependents||0)-b),tx=pit(ttax);
  return {id:e.id,name:e.name,sal:sl,al,bonus:bo,ot,penalty:pe,u,dd,xh,yt,tn,b,er,ttax,tax:tx,net:sl+al+bo+ot-pe-dd-b-tx};
}
function payRows(){
  const run_=RUN.filter(x=>x.month==PM);
  if(run_.length)return run_.filter(x=>hr()||x.user_id==ME.id).map(x=>({id:x.user_id,name:em(x.user_id).name,sal:+x.sal,al:+x.al,bonus:+x.bonus||0,ot:+x.ot||0,penalty:+x.penalty||0,u:x.unpaid_days,dd:+x.deduct,xh:+x.bhxh||0,yt:+x.bhyt||0,tn:+x.bhtn||0,b:+x.insurance,er:+x.er_total||0,ttax:+x.taxable||0,tax:+x.tax||0,net:+x.net}));
  return P.filter(e=>hr()||e.id==ME.id).map(calc);
}

const unlockPay=()=>run(sb.from("payroll_runs").delete().eq("month",PM));
const insCard=()=>`<div class="cd"><h2><i class="ti ti-shield-check"></i> ${t("ins_title")}</h2><p class="mu">${t("ins_hint")}</p><div class="tw"><table><thead><tr><th>${t("col_employee")}</th><th>${t("col_region")}</th><th>${t("col_ins_base")}</th><th>${t("col_dep")}</th><th>${t("col_insured")}</th></tr></thead><tbody>
${P.map(e=>{const s=sal(e.id);return`<tr><td>${userLink(e.id)}</td><td><select onchange="upd('salaries','user_id','${e.id}','region',+this.value)">${[1,2,3,4].map(r=>`<option value="${r}" ${(s.region||1)==r?"selected":""}>${t("region")} ${["I","II","III","IV"][r-1]}</option>`).join("")}</select></td><td><input style="width:130px" type="number" value="${s.ins_base??""}" placeholder="= ${t("salary")}" onchange="upd('salaries','user_id','${e.id}','ins_base',this.value===''?null:+this.value)"></td><td><input style="width:70px" type="number" min="0" value="${s.dependents||0}" onchange="upd('salaries','user_id','${e.id}','dependents',+this.value||0)"></td><td><input type="checkbox" ${s.insured===false?"":"checked"} onchange="upd('salaries','user_id','${e.id}','insured',this.checked)"></td></tr>`}).join("")}
</tbody></table></div></div>`;

const HDR=()=>["col_employee","col_sal","allowance","col_bonus","col_ot","col_penalty","col_unpaid","col_bhxh","col_bhyt","col_bhtn","col_taxable","col_tax","col_net","col_er"];
const HDRS=()=>(hr()?HDR():HDR().slice(0,13)).map(k=>t(k));
const ROWS=()=>payRows().map(x=>[x.name,x.sal,x.al,x.bonus,x.ot,x.penalty,x.dd,x.xh,x.yt,x.tn,x.ttax,x.tax,x.net,x.er]).map(a=>hr()?a:a.slice(0,13));
function dlf(tx,type,name){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([tx],{type}));a.download=name;a.click()}
function csv(){dlf("\ufeff"+[HDRS(),...ROWS()].map(a=>a.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n"),"text/csv;charset=utf-8","bang-luong-"+PM+".csv")}
const needX=()=>{if(typeof XLSX=="undefined"){MSG=t("err_excel_lib");draw();return true}};
function xlsx(){if(needX())return;const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([HDRS(),...ROWS()]),"Payroll "+PM);XLSX.writeFile(wb,"bang-luong-"+PM+".xlsx")}
function tpl(){if(needX())return;const h=[t("email"),t("fullname"),t("col_bonus"),t("col_ot"),t("col_penalty"),t("salary"),t("allowance")],rows=P.map(e=>{const x=sal(e.id),j=ADJ.find(a=>a.month==PM&&a.user_id==e.id)||{};return[e.email,e.name,+j.bonus||0,+j.ot||0,+j.penalty||0,+x.sal||0,+x.al||0]}),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([h,...rows]),"Import");XLSX.writeFile(wb,"mau-nhap-luong-"+PM+".xlsx")}
function importXlsx(inp){const f=inp.files[0];if(!f||needX())return;const rd=new FileReader();rd.onload=async ev=>{try{const wb=XLSX.read(ev.target.result,{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""}),g=(o,ks)=>{const k=Object.keys(o).find(x=>ks.includes(x.trim().toLowerCase()));return k===undefined||o[k]===""||isNaN(+o[k])?undefined:+o[k]},ad=[],sa=[];let miss=0;
for(const o of rows){const ek=Object.keys(o).find(x=>x.trim().toLowerCase()=="email"),mail=ek?String(o[ek]).trim().toLowerCase():"",p=P.find(x=>(x.email||"").toLowerCase()==mail);if(!p){if(mail)miss++;continue}
const b=g(o,["thưởng","bonus"]),tt=g(o,["tăng ca","overtime"]),pe=g(o,["phạt","penalty"]),sl=g(o,["lương cơ bản","base salary"]),al=g(o,["phụ cấp","allowance"]);
if([b,tt,pe].some(x=>x!==undefined)){const j=ADJ.find(z=>z.month==PM&&z.user_id==p.id)||{};ad.push({month:PM,user_id:p.id,bonus:b??(+j.bonus||0),ot:tt??(+j.ot||0),penalty:pe??(+j.penalty||0)})}
if(sl!==undefined||al!==undefined){const c=sal(p.id);sa.push({user_id:p.id,sal:sl??(+c.sal||0),al:al??(+c.al||0)})}}
let er=null;if(ad.length)er=(await sb.from("payroll_adj").upsert(ad)).error;if(!er&&sa.length)er=(await sb.from("salaries").upsert(sa)).error;
MSG=er?t("err_prefix")+": "+er.message:"OK ("+ad.length+"/"+sa.length+")"+(miss?" ("+miss+" miss)":"")}catch(x){MSG=t("err_file")+": "+x.message}inp.value="";await load()};rd.readAsArrayBuffer(f)}
function pdf(){const w=window.open("","_blank");if(!w)return;const th=HDRS(),rows=ROWS();
w.document.write(`<html><head><meta charset="utf-8"><title>Payroll</title><style>@page{size:landscape;margin:12mm}body{font-family:sans-serif;font-size:11px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:5px;text-align:right}th:first-child,td:first-child{text-align:left}th{background:#eef4ff}</style></head><body><h2>${t("payroll_sheet",{m:PM.slice(5)+"/"+PM.slice(0,4)})}</h2><table><thead><tr>${th.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i?vnd(c):esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table><script>setTimeout(function(){print()},500)<\/script></body></html>`);w.document.close()}
function slip(id){const r=payRows().find(x=>x.id==id);if(!r)return;const w=window.open("","_blank"),row=(a,b)=>`<tr><td>${a}</td><td style="text-align:right">${b}</td></tr>`;
w.document.write(`<html><head><meta charset="utf-8"><title>${t("payroll_slip",{m:PM})}</title><style>body{font-family:sans-serif;max-width:600px;margin:30px auto}table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:1px solid #ddd}.m{color:#666;font-size:13px}</style></head><body><h2>${t("payroll_slip",{m:PM.slice(5)+"/"+PM.slice(0,4)})}</h2><p>${t("slip_employee")}: <b>${esc(r.name)}</b></p><table>${row(t("salary"),vnd(r.sal))}${row(t("allowance"),vnd(r.al))}${row(t("col_bonus"),vnd(r.bonus))}${row(t("col_ot"),vnd(r.ot))}${row(t("slip_unpaid",{n:r.u}),"-"+vnd(r.dd))}${row(t("col_bhxh"),"-"+vnd(r.xh))}${row(t("col_bhyt"),"-"+vnd(r.yt))}${row(t("col_bhtn"),"-"+vnd(r.tn))}${row(t("col_taxable"),"<span class=m>"+vnd(r.ttax)+"</span>")}${row(t("col_tax"),"-"+vnd(r.tax))}${row(t("col_penalty"),"-"+vnd(r.penalty))}${row("<b>"+t("slip_net")+"</b>","<b>"+vnd(r.net)+"</b>")}</table><p class="m">${t("slip_er_note",{v:vnd(r.er)})}</p><script>setTimeout(function(){print()},300)<\/script></body></html>`);w.document.close()}

function addAnn(){v("at")&&run(sb.from("announcements").insert({title:v("at")}))}
const delAnn=id=>run(sb.from("announcements").delete().eq("id",id));
function addLv(){
  const f=v("lf"),o=v("lo"),ty=v("lt"),n=f&&o&&o>=f?dl(f,o).length:-1;
  if(n<0){MSG=t("err_invalid_dates");return draw()}
  if(!n){MSG=t("err_weekend_only");return draw()}
  if(ty==t("type_annual")&&n>QUOTA-used(ME.id)){MSG=t("err_quota");return draw()}
  run(sb.from("leaves").insert({type:ty,from_date:f,to_date:o,reason:v("lr")}));
}
const dec=(id,s)=>{let x={status:s};if(s=="Tu"){const r=prompt(t("reject_reason_ph"));if(r===null)return;x.reject_reason=r}run(sb.from("leaves").update(x).eq("id",id))};
const cancel=id=>run(sb.from("leaves").delete().eq("id",id));
function qLeave(off){
  const d=new Date();d.setDate(d.getDate()+off);const k=iso(d);MSG="";
  if(!dl(k,k).length){MSG=t("err_weekend_only");return draw()}
  if(QUOTA-used(ME.id)<1){MSG=t("err_quota");return draw()}
  if(!confirm(t("confirm_quick_leave",{d:k})))return;
  run(sb.from("leaves").insert({type:"Phép năm",from_date:k,to_date:k,reason:t("reason_quick")}));
}
function apAll(){const n=L.filter(l=>l.status=="Cho").length;if(!n||!confirm(t("confirm_approve_all",{n})))return;run(sb.from("leaves").update({status:"Duyet"}).eq("status","Cho"))}
const mv=k=>{CM=new Date(CM.getFullYear(),CM.getMonth()+k,1);draw()};
async function run(p){const r=await p;MSG=r.error?t("err_prefix")+": "+r.error.message:"";await load()}
const ck=k=>k=="in"?run(sb.from("attendance").insert({day:td,check_in:new Date().toISOString()})):run(sb.from("attendance").update({check_out:new Date().toISOString()}).eq("user_id",ME.id).eq("day",td));
const saveMe=()=>run(sb.rpc("update_my_profile",{p_phone:v("ph"),p_birthday:v("bd")||null}));
async function setPw(){const a=v("np"),b=v("np2");if(a.length<6||a!=b){MSG=t("pw_rule");return draw()}const r=await sb.auth.updateUser({password:a});if(r.error){MSG=t("err_prefix")+": "+r.error.message;return draw()}RECOV=false;MSG=t("pw_changed");await load()}
async function forgot(){const e=v("le");if(!e){MSG=t("enter_email_first");return draw()}const r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});MSG=r.error?t("err_prefix")+": "+r.error.message:t("reset_sent");draw()}
const addHol=()=>v("hd")&&run(sb.from("holidays").insert({day:v("hd"),name:v("hn")||t("holiday_name")}));
const delHol=d=>run(sb.from("holidays").delete().eq("day",d));
const backup=()=>dlf(JSON.stringify({profiles:P,salaries:SL,leaves:L,attendance:AT,payroll_runs:RUN,holidays:HD,announcements:A},null,1),"application/json","hr-backup-"+td+".json");
const adj=(id,f,x)=>run(sb.from("payroll_adj").upsert({month:PM,user_id:id,[f]:+x||0}));
async function fn(body){const r=await sb.functions.invoke("smart-api",{body});if(r.error){let m=r.error.message;try{m=(await r.error.context.json()).error||m}catch(e){}MSG=t("err_prefix")+": "+m}else MSG=r.data&&r.data.error?t("err_prefix")+": "+r.data.error:"";await load()}

function clk(){const c=document.getElementById("clk"),c2=document.getElementById("clk2");const now=new Date().toLocaleTimeString(LOC(),{hour12:false});if(c)c.textContent=now;if(c2)c2.textContent=now}
async function fetchWeather(){const w=document.getElementById("weather");if(!w)return;try{const res=await fetch("https://api.open-meteo.com/v1/forecast?latitude=10.823&longitude=106.629&current_weather=true");const data=await res.json();const temp=Math.round(data.current_weather.temperature);const code=data.current_weather.weathercode;let icon="☀️",tx="Nắng";if(code>=1&&code<=3){icon="⛅";tx="Mây rải rác"}else if(code>=45&&code<=48){icon="🌫️";tx="Sương mù"}else if(code>=51&&code<=67){icon="🌧️";tx="Mưa"}else if(code>=71&&code<=77){icon="❄️";tx="Tuyết"}else if(code>=80&&code<=82){icon="🌦️";tx="Mưa rào"}else if(code>=95){icon="⛈️";tx="Giông bão"}w.innerHTML=`📍 TP.HCM · ${temp}°C ${icon} ${tx}`}catch(e){w.innerHTML=`📍 TP.HCM`}}
function draw(){draw0();clk();if(T=="home")fetchWeather()}
setInterval(clk,1000);
const empOpts=()=>P.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("");

sb.auth.onAuthStateChange(ev=>{if(ev=="PASSWORD_RECOVERY"){RECOV=true;draw()}});
readHash();
sb.auth.getSession().then(load);
