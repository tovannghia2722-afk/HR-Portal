<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HR Portal Enterprise Pro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--cd:#fff;--tx:#1b1f3b;--mu:#6b7194;--bd:#e6e8f2;--ac:#4f46e5;--ac2:#7c3aed;--ok:#16a34a;--no:#dc2626;--wa:#d97706;--sh:0 1px 2px rgba(27,31,59,.05),0 6px 20px rgba(27,31,59,.07);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1020;--cd:#171a30;--tx:#eceefb;--mu:#9aa0c4;--bd:#262a48;--ac:#818cf8;--ac2:#a78bfa;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1020;--cd:#171a30;--tx:#eceefb;--mu:#9aa0c4;--bd:#262a48;--ac:#818cf8;--ac2:#a78bfa;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--bg);color:var(--tx);font:15px/1.55 "Be Vietnam Pro",system-ui,-apple-system,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--cd);border-bottom:1px solid var(--bd);box-shadow:var(--sh)}
h1{font-size:18px;margin:0;display:flex;align-items:center;font-weight:600}h2{font-size:16px;margin:0 0 12px;font-weight:600}
.logo{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:700;font-size:14px;margin-right:10px}
.logo.big{width:58px;height:58px;font-size:20px;border-radius:16px;margin:0 auto 14px;display:flex}
.us{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.av{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--ac);color:#fff;font-size:13px;font-weight:600}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;transition:all .15s}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--ac) 45%,transparent);border-color:var(--ac)}
button{cursor:pointer}button:hover{border-color:var(--ac)}
button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff;font-weight:500}button.p:hover{filter:brightness(1.08)}
main{padding:16px 20px 32px;max-width:1120px;margin:auto}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}.g .cd{margin:0}
.st{border-top:4px solid var(--c,var(--ac))}.g .st:nth-child(2){--c:var(--wa)}.g .st:nth-child(3){--c:var(--ok)}.g .st:nth-child(4){--c:var(--ac2)}
.st b{display:block;font-size:28px;font-weight:700;line-height:1.2}.mu{color:var(--mu);font-size:13px}.no{color:var(--no)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}tbody tr:hover td{background:color-mix(in srgb,var(--ac) 6%,transparent)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}.f textarea{grid-column:1/-1;min-height:70px}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,currentColor 12%,transparent)}
.Duyet,.Active,.HoanThanh,.DungGio{color:var(--ok)}.Tu,.HetHan,.DiTre{color:var(--no)}.Cho,.SapHetHan{color:var(--wa)}
.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.lg{max-width:400px;margin:8vh auto;padding:30px;text-align:center}.lg input{width:100%;margin-bottom:10px}.lg h2{font-size:20px;margin-bottom:4px}.lg .p{width:100%;padding:11px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal>div{min-height:78px;border:1px solid var(--bd);border-radius:12px;padding:6px;font-size:11px;overflow:hidden}
.cal .h{min-height:0;border:0;text-align:center;color:var(--mu);font-weight:600}.cal .t{border:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent)}.cal .x{opacity:.35;border-style:dashed}
.ev{display:block;margin-top:3px;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--ok) 22%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev.Cho{background:color-mix(in srgb,var(--wa) 25%,transparent)}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{background:var(--cd);border-right:1px solid var(--bd);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-size:17px}.brand .logo{margin:0}
.ni{display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:11px 14px;border-radius:12px;color:var(--mu);font-weight:500;width:100%}
.ni i{font-size:19px}.ni:hover{background:color-mix(in srgb,var(--ac) 8%,transparent);color:var(--tx)}.ni.on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);font-weight:600}.ni.out{margin-top:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 24px;flex-wrap:wrap;border-bottom:1px solid var(--bd);background:var(--cd)}
.hero{position:relative;overflow:hidden;border-radius:22px;min-height:190px;padding:26px 28px;margin-bottom:18px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:20px;background:linear-gradient(135deg,#1e1b4b 0%,#4338ca 50%,#6d28d9 100%)}
.hero h2{font-size:24px;margin:0;color:#fff}.hero p{margin:4px 0 0;opacity:.9}.hb{display:flex;gap:10px;flex-wrap:wrap}.hb button{border-radius:999px;padding:9px 18px;font-weight:500}.wh{background:#fff;color:#1b1f3b;border-color:#fff}.gl{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.3);backdrop-filter:blur(6px)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.rg{display:flex;align-items:center;gap:14px}.rg svg{flex:none}
.an{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}.an>div{flex:1}.an>i{font-size:20px;color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);border-radius:10px;padding:8px}
.qa{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;border-radius:12px}.qa span{flex:1}.qa i:first-child{color:var(--ac);font-size:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px}.modal-cd{background:var(--cd);border-radius:16px;max-width:650px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:var(--sh)}
@media print{.app{display:block}aside,.top,.hb,.hb*,button,.f{display:none!important}main{padding:0}.cd{border:0;box-shadow:none}}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{flex-direction:row;height:auto;position:static;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd);padding:10px}.brand{display:none}.ni{width:auto;white-space:nowrap}.ni.out{margin-top:0}.row{grid-template-columns:1fr}.top{padding:12px 16px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div id="app"><p style="padding:20px">Đang khởi tạo HR System Pro...</p></div>

<script>
const URL_="https://mpbderzyyldygoqlgzxk.supabase.co",KEY="sb_publishable_lOB0LPHLZU33v9nZno0KNQ_iSCaJOqq",QUOTA=12;
const sb=supabase.createClient(URL_,KEY);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),td=iso(new Date());
let ME=null,P=[],L=[],C=[],A=[],SL=[],ATT=[],CT=[],T="home",MSG="",CM=new Date(),PM=td.slice(0,7),MODAL=null;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const em=id=>P.find(e=>e.id==id)||{name:"?"},sal=id=>SL.find(x=>x.user_id==id)||{sal:0,al:0},vnd=n=>Number(n||0).toLocaleString("vi-VN")+" ₫",hr=()=>ME&&ME.role=="hr",v=i=>document.getElementById(i).value.trim();
const LT={Duyet:"Đã duyệt",Tu:"Từ chối",Cho:"Chờ duyệt"};

function dl(f,o){const a=[],d=new Date(f+"T12:00:00"),e=new Date(o+"T12:00:00");while(d<=e){if(d.getDay()%6)a.push(iso(d));d.setDate(d.getDate()+1)}return a}
const used=id=>L.filter(l=>l.user_id==id&&l.type=="Phép năm"&&l.status!="Tu"&&l.from_date.slice(0,4)==td.slice(0,4)).reduce((s,l)=>s+dl(l.from_date,l.to_date).length,0);

function go(t){T=t;MSG="";MODAL=null;draw()}

async function load(){
  const u=(await sb.auth.getUser()).data.user;if(!u){ME=null;return draw()}
  const r=await Promise.all([
    sb.from("profiles").select("*").order("name"),
    sb.from("leaves").select("*").order("id",{ascending:false}),
    sb.rpc("team_calendar"),
    sb.from("announcements").select("*").order("id",{ascending:false}),
    sb.from("salaries").select("*"),
    sb.from("attendance").select("*").order("date",{ascending:false}),
    sb.from("contracts").select("*").order("id",{ascending:false})
  ]);
  const er=r.find(x=>x.error);if(er&&er.error.code!=="42P01")MSG="Lỗi kết nối bảng dữ liệu Supabase: "+er.error.message;
  [P,L,C,A,SL,ATT,CT]=r.map(x=>x.data||[]);ME=P.find(x=>x.id==u.id)||null;
  if(!ME&&!er)MSG="Không tìm thấy hồ sơ cá nhân tương ứng!";
  draw();
}

function draw(){
  const A_=document.getElementById("app");
  if(!ME){
    A_.innerHTML=`<div class="cd lg"><div class="logo big">HR</div><h2>HR Enterprise Portal</h2><p class="mu" style="margin:0 0 16px">Đăng nhập cổng nhân sự nội bộ</p><input id="le" placeholder="Email công ty" type="email"><input id="lp" type="password" placeholder="Mật khẩu" onkeydown="if(event.key=='Enter')login()"><p class="no">${esc(MSG)}</p><button class="p" onclick="login()">Đăng nhập</button></div>`;
    return;
  }
  const tabs=[
    ["home","Trang chủ","ti-home"],
    ["att","Chấm công","ti-clock-check"],
    ["cal","Lịch nghỉ","ti-calendar-event"],
    ["leave","Nghỉ phép","ti-file-text"],
    ["pay","Bảng lương","ti-cash"],
    ["ct","Hợp đồng","ti-file-certificate"],
    ["acc","Tài khoản","ti-user-cog"]
  ];
  if(hr())tabs.push(["emp","Quản lý Nhân viên","ti-users"]);

  A_.innerHTML=`<div class="app">
    <aside>
      <div class="brand"><span class="logo">HR</span><b>HR Portal Pro</b></div>
      ${tabs.map(x=>`<button class="ni ${x[0]==T?"on":""}" onclick="go('${x[0]}')"><i class="ti ${x[2]}"></i>${x[1]}</button>`).join("")}
      <button class="ni out" onclick="logout()"><i class="ti ti-logout"></i>Đăng xuất</button>
    </aside>
    <section>
      <div class="top">
        <span class="mu">HR System / <b>${tabs.find(x=>x[0]==T)[1]}</b></span>
        <div class="us"><span class="av">${esc(ME.name.trim().charAt(0).toUpperCase())}</span>${esc(ME.name)} <span class="tag">${hr()?"HR Admin":"Nhân viên"}</span></div>
      </div>
      <main>${MSG?`<p class="no">${esc(MSG)}</p>`:""}${V[T]()}</main>
    </section>
  </div>
  ${MODAL?`<div class="modal"><div class="modal-cd">${MODAL}<div style="text-align:right;margin-top:16px"><button onclick="MODAL=null;draw()">Đóng</button></div></div></div>`:""}`;
}

async function login(){MSG="";const r=await sb.auth.signInWithPassword({email:v("le"),password:v("lp")});if(r.error){MSG="Tài khoản hoặc mật khẩu không chính xác!";return draw()}await load()}
async function logout(){await sb.auth.signOut();ME=null;T="home";MSG="";draw()}

const V={
  home(){
    const p=L.filter(l=>l.status=="Cho"&&(hr()||l.user_id==ME.id)).length;
    const o=C.filter(l=>l.status=="Duyet"&&dl(l.from_date,l.to_date).includes(td)).map(l=>l.name);
    const u=used(ME.id),rem=QUOTA-u,hh=new Date().getHours();
    const g=hh<11?"Chào buổi sáng":hh<18?"Chào buổi chiều":"Chào buổi tối";
    const myAttToday=ATT.find(a=>a.user_id==ME.id&&a.date==td);
    const cc=2*Math.PI*34;

    return`<div class="hero">
      <div><h2>${g}, ${esc(ME.name)}!</h2><p>${new Date().toLocaleDateString("vi-VN",{weekday:"long",day:"numeric",month:"numeric",year:"numeric"})}</p></div>
      <div class="hb">
        <button class="wh" onclick="go('att')"><i class="ti ti-clock-play"></i> Chấm công ngay</button>
        <button class="gl" onclick="go('leave')"><i class="ti ti-plane-departure"></i> Xin nghỉ phép</button>
      </div>
    </div>
    <div class="row">
      <div>
        <div class="g">
          <div class="cd st rg">
            <svg width="76" height="76" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--bd)" stroke-width="8"/><circle cx="42" cy="42" r="34" fill="none" stroke="var(--ac)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${cc}" stroke-dashoffset="${cc*(1-rem/QUOTA)}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">${rem}/${QUOTA}</text></svg>
            <div><b>Quỹ phép năm</b><div class="mu">Đã dùng ${u} ngày</div></div>
          </div>
          <div class="cd st"><span class="mu">Chấm công hôm nay</span><b>${myAttToday?myAttToday.check_in||"--:--":"Chưa vắng"}</b><span class="mu">${myAttToday?(myAttToday.check_out||"Đang làm việc"):"Chưa Check-in"}</span></div>
          <div class="cd st"><span class="mu">${hr()?"Đơn chờ duyệt":"Đơn của tôi chờ"}</span><b>${p}</b><span class="mu">${hr()?"Cần xử lý ngay":"Đang chờ HR/Quản lý"}</span></div>
          <div class="cd st"><span class="mu">Nghỉ hôm nay</span><b>${o.length}</b><span class="mu">${o.length?esc(o.join(", ")):"100% nhân sự đi làm"}</span></div>
        </div>
        <div class="cd">
          <h2>Thông báo nội bộ</h2>
          ${A.map(a=>`<div class="an"><i class="ti ti-speakerphone"></i><div><b>${esc(a.title)}</b><div class="mu">${a.created_at.slice(0,10)}</div></div>${hr()?`<button class="sm" onclick="delAnn(${a.id})">Xóa</button>`:""}</div>`).join("")||`<p class="mu">Không có thông báo mới nào.</p>`}
          ${hr()?`<div class="f" style="margin-top:12px"><input id="at" placeholder="Nhập nội dung thông báo mới..."><button class="p" onclick="addAnn()">Đăng thông báo</button></div>`:""}
        </div>
      </div>
      <div>
        <div class="cd">
          <h2>Thao tác nhanh</h2>
          <button class="qa" onclick="go('att')"><i class="ti ti-clock-check"></i><span>Chấm công ngày</span><i class="ti ti-chevron-right"></i></button>
          <button class="qa" onclick="go('leave')"><i class="ti ti-file-plus"></i><span>Gửi đơn xin nghỉ phép</span><i class="ti ti-chevron-right"></i></button>
          <button class="qa" onclick="go('pay')"><i class="ti ti-receipt"></i><span>Xem Phiếu lương</span><i class="ti ti-chevron-right"></i></button>
          <button class="qa" onclick="go('ct')"><i class="ti ti-file-certificate"></i><span>Hợp đồng lao động</span><i class="ti ti-chevron-right"></i></button>
        </div>
      </div>
    </div>`;
  },

  att(){
    const myToday=ATT.find(a=>a.user_id==ME.id&&a.date==td);
    return`<div class="
