<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>HR Portal</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"HR Portal","short_name":"HR","start_url":".","display":"standalone","background_color":"#f5f5f7","theme_color":"#0071e3","icons":[{"src":"https://ui-avatars.com/api/?name=HR&background=0a84ff&color=fff&size=192","sizes":"192x192","type":"image/png"}]}'>
<link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=HR&background=0a84ff&color=fff&size=192">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f7;--bg-elev:#fff;--cd:rgba(255,255,255,.72);--cd-solid:#fff;--tx:#1d1d1f;--mu:#6e6e73;--bd:rgba(0,0,0,.07);--bd-strong:rgba(0,0,0,.12);--ac:#0071e3;--ac2:#0077ed;--ac-soft:rgba(0,113,227,.10);--ok:#30b14b;--no:#ff3b30;--wa:#ff9500;--sh-sm:0 1px 2px rgba(0,0,0,.04);--sh:0 2px 8px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.06);--sh-lg:0 4px 16px rgba(0,0,0,.06),0 24px 60px rgba(0,0,0,.10);--r-sm:10px;--r:14px;--r-lg:20px;--r-xl:28px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Be Vietnam Pro",system-ui,sans-serif;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--bg-elev:#1c1c1e;--cd:rgba(28,28,30,.72);--cd-solid:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--bd:rgba(255,255,255,.08);--bd-strong:rgba(255,255,255,.16);--ac:#0a84ff;--ac2:#3395ff;--ac-soft:rgba(10,132,255,.16);--ok:#30d158;--no:#ff453a;--wa:#ff9f0a;--sh-sm:0 1px 2px rgba(0,0,0,.4);--sh:0 2px 8px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);--sh-lg:0 4px 16px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--bg-elev:#1c1c1e;--cd:rgba(28,28,30,.72);--cd-solid:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--bd:rgba(255,255,255,.08);--bd-strong:rgba(255,255,255,.16);--ac:#0a84ff;--ac2:#3395ff;--ac-soft:rgba(10,132,255,.16);--ok:#30d158;--no:#ff453a;--wa:#ff9f0a;--sh-sm:0 1px 2px rgba(0,0,0,.4);--sh:0 2px 8px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);--sh-lg:0 4px 16px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0 0 18px;display:flex;align-items:center;gap:10px;color:var(--tx);border:0;padding:0 0 0 14px;position:relative}
h2::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:4px;border-radius:4px;background:linear-gradient(180deg,var(--ac),#5e5ce6)}
h2 i{color:var(--ac);font-size:20px;background:var(--ac-soft);border-radius:8px;padding:6px}
h2 .badge{margin-left:auto;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--ac-soft);color:var(--ac);letter-spacing:0}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh;background:var(--bg)}
aside{background:var(--cd);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-right:1px solid var(--bd);padding:80px 14px 20px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-size:16px;font-weight:600;letter-spacing:-.02em}
.logo{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-weight:600;font-size:13px;box-shadow:0 4px 12px rgba(10,132,255,.35)}
.logo.big{width:64px;height:64px;font-size:22px;border-radius:18px;margin:0 auto 16px;display:flex;box-shadow:0 8px 24px rgba(10,132,255,.4)}
.ni{display:flex;align-items:center;gap:11px;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:10px;color:var(--tx);font-weight:500;width:100%;font-size:14px;transition:background .18s ease,color .18s ease}
.ni i{font-size:18px}.ni:hover{background:var(--ac-soft)}.ni.on{background:var(--ac-soft);color:var(--ac)}
.sl{font-size:11px;color:var(--mu);font-weight:600;padding:16px 12px 6px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;background:rgba(120,120,128,.15);border-radius:12px;padding:3px;margin:0 4px 16px;gap:2px;box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;font-weight:600;color:var(--mu);font-size:12px;transition:all .25s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--cd-solid);color:var(--ac);box-shadow:0 2px 8px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.04);transform:scale(1.02)}
.ub{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px 4px;border-top:1px solid var(--bd)}
.ub>div{flex:1;line-height:1.25;min-width:0}
.ub b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ub .mu{font-size:11px}
.gb{border:0;background:transparent;font-size:17px;color:var(--mu);padding:6px;border-radius:8px;transition:all .18s}
.gb:hover{color:var(--no);background:rgba(255,59,48,.08)}
.av{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-size:13px;font-weight:600;flex:none;border:0}
section{background:var(--bg);min-width:0;display:flex;flex-direction:column}

/* === TOPBAR FLOATING GLASS BAR === */
.top{position:fixed;top:0;left:0;right:0;z-index:50;padding:12px 32px;background:rgba(245,245,247,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);pointer-events:none}
.top.shrink{padding-top:6px}
.topbar{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:1px solid rgba(0,0,0,.06);border-radius:18px;box-shadow:0 4px 20px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);max-width:1140px;margin:0 auto;transition:all .3s cubic-bezier(.2,.8,.2,1)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .topbar{background:rgba(28,28,30,.78);border-color:rgba(255,255,255,.08);box-shadow:0 4px 20px rgba(0,0,0,.4)}}
:root[data-theme="dark"] .topbar{background:rgba(28,28,30,.78);border-color:rgba(255,255,255,.08);box-shadow:0 4px 20px rgba(0,0,0,.4)}
.top.shrink .topbar{padding:6px 10px 6px 14px;border-radius:99px;max-width:720px}
.tb-crumb{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--mu);white-space:nowrap;flex:none}
.tb-crumb i{font-size:15px;color:var(--mu)}
.tb-crumb .sep{opacity:.4;font-size:11px}
.tb-crumb .here{color:var(--tx);font-weight:600;display:flex;align-items:center;gap:6px}
.tb-crumb .here i{color:var(--ac);font-size:16px}
.tb-search{flex:1;display:flex;align-items:center;gap:8px;padding:7px 12px;background:rgba(120,120,128,.08);border:1px solid transparent;border-radius:10px;transition:all .18s;min-width:0}
.tb-search:focus-within{background:var(--cd-solid);border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.tb-search i{font-size:15px;color:var(--mu);flex:none}
.tb-search input{flex:1;border:0;background:transparent;padding:0;font-size:13px;box-shadow:none;min-width:0}
.tb-search input:focus{outline:0;box-shadow:none}
.tb-search kbd{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--cd-solid);border:1px solid var(--bd);color:var(--mu);font-family:var(--font);font-weight:600}
.top.shrink .tb-search{display:none}
.tb-actions{display:flex;align-items:center;gap:6px;flex:none}
.tb-btn{width:36px;height:36px;border-radius:10px;border:0;background:rgba(120,120,128,.08);color:var(--tx);font-size:17px;display:grid;place-items:center;padding:0;cursor:pointer;transition:all .18s;position:relative}
.tb-btn:hover{background:rgba(120,120,128,.16);transform:translateY(-1px)}
.tb-btn:active{transform:scale(.95)}
.tb-btn .badge-dot{position:absolute;top:-2px;right:-2px;background:var(--no);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
.tb-lang{padding:0 12px;height:36px;border-radius:10px;border:0;background:rgba(120,120,128,.08);color:var(--tx);font-size:12px;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:5px}
.tb-lang:hover{background:rgba(120,120,128,.16)}
.tb-lang i{font-size:13px}
.tb-avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-size:13px;font-weight:700;border:0;cursor:pointer;padding:0;display:grid;place-items:center;transition:all .18s;box-shadow:0 2px 8px rgba(10,132,255,.3)}
.tb-avatar:hover{transform:translateY(-1px) scale(1.04);box-shadow:0 4px 12px rgba(10,132,255,.4)}

main{padding:20px 32px 40px;flex:1;width:100%;max-width:1200px;margin:0 auto}
.cd{background:var(--cd-solid);border:1px solid var(--bd);border-radius:var(--r-lg);padding:22px;margin-bottom:18px;box-shadow:var(--sh-sm);transition:box-shadow .25s ease}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .cd{background:var(--bg-elev)}}
:root[data-theme="dark"] .cd{background:var(--bg-elev)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}.g .cd{margin:0}
.st{border-top:0;position:relative;overflow:hidden}
.st::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--ac));border-radius:var(--r-lg) var(--r-lg) 0 0}
.g .st:nth-child(2){--c:#5e5ce6}.g .st:nth-child(3){--c:#30b14b}
.st b{display:block;font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.15;margin-top:4px}
.mu{color:var(--mu);font-size:13px}.no{color:var(--no)}.ok{color:var(--ok)}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd-solid);border:1px solid var(--bd-strong);border-radius:var(--r-sm);padding:9px 13px;transition:all .18s ease;letter-spacing:-.01em}
button{cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover:not(:disabled){border-color:var(--bd-strong);background:rgba(120,120,128,.06)}
button:disabled{opacity:.4;cursor:not-allowed}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px var(--ac-soft)}
button.p{background:var(--ac);border-color:transparent;color:#fff;font-weight:500;box-shadow:0 1px 2px rgba(0,113,227,.3),0 4px 12px rgba(0,113,227,.25)}
button.p:hover:not(:disabled){background:var(--ac2);filter:none}
textarea{resize:vertical}

/* === TABLE HEADER CANH GIỮA === */
.tw{overflow-x:auto;overflow-y:hidden;border-radius:var(--r);border:1px solid var(--bd);box-shadow:0 2px 10px rgba(0,0,0,.02);background:var(--cd-solid)}
table{width:100%;border-collapse:collapse}
th,td{padding:14px 16px;border-bottom:1px solid var(--bd);white-space:nowrap;font-size:13.5px;transition:background .2s}
th{color:#fff !important;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.02em;background:var(--ac) !important;position:sticky;top:0;z-index:2;border-bottom:0 !important;text-align:center !important;vertical-align:middle !important;border-right:1px solid rgba(255,255,255,.12);padding:14px 16px}
th:first-child{text-align:left !important}
td{text-align:center}
td:first-child{text-align:left}
td.num,th.num{text-align:right}
td.mid,th.mid{text-align:center}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) th{background:var(--ac) !important;color:#fff !important}}
:root[data-theme="dark"] th{background:var(--ac) !important;color:#fff !important}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--ac-soft);cursor:default}

.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}.f textarea{grid-column:1/-1;min-height:76px}
.tag{display:inline-flex;align-items:center;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,currentColor 14%,transparent)}
.Duyet,.Hired{color:var(--ok);background:rgba(48,177,75,.15)}.Tu{color:var(--no);background:rgba(255,59,48,.15)}.Cho{color:var(--wa);background:rgba(255,149,0,.15)}
.sm{padding:6px 12px;font-size:12px;border-radius:8px}
.lg{max-width:400px;margin:10vh auto;padding:36px;text-align:center;border-radius:var(--r-xl);background:var(--cd);box-shadow:var(--sh-lg)}
.lg input{width:100%;margin-bottom:10px;padding:12px 14px}.lg h2{font-size:22px;margin-bottom:6px;justify-content:center;padding-left:0}.lg h2::before{display:none}.lg .p{width:100%;padding:12px;border-radius:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:16px}
.cal>div{min-height:92px;border:1px solid var(--bd);border-radius:14px;padding:10px;font-size:12px;overflow:hidden;background:var(--cd-solid);transition:all .2s;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.cal>div:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:var(--bd-strong)}
.cal .h{min-height:0;border:0;text-align:center;color:var(--mu);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:transparent;box-shadow:none;padding:0 0 8px 0}
.cal .h:hover{transform:none;box-shadow:none}
.cal .t{border-color:var(--ac);border-width:2px;background:var(--ac-soft);font-weight:600;color:var(--ac);box-shadow:0 4px 12px var(--ac-soft)}
.cal .x{opacity:.3;border-style:dashed;background:transparent;box-shadow:none}
.ev{display:block;margin-top:6px;padding:3px 8px;border-radius:6px;background:rgba(48,177,75,.15);color:var(--ok);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:11px;cursor:pointer}
.ev:hover{filter:brightness(.95)}
.ev.Cho{background:rgba(255,149,0,.15);color:var(--wa)}
/* ========== HERO MỚI ========== */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: var(--r-xl);
  min-height: 260px;
  padding: 32px 40px;
  margin-bottom: 22px;
  color: #fff;
  isolation: isolate;
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-rows: 1fr auto;
  grid-template-areas:
    "greet  clock"
    "action corner";
  gap: 20px 24px;
  align-items: start;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, #0a84ff 0%, transparent 50%),
    radial-gradient(ellipse 70% 80% at 80% 10%, #bf5af2 0%, transparent 50%),
    radial-gradient(ellipse 90% 70% at 90% 90%, #ff375f 0%, transparent 55%),
    radial-gradient(ellipse 80% 60% at 10% 90%, #5e5ce6 0%, transparent 55%),
    #0a84ff;
  background-size: 200% 200%;
  animation: heroMesh 20s ease-in-out infinite;
  box-shadow:
    0 1px 0 rgba(255,255,255,.25) inset,
    0 10px 40px -10px rgba(94,92,230,.55),
    0 30px 80px -20px rgba(10,132,255,.35);
  border: 1px solid rgba(255,255,255,.18);
}
@keyframes heroMesh {
  0%,100% { background-position: 0% 0%, 100% 0%, 100% 100%, 0% 100%, 0 0; }
  25%     { background-position: 30% 20%, 80% 10%, 90% 80%, 10% 90%, 0 0; }
  50%     { background-position: 100% 0%, 0% 100%, 0% 0%, 100% 100%, 0 0; }
  75%     { background-position: 60% 80%, 40% 20%, 20% 60%, 80% 40%, 0 0; }
}
.hero::before {
  content: "";
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
  background-size: 32px 32px;
  -webkit-mask-image: radial-gradient(ellipse 70% 90% at 50% 50%, #000 20%, transparent 75%);
          mask-image: radial-gradient(ellipse 70% 90% at 50% 50%, #000 20%, transparent 75%);
  pointer-events: none; z-index: 1;
}
.hero::after {
  content: "";
  position: absolute; top: -50%; left: -60%;
  width: 60%; height: 200%;
  background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.18) 50%, transparent 70%);
  transform: skewX(-20deg);
  animation: heroSweep 8s ease-in-out infinite;
  pointer-events: none; z-index: 2;
}
@keyframes heroSweep { 0%,60%{left:-60%} 100%{left:120%} }
.hero > * { position: relative; z-index: 3; }

.hero .hero-greet { grid-area: greet; align-self: start; min-width: 0; }
.hero .hero-greet h2 {
  font-size: 34px; margin: 0; font-weight: 700; letter-spacing: -.03em;
  line-height: 1.15; border: 0; padding: 0;
  background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,.82) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 12px rgba(0,0,0,.18));
}
.hero .hero-greet h2::before { display: none; }
.hero .hero-greet .hero-date {
  margin: 10px 0 0; color: rgba(255,255,255,.88);
  font-size: 14px; font-weight: 500; letter-spacing: -.01em;
}
.hero .hero-clock {
  grid-area: clock; text-align: right; align-self: start;
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
}
.hero .hero-clock .clk-big {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
  font-variant-numeric: tabular-nums; font-weight: 600;
  letter-spacing: .01em; font-size: 28px; line-height: 1; color: #fff;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,.15));
}
.hero .hero-clock .clk-big::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%;
  background: #30d158;
  animation: livePulse 2s ease-out infinite;
}
@keyframes livePulse {
  0%   { box-shadow: 0 0 0 0 rgba(48,209,88,.6); }
  100% { box-shadow: 0 0 0 10px rgba(48,209,88,0); }
}
.hero .hero-clock #weather {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 99px;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.20);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font-size: 13px; color: #fff; white-space: nowrap;
}
.hero .hb { grid-area: action; align-self: end; display: flex; gap: 10px; flex-wrap: wrap; }
.hb button {
  border-radius: 99px; padding: 11px 22px; font-weight: 600; font-size: 14px;
  border: 1px solid rgba(255,255,255,.25);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  transition: all .3s cubic-bezier(.2,.8,.2,1); letter-spacing: -.01em;
}
.wh {
  background: rgba(255,255,255,.96); color: #0a84ff;
  border-color: rgba(255,255,255,.9);
  box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 4px 14px rgba(0,0,0,.12);
}
.wh:hover {
  background: #fff; transform: translateY(-2px);
  box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 8px 24px rgba(0,0,0,.18);
}
.wh:active { transform: translateY(0) scale(.98); }
.gl {
  background: rgba(255,255,255,.14); color: #fff;
  box-shadow: 0 1px 0 rgba(255,255,255,.15) inset;
}
.gl:hover {
  background: rgba(255,255,255,.24); transform: translateY(-2px);

/* ========== HERO — PHƯƠNG ÁN C (ĐƯỜNG CHÉO TRÔI, NHẸ MẮT) ========== */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: var(--r-xl);
  min-height: 260px;
  padding: 32px 40px;
  margin-bottom: 22px;
  color: #fff;
  isolation: isolate;
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-rows: 1fr auto;
  grid-template-areas:
    "greet  clock"
    "action corner";
  gap: 20px 24px;
  align-items: start;
  background: linear-gradient(135deg, #1e3a5f 0%, #2d2a55 50%, #3d2a4a 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.15) inset,
    0 10px 40px -10px rgba(30,58,95,.6),
    0 30px 80px -20px rgba(45,42,85,.5);
  border: 1px solid rgba(255,255,255,.10);
}

/* Lớp lưới tech mờ */
.hero::before {
  content: "";
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size: 32px 32px;
  -webkit-mask-image: radial-gradient(ellipse 70% 90% at 50% 50%, #000 20%, transparent 75%);
          mask-image: radial-gradient(ellipse 70% 90% at 50% 50%, #000 20%, transparent 75%);
  pointer-events: none; z-index: 1;
}

/* Đường kẻ chéo trôi chậm */
.hero::after {
  content: "";
  position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient(
      45deg,
      transparent 0,
      transparent 40px,
      rgba(255,255,255,.045) 40px,
      rgba(255,255,255,.045) 41px
    );
  background-size: 200% 200%;
  animation: lineScroll 24s linear infinite;
  pointer-events: none; z-index: 2;
  -webkit-mask-image: radial-gradient(ellipse 90% 90% at 50% 50%, #000 30%, transparent 80%);
          mask-image: radial-gradient(ellipse 90% 90% at 50% 50%, #000 30%, transparent 80%);
}
@keyframes lineScroll {
  from { background-position: 0 0; }
  to   { background-position: 100px 100px; }
}

.hero > * { position: relative; z-index: 3; }

/* Cụm 1 — Lời chào */

  font-size: 34px; margin: 0; font-weight: 700; letter-spacing: -.03em;

  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 12px rgba(0,0,0,.25));
}
.hero .hero-greet h2::before { display: none; }

}

.hero .hero-clock .clk-big {

function go(route,params){
  if(!ROUTES[route])return;
  if(ROUTES[route].mgmt&&!hr()){MSG=t("no_perm");return draw()}
  T=route;MODE=ROUTES[route].mgmt?"mg":"me";MSG="";
  if(params&&params.user)VIEW_USER=params.user;else if(route!=="me")VIEW_USER=null;
  if(params&&params.month)PM=params.month;
  if(params&&params.status)FS=params.status;
  syncHash();draw();
}
function syncHash(){
  const p=new URLSearchParams();
  if(VIEW_USER&&T==="emp")p.set("user",VIEW_USER);
  if(PM!==td.slice(0,7)&&(T==="pay"||T==="rp"))p.set("month",PM);
  if(FS!=="all"&&T==="leave")p.set("status",FS);
  const h=`#/${T}${p.toString()?"?"+p:""}`;
  if(location.hash!==h)history.replaceState(null,"",h);
}
function readHash(){
  const m=location.hash.match(/^#\/(\w+)(?:\?(.*))?$/);
  if(!m||!ROUTES[m[1]])return false;
  T=m[1];const p=new URLSearchParams(m[2]||"");
  VIEW_USER=p.get("user")||null;PM=p.get("month")||td.slice(0,7);FS=p.get("status")||"all";
  MODE=ROUTES[T].mgmt?"mg":"me";return true;
}

function toggleNotif(){const p=document.getElementById("notif-panel");if(!p)return;if(p.style.display==="none"||!p.style.display){p.style.display="block";p.classList.add("show")}else{p.style.display="none";p.classList.remove("show")}}

function initSmartTableTools(){
  document.querySelectorAll(".tw table").forEach(table=>{
    const head=table.tHead,body=table.tBodies&&table.tBodies[0];
    if(!head||!body||head.querySelector(".hr-col-filter-row"))return;
    const headerRow=head.rows[0];if(!headerRow||!headerRow.cells.length)return;
    const filterRow=document.createElement("tr");filterRow.className="hr-col-filter-row";
    Array.from(headerRow.cells).forEach((th,index)=>{
      const cell=document.createElement("th");
      const input=document.createElement("input");
      input.type="search";input.placeholder=LANG==="en"?"Filter…":"Lọc cột…";
      input.setAttribute("aria-label",(th.textContent||"").trim()+" filter");
      input.addEventListener("input",applyFilters);
      cell.appendChild(input);filterRow.appendChild(cell);
      th.classList.add("hr-sortable");
      th.title=(th.title?th.title+" · ":"")+(LANG==="en"?"Click to sort":"Bấm để sắp xếp");
      th.addEventListener("click",ev=>{
        if(ev.target.closest("input,button,select,a"))return;
        const dir=th.dataset.sortDir==="asc"?"desc":"asc";
        Array.from(headerRow.cells).forEach(h=>{if(h!==th)delete h.dataset.sortDir;});
        th.dataset.sortDir=dir;
        const rows=Array.from(body.rows).filter(r=>!r.classList.contains("hr-no-data"));
        rows.sort((a,b)=>{
          const av=(a.cells[index]?.innerText||"").trim(),bv=(b.cells[index]?.innerText||"").trim();
          return av.localeCompare(bv,LANG==="en"?"en":"vi",{numeric:true,sensitivity:"base"})*(dir==="asc"?1:-1);
        });
        rows.forEach(r=>body.appendChild(r));
      });
    });
    head.appendChild(filterRow);
    function applyFilters(){
      const filters=Array.from(filterRow.querySelectorAll("input")).map(i=>i.value.trim().toLocaleLowerCase());
      Array.from(body.rows).forEach(row=>{
        const cells=Array.from(row.cells);
        const isEmptyState=cells.length===1&&cells[0].colSpan>1;
        const visible=isEmptyState?!filters.some(Boolean):filters.every((f,i)=>!f||(cells[i]?.innerText||"").toLocaleLowerCase().includes(f));
        row.style.display=visible?"":"none";
      });
    }
  });
}

async function bulkResetEmails(all=false){
  if(!hr())return;
  const chosen=all?P.filter(p=>String(p.id)!==String(ME.id)):Array.from(document.querySelectorAll('.hr-reset-select:checked')).map(x=>P.find(p=>String(p.id)===String(x.value))).filter(Boolean);
  const targets=chosen.filter(p=>p.email&&String(p.email).includes('@'));
  if(!targets.length){alert(LANG==="en"?"Select at least one employee with a valid email first.":"Hãy chọn ít nhất một nhân viên có email hợp lệ.");return}
  const ask=LANG==="en"?`Approve and request password-reset emails for ${targets.length} employee(s)? Email delivery depends on Supabase SMTP and rate limits.`:`Duyệt và yêu cầu gửi email đặt lại mật khẩu cho ${targets.length} nhân viên? Việc gửi thư phụ thuộc SMTP Supabase và giới hạn gửi email.`;
  if(!confirm(ask))return;
  const report=[];
  for(const p of targets){
    try{const r=await sb.auth.resetPasswordForEmail(p.email,{redirectTo:location.origin+location.pathname});report.push({email:p.email,error:r.error?.message||""})}
    catch(e){report.push({email:p.email,error:e.message||String(e)})}
    // A short pause reduces bursts; it does not override Supabase email-provider limits.
    await new Promise(resolve=>setTimeout(resolve,350));
  }
  const ok=report.filter(x=>!x.error),bad=report.filter(x=>x.error);
  alert((LANG==="en"?"Reset email requests: ":"Yêu cầu email thành công: ")+ok.length+"/"+report.length+(bad.length?"\n\n"+(LANG==="en"?"Failed:":"Thất bại:")+"\n"+bad.map(x=>x.email+" — "+x.error).join("\n"):""));
}

async function saveEmp(id){
  const g=i=>document.getElementById(i).value.trim();
  if(!g("e_name")){MSG=t("err_prefix")+": "+t("fullname");return draw()}
  const before=P.find(x=>String(x.id)===String(id))||{};
  const profilePatch={name:g("e_name"),dept:g("e_dept"),pos:g("e_pos"),phone:g("e_phone"),birthday:g("e_bd")||null,start_date:g("e_sd")||null,official_date:g("e_official")||null,probation_end:g("e_probation")||null,location:g("e_location")||null,branch:g("e_branch")||null,manager_id:g("e_manager")||null,emergency_contact_name:g("e_emergency_name")||null,emergency_contact_phone:g("e_emergency_phone")||null,status:g("e_status")||"active",exit_date:g("e_exit_date")||null,exit_reason:g("e_exit_reason")||null,carry:+g("e_carry")||0};
  const pr=await sb.from("profiles").update(profilePatch).eq("id",id);
  if(pr.error){MSG=t("err_prefix")+": "+pr.error.message;return draw()}
  const taxCode=(document.getElementById("e_tax_code")?.value||"").trim();
  const socialInsuranceNumber=(document.getElementById("e_si_code")?.value||"").trim();
  let identifierError=null;
  const identifiers=[
    {value:taxCode,old:String(before.tax_code||""),type:"personal_tax_code",issuer:"Cơ quan thuế",note:"Mã số thuế nhập từ hồ sơ nhân viên; chưa xác minh tự động."},
    {value:socialInsuranceNumber,old:String(before.social_insurance_number||""),type:"social_insurance_number",issuer:"Cơ quan BHXH",note:"Mã số BHXH nhập từ hồ sơ nhân viên; chưa xác minh tự động."}
  ];
  for(const ident of identifiers){
    if(ident.value && ident.value!==ident.old){
      const saved=await sb.rpc("hr_store_external_identifier",{p_entity_type:"profiles",p_entity_id:String(id),p_identifier_type:ident.type,p_identifier_value:ident.value,p_issuer_name:ident.issuer,p_source_url:null,p_verified_at:null,p_verification_note:ident.note});
      if(saved.error)identifierError=(identifierError?identifierError+"; ":"")+ident.type+": "+saved.error.message;
      else if(ident.type==="personal_tax_code")before.tax_code=ident.value;else before.social_insurance_number=ident.value;
    }
  }
  const hist=[];for(const [field,type] of [["dept","department"],["pos","position"],["manager_id","manager"],["location","location"],["status","status"]]){const next=profilePatch[field]||null,prev=before[field]||null;if(String(next||"")!==String(prev||""))hist.push({user_id:id,effective_date:td,change_type:type,old_value:String(prev||""),new_value:String(next||""),reason:LANG==="en"?"Updated from employee profile":"Cập nhật từ hồ sơ nhân viên"})}if(hist.length){const hrst=await sb.from("employee_history").insert(hist);if(hrst.error)MSG=(LANG==="en"?"Profile saved, but history logging failed: ":"Đã lưu hồ sơ nhưng không lưu được lịch sử: ")+hrst.error.message}
  const sv={sal:+g("e_sal")||0,al:+g("e_al")||0};
  const ex=SL.find(x=>x.user_id==id);
  const sr=ex?await sb.from("salaries").update(sv).eq("user_id",id):await sb.from("salaries").insert({user_id:id,...sv});
  MSG=sr.error?t("err_prefix")+": "+sr.error.message:(identifierError?(LANG==="en"?"Profile saved, but one or more external identifiers could not be saved: ":"Đã lưu hồ sơ nhưng có mã bên ngoài chưa lưu được: ")+identifierError:t("saved_ok"));
  await load();
}

iltered")}</button></div>

async function moduleAdd(k){const m=HRX[k]||MODULES[k];if(!m)return;const row={};for(const [f,l,ty] of m.cols){const el=document.getElementById('m_'+f);if(!el)continue;let val=ty==='bool'?el.checked:el.value.trim();if(val==='')continue;if(ty==='num')val=Number(val);row[f]=val;}if(!Object.keys(row).length){MSG=LANG==='en'?'Enter at least one value before adding.':'Vui lòng nhập dữ liệu trước khi thêm.';return draw()}const {data:inserted,error}=await sb.from(m.tb).insert(row).select("id").maybeSingle();if(!error)await writeHrAudit("insert",m.tb,inserted?.id,row);MSG=error?(LANG==='en'?'Could not save ':'Không lưu được ')+(m.titleKey?t(m.titleKey):bilingualLabel(m.title))+': '+error.message:(LANG==='en'?'Record added to ':'Đã thêm bản ghi vào ')+(m.titleKey?t(m.titleKey):bilingualLabel(m.title))+'.';await load();}
async function moduleEdit(k,id){const m=HRX[k]||MODULES[k],row=(DB[m.tb]||[]).find(x=>Number(x.id)===Number(id));if(!row)return;const patch={};for(const [f,label0,ty] of m.cols){const label=bilingualLabel(label0);let current=row[f];if(ty==='bool'){const next=confirm(`${label}: ${LANG==='en'?'current value':'hiện tại'} ${current?(LANG==='en'?'Yes':'Có'):(LANG==='en'?'No':'Không')}. ${LANG==='en'?'OK to enable, Cancel to disable.':'Bấm OK để bật, Cancel để tắt.'}`);patch[f]=next;continue;}const answer=prompt(`${label} (để trống nếu muốn giữ nguyên)`,current==null?'':String(current));if(answer===null)return;if(answer==='')continue;patch[f]=ty==='num'?Number(answer):answer;}if(!Object.keys(patch).length)return;const {error}=await sb.from(m.tb).update(patch).eq('id',id);if(!error)await writeHrAudit("update",m.tb,id,patch);MSG=error?(LANG==='en'?'Update failed: ':'Không cập nhật được: ')+error.message:(LANG==='en'?'Record updated.':'Đã cập nhật bản ghi.');await load();}
async function moduleDelete(k,id){if(!confirm(LANG==='en'?'Delete this record?':'Xóa bản ghi này?'))return;const m=HRX[k]||MODULES[k];const {error}=await sb.from(m.tb).delete().eq('id',id);if(!error)await writeHrAudit("delete",m.tb,id,{});MSG=error?(LANG==='en'?'Delete failed: ':'Không xóa được: ')+error.message:(LANG==='en'?'Record deleted.':'Đã xóa bản ghi.');await load();}

let CODE_REGISTRY_ROWS=[];
async function loadCodeRegistry(){

 ]);
 const profiles=requests[0].status==="fulfilled"?requests[0].value:null,assignments=requests[1].status==="fulfilled"?requests[1].value:null,external=requests[2].status==="fulfilled"?requests[2].value:null;
 if(!profiles||profiles.error){box.innerHTML='<p class="er">Không đọc được mã nhân viên: '+esc(profiles?.error?.message||requests[0].reason?.message||"Lỗi truy vấn")+'</p>';return}

 CODE_REGISTRY_ROWS=profileRows;
 if(assignments&&!assignments.error)CODE_REGISTRY_ROWS.push(...(assignments.data||[]).filter(r=>!(r.code_type==="employee"&&r.entity_type==="profiles"&&profileRows.some(p=>String(p.entityId)===String(r.entity_id)&&p.code===r.display_code))).map(r=>({group:"internal",type:r.code_type,entity:r.entity_type,entityId:r.entity_id,code:r.display_code,name:"",detail:"Mã nội bộ đã gán",verified:"verified",source:"hr_code_assignments"})));

 const en=LANG==="en";fill("codeRegType",CODE_REGISTRY_ROWS.map(r=>r.type),en?"All types":"Tất cả loại mã");fill("codeRegEntity",CODE_REGISTRY_ROWS.map(r=>r.entity),en?"All records":"Tất cả bản ghi");filterCodeRegistry();
 if(assignments?.error||external?.error){const errs=[assignments?.error,external?.error].filter(Boolean).map(e=>e.message).join("; ");box.insertAdjacentHTML("afterbegin",'<p class="mu">Một số bảng mã chưa đọc được (có thể do migration/quyền): '+esc(errs)+'. Danh sách mã nhân viên hiện có vẫn được hiển thị.</p>')}
}

/* ===== BI REPORT ===== */
V.rp=function(){
  const year=BI_STATE.year||td.slice(0,4);
  const deptF=BI_STATE.dept,typeF=BI_STATE.type;

  const filtered=L.filter(l=>{
    if(l.status!=="Duyet")return false;
    if(typeF!=="all"&&l.type!==typeF)return false;
    if(deptF!=="all"&&(em(l.user_id).dept||t("no_dept"))!==deptF)return false;
    return dl(l.from_date,l.to_date).some(d=>d.slice(0,4)==year);
  });

  // Dimension data
  const dimData={month:Array(12).fill(0),dept:{},type:{},user:{}};
  filtered.forEach(l=>{
    const n=dl(l.from_date,l.to_date).length;
    const dept=em(l.user_id).dept||t("no_dept");
    const usr=em(l.user_id).name||"?";
    dimData.dept[dept]=(dimData.dept[dept]||0)+n;
    dimData.type[l.type]=(dimData.type[l.type]||0)+n;
    dimData.user[usr]=(dimData.user[usr]||0)+n;
    dl(l.from_date,l.to_date).forEach(d=>{if(d.slice(0,4)==year)dimData.month[+d.slice(5,7)-1]++});
  });
  P.forEach(e=>{
    const k=e.dept||t("no_dept");
    if(deptF==="all"||k===deptF)dimData.dept[k]=dimData.dept[k]||0;
  });

  const dimKey=BI_STATE.barDim;
  const dimLabels=dimKey==="month"?(LANG=="en"?I18N.en.chart_months_short:I18N.vi.chart_months_short).split("|"):Object.keys(dimData[dimKey]);
  const dimVals=dimKey==="month"?dimData.month:dimLabels.map(k=>dimData[dimKey][k]||0);
  const dimMax=Math.max(1,...dimVals);

  // Donut data
  const donutKey=BI_STATE.donutDim;
  const donutData=donutKey==="dept"?dimData.dept:(donutKey==="type"?dimData.type:{});
  if(donutKey==="status"){
    donutData.Cho=L.filter(l=>l.status=="Cho"&&(deptF==="all"||(em(l.user_id).dept||t("no_dept"))===deptF)).length;
    donutData.Duyet=L.filter(l=>l.status=="Duyet"&&(deptF==="all"||(em(l.user_id).dept||t("no_dept"))===deptF)).length;
    donutData.Tu=L.filter(l=>l.status=="Tu"&&(deptF==="all"||(em(l.user_id).dept||t("no_dept"))===deptF)).length;
  }
  const donutEntries=Object.entries(donutData).filter(([,v])=>v>0);
  const donutTotal=donutEntries.reduce((s,[,v])=>s+v,0)||1;

  // Status by month
  const statusByMonth=Array.from({length:12},()=>({Cho:0,Duyet:0,Tu:0}));
  L.forEach(l=>{
    if(deptF!=="all"&&(em(l.user_id).dept||t("no_dept"))!==deptF)return;
    if(typeF!=="all"&&l.type!==typeF)return;
    if(l.from_date.slice(0,4)!==year)return;
    const m=+l.from_date.slice(5,7)-1;
    if(statusByMonth[m][l.status]!==undefined)statusByMonth[m][l.status]++;
  });

  // Leaders
  const userDays={};
  filtered.forEach(l=>{userDays[l.user_id]=(userDays[l.user_id]||0)+dl(l.from_date,l.to_date).length});
  const leaders=Object.entries(userDays).map(([id,n])=>({id,n,name:em(id).name,dept:em(id).dept||t("no_dept")})).sort((a,b)=>b.n-a.n).slice(0,5);

  // Heatmap
  const heatDays=[],startHeat=new Date();startHeat.setDate(startHeat.getDate()-41);
  for(let i=0;i<42;i++){
    const d=new Date(startHeat);d.setDate(d.getDate()+i);const k=iso(d);
    const cnt=filtered.reduce((s,l)=>s+(dl(l.from_date,l.to_date).includes(k)?1:0),0);
    heatDays.push({date:k,dow:(d.getDay()+6)%7,cnt});
  }
  const heatMax=Math.max(1,...heatDays.map(x=>x.cnt));

  // KPIs
  const nCho=L.filter(l=>l.status=="Cho").length,nDuyet=L.filter(l=>l.status=="Duyet").length,nTu=L.filter(l=>l.status=="Tu").length;
  const totalReq=nCho+nDuyet+nTu,approveRate=totalReq?(nDuyet/totalReq*100).toFixed(1):0;
  const totalDays=dimVals.reduce((a,b)=>a+b,0);

  // Prev year
  const prevY=+year-1,prevMonths=Array(12).fill(0);
  L.filter(l=>l.status=="Duyet").forEach(l=>dl(l.from_date,l.to_date).forEach(d=>{if(d.slice(0,4)==prevY)prevMonths[+d.slice(5,7)-1]++}));
  const prevTotal=prevMonths.reduce((a,b)=>a+b,0);
  const delta=prevTotal?((totalDays-prevTotal)/prevTotal*100).toFixed(1):0;
  const deltaCls=+delta>0?"up":+delta<0?"down":"flat";
  const deltaTxt=+delta===0?"—":(+delta>0?"▲":"▼")+" "+Math.abs(delta)+"% "+t("bi_vs_prev");

  const monthLabels=(LANG=="en"?I18N.en.chart_months_short:I18N.vi.chart_months_short).split("|");
  const yearOptions=[+year-2,+year-1,+year,+year+1].filter(y=>y>=2020);
  const depts=[...new Set(P.map(e=>e.dept||t("no_dept")))];
  const themeCls="bi-theme-"+BI_STATE.theme;
  const chartColors=["var(--chart-1)","var(--chart-2)","var(--chart-3)","var(--chart-4)","var(--chart-5)","var(--chart-6)","var(--chart-7)","var(--chart-8)"];

  // Build bar chart SVG
  const barW=800,barH=280,padL=64,padR=20,padT=24,padB=40;
  const cw=barW-padL-padR,ch=barH-padT-padB;
  let barSvg="";
  if(BI_STATE.barAxis==="v"){
    const bw=cw/dimVals.length*0.65;
    const grid=[0,0.25,0.5,0.75,1].map(f=>{const y=padT+ch-ch*f,val=Math.round(dimMax*f);return `<line class="grid-line" x1="${padL}" y1="${y}" x2="${barW-padR}" y2="${y}"/><text class="axis-label" x="${padL-8}" y="${y+4}" text-anchor="end">${val}</text>`}).join("");
    const bars=dimVals.map((v,i)=>{
      const h=v/dimMax*ch,x=padL+i*(cw/dimVals.length)+(cw/dimVals.length-bw)/2,y=padT+ch-h;
      const lbl=dimLabels[i]||"";
      return `<g class="bar-group" style="--ox:${x+bw/2}px"><rect class="bar" x="${x}" y="${y}" width="${bw}" height="${Math.max(1,h)}" rx="4" onclick="go('pay',{month:'${year}-${String((dimKey==="month"?i:i+1)).padStart(2,"0")}'})"/><text class="bar-val" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${v}</text><text class="axis-label" x="${x+bw/2}" y="${barH-padB+18}" text-anchor="middle">${esc(fitLbl(lbl,cw/dimVals.length))}</text></g>`;
    }).join("");
    barSvg=`<svg class="chart-svg" viewBox="0 0 ${barW} ${barH}"><defs><linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--chart-1)"/><stop offset="100%" stop-color="var(--chart-2)"/></linearGradient></defs>${grid}${bars}</svg>`;
  } else {
    const bh=ch/dimVals.length*0.65;
    const grid=[0,0.25,0.5,0.75,1].map(f=>{const x=padL+cw*f,val=Math.round(dimMax*f);return `<line class="grid-line" x1="${x}" y1="${padT}" x2="${x}" y2="${padT+ch}"/><text class="axis-label" x="${x}" y="${barH-padB+18}" text-anchor="middle">${val}</text>`}).join("");
    const bars=dimVals.map((v,i)=>{
      const w=v/dimMax*cw,x=padL,y=padT+i*(ch/dimVals.length)+(ch/dimVals.length-bh)/2;
      const lbl=dimLabels[i]||"";
      return `<g class="bar-group horizontal"><rect class="bar" x="${x}" y="${y}" width="${Math.max(1,w)}" height="${bh}" rx="4" onclick="go('pay',{month:'${year}-${String((dimKey==="month"?i:i+1)).padStart(2,"0")}'})"/><text class="bar-val" x="${x+w+6}" y="${y+bh/2+4}" text-anchor="start">${v}</text><text class="axis-label" x="${padL-8}" y="${y+bh/2+4}" text-anchor="end">${esc(fitLbl(lbl,padL-12))}</text></g>`;
    }).join("");
    barSvg=`<svg class="chart-svg" viewBox="0 0 ${barW} ${barH}"><defs><linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="var(--chart-1)"/><stop offset="100%" stop-color="var(--chart-2)"/></linearGradient></defs>${grid}${bars}</svg>`;
  }

  // Donut SVG
  const donutR=80,cx=100,cy=100;
  let cum=0,donutPaths="",donutLegend="";
  donutEntries.forEach(([k,v],i)=>{
    const pct=v/donutTotal,a0=cum*2*Math.PI-Math.PI/2,a1=(cum+pct)*2*Math.PI-Math.PI/2;
    cum+=pct;
    const x0=cx+donutR*Math.cos(a0),y0=cy+donutR*Math.sin(a0),x1=cx+donutR*Math.cos(a1),y1=cy+donutR*Math.sin(a1);
    const large=pct>0.5?1:0;
    const d=`M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${donutR},${donutR} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z`;
    donutPaths+=`<path class="slice" d="${d}" fill="${chartColors[i%8]}" style="animation-delay:${i*0.08}s" onclick="BI_STATE.${donutKey==="dept"?"dept":"type"}=BI_STATE.${donutKey==="dept"?"dept":"type"}==='${esc(k)}'?'all':'${esc(k)}';saveBI();draw()"/>`;
    donutLegend+=`<div class="row" onclick="BI_STATE.${donutKey==="dept"?"dept":"type"}=BI_STATE.${donutKey==="dept"?"dept":"type"}==='${esc(k)}'?'all':'${esc(k)}';saveBI();draw()"><span class="dot" style="background:${chartColors[i%8]}"></span><span class="name">${esc(k)}</span><span class="val">${v}</span><span class="pct">${(pct*100).toFixed(1)}%</span></div>`;
  });
  if(donutEntries.length)donutPaths+=`<circle cx="${cx}" cy="${cy}" r="54" fill="var(--cd-solid)"/>`;
  if(!donutEntries.length)donutPaths=`<text x="${cx}" y="${cy}" text-anchor="middle" class="donut-center-lbl">${t("report_no_data")}</text>`;

  // Stacked SVG
  const stackW=800,stackH=260,sPadL=40,sPadR=20,sPadT=20,sPadB=40;
  const scW=stackW-sPadL-sPadR,scH=stackH-sPadT-sPadB;
  const maxStack=Math.max(1,...statusByMonth.map(s=>s.Cho+s.Duyet+s.Tu));
  const sBW=scW/12*0.6;
  const stacked=statusByMonth.map((s,i)=>{
    const total=s.Cho+s.Duyet+s.Tu;
    const x=sPadL+i*(scW/12)+(scW/12-sBW)/2;
    let yB=sPadT+scH;
    const parts=[["Cho","var(--wa)"],["Duyet","var(--ok)"],["Tu","var(--no)"]];
    const rects=parts.map(([k,c])=>{
      const h=s[k]/maxStack*scH;
      if(h<=0)return"";
      yB-=h;
      return `<rect class="stack-bar" x="${x}" y="${yB}" width="${sBW}" height="${h}" fill="${c}" style="animation-delay:${i*0.04}s"/>`;
    }).join("");
    return `<g>${rects}<text class="axis-label" x="${x+sBW/2}" y="${stackH-sPadB+18}" text-anchor="middle">${monthLabels[i]}</text><text class="axis-label" x="${x+sBW/2}" y="${sPadT+scH-Math.max(0,total)/maxStack*scH-6}" text-anchor="middle" style="font-weight:700;fill:var(--tx)">${total||""}</text></g>`;
  }).join("");
  const sGrid=[0,0.5,1].map(f=>{const y=sPadT+scH-scH*f,val=Math.round(maxStack*f);return `<line class="grid-line" x1="${sPadL}" y1="${y}" x2="${stackW-sPadR}" y2="${y}"/><text class="axis-label" x="${sPadL-8}" y="${y+4}" text-anchor="end">${val}</text>`}).join("");
  const stackSvg=`<svg class="stack-svg" viewBox="0 0 ${stackW} ${stackH}">${sGrid}${stacked}</svg>`;

  // Leaders
  const maxLeader=Math.max(1,...leaders.map(l=>l.n));

function cycleTheme(){
  const themes=["ocean","sunset","forest","mono"];
  const i=themes.indexOf(BI_STATE.theme);
  BI_STATE.theme=themes[(i+1)%themes.length];
  saveBI();draw();
}

function bindDragDrop(){
  document.querySelectorAll(".bi-card.draggable").forEach(card=>{
    card.addEventListener("dragstart",e=>{
      card.classList.add("dragging");
      e.dataTransfer.setData("text/plain",card.dataset.key);
    });
    card.addEventListener("dragend",()=>card.classList.remove("dragging"));
    card.addEventListener("dragover",e=>{e.preventDefault();card.classList.add("drag-over")});
    card.addEventListener("dragleave",()=>card.classList.remove("drag-over"));
    card.addEventListener("drop",e=>{
      e.preventDefault();card.classList.remove("drag-over");
      const srcKey=e.dataTransfer.getData("text/plain");
      const dstKey=card.dataset.key;
      if(!srcKey||srcKey===dstKey)return;
      const order=[...BI_STATE.order];
      const si=order.indexOf(srcKey),di=order.indexOf(dstKey);
      if(si<0||di<0)return;
      order.splice(si,1);order.splice(di,0,srcKey);
      BI_STATE.order=order;saveBI();draw();
    });
  });
}

function biCsv(){
  const year=BI_STATE.year||td.slice(0,4);
  const rows=[[t("csv_month"),t("csv_approved"),t("csv_pending"),t("csv_rejected")]];
  const sbm=Array.from({length:12},()=>({Cho:0,Duyet:0,Tu:0}));
  L.forEach(l=>{
    if(BI_STATE.dept!=="all"&&(em(l.user_id).dept||t("no_dept"))!==BI_STATE.dept)return;
    if(BI_STATE.type!=="all"&&l.type!==BI_STATE.type)return;
    if(l.from_date.slice(0,4)!==year)return;
    const m=+l.from_date.slice(5,7)-1;
    if(sbm[m][l.status]!==undefined)sbm[m][l.status]++;
  });
  sbm.forEach((s,i)=>rows.push([i+1,s.Duyet,s.Cho,s.Tu]));
  dlf("\ufeff"+rows.map(r=>r.join(",")).join("\n"),"text/csv;charset=utf-8","bi-report-"+year+".csv");
}

const MW={1:5310000,2:4730000,3:4140000,4:3700000},LCS=ym=>ym>="2026-07"?2530000:2340000,BK=[[1e7,.05],[3e7,.1],[6e7,.2],[1e8,.3],[Infinity,.35]];
function payrollRule(key,fallback){const period=(PM||td.slice(0,7))+"-01";const rows=(DB.payroll_rules||[]).filter(r=>r.rule_key===key&&r.active!==false&&(!r.effective_from||r.effective_from<=period)&&(!r.effective_to||r.effective_to>=period)).sort((a,b)=>String(b.effective_from||"").localeCompare(String(a.effective_from||"")));if(!rows.length)return fallback;const v=rows[0].numeric_value;return v!==null&&v!==undefined&&v!==""&&Number.isFinite(+v)?+v:fallback}
function payrollRuleText(key,fallback){const period=(PM||td.slice(0,7))+"-01";const rows=(DB.payroll_rules||[]).filter(r=>r.rule_key===key&&r.active!==false&&(!r.effective_from||r.effective_from<=period)&&(!r.effective_to||r.effective_to>=period)).sort((a,b)=>String(b.effective_from||"").localeCompare(String(a.effective_from||"")));return rows.length&&rows[0].text_value?rows[0].text_value:fallback}
function pit(x){let brackets=BK;try{const parsed=JSON.parse(payrollRuleText("pit_brackets_json",""));if(Array.isArray(parsed)&&parsed.length)brackets=parsed.map(r=>[r[0]===null?Infinity:+r[0],+r[1]]).sort((a,b)=>a[0]-b[0])}catch(e){}let tt=0,lo=0;for(const [hi,r] of brackets){if(x>lo)tt+=(Math.min(x,hi)-lo)*r;lo=hi}return Math.round(tt)}
function calc(e){
  const tt=sal(e.id),j=ADJ.find(a=>a.month==PM&&a.user_id==e.id)||{},
    u=L.filter(l=>l.user_id==e.id&&l.status=="Duyet"&&l.type=="Nghỉ không lương").reduce((x,l)=>x+dl(l.from_date,l.to_date).filter(d=>d.slice(0,7)==PM).length,0),
    sl=+tt.sal||0,al=+tt.al||0,dd=Math.round(sl/payrollRule("standard_work_days",22)*u),pe=+j.penalty||0,
    mw=MW[tt.region||1]||MW[1],ins=tt.insured!==false,base=Math.max(tt.ins_base!=null?+tt.ins_base:sl,mw),
    b1=Math.min(base,20*LCS(PM)),b2=Math.min(base,20*mw),R=Math.round;
  const monthDate=PM+"-01",monthOf=x=>String(x||"").slice(0,7)===PM;
  const autoBonus=(DB.kpi_bonuses||[]).filter(x=>String(x.user_id)===String(e.id)&&monthOf(x.pay_month)).reduce((n,x)=>n+(+x.amount||0),0);
  const approvedOT=(DB.overtime_records||[]).filter(x=>String(x.user_id)===String(e.id)&&monthOf(x.work_day)&&x.status==="approved");
  const hourly=sl/(payrollRule("standard_work_days",22)*payrollRule("standard_work_hours",8));
  const otAuto=approvedOT.reduce((n,x)=>{const key=x.day_type==="holiday"?"ot_holiday_multiplier":x.day_type==="weekly_rest"?"ot_weekly_rest_multiplier":"ot_weekday_multiplier";return n+(Math.max(0,+x.minutes||0)/60)*hourly*payrollRule(key,x.day_type==="holiday"?3:x.day_type==="weekly_rest"?2:1.5)},0);
  const advanceAuto=(DB.salary_advances||[]).filter(x=>String(x.user_id)===String(e.id)&&monthOf(x.pay_month)&&["approved","paid"].includes(x.status)).reduce((n,x)=>n+(+x.amount||0),0);
  const approvedItems=(DB.payroll_items||[]).filter(x=>String(x.user_id)===String(e.id)&&monthOf(x.pay_month)&&["approved","included"].includes(x.status));
  const compMap=new Map((DB.salary_components||[]).map(x=>[x.code,x]));
  const itemEarnings=approvedItems.filter(x=>(compMap.get(x.component_code)||{}).kind==="earning").reduce((n,x)=>n+(+x.amount||0),0);
  const itemDeductions=approvedItems.filter(x=>(compMap.get(x.component_code)||{}).kind==="deduction").reduce((n,x)=>n+(+x.amount||0),0);
  const taxableItems=approvedItems.filter(x=>{const c=compMap.get(x.component_code)||{};return c.kind==="earning"&&c.taxable}).reduce((n,x)=>n+(+x.amount||0),0);
  const bo=(+j.bonus||0)+autoBonus,ot=(+j.ot||0)+otAuto,otherEarn=itemEarnings,otherDeduct=itemDeductions;
  const xh=ins?R(b1*payrollRule("bhxh_employee_pct",8)/100):0,yt=ins?R(b1*payrollRule("bhyt_employee_pct",1.5)/100):0,tn=ins?R(b2*payrollRule("bhtn_employee_pct",1)/100):0,b=xh+yt+tn,er=ins?R(b1*payrollRule("bhxh_employer_pct",17.5)/100)+R(b1*payrollRule("bhyt_employer_pct",3)/100)+R(b2*payrollRule("bhtn_employer_pct",1)/100):0,
    income=Math.max(0,sl+al+bo+ot+taxableItems-dd),ttax=Math.max(0,income-payrollRule("pit_personal_deduction",15500000)-payrollRule("pit_dependent_deduction",6200000)*(+tt.dependents||0)-b),tx=pit(ttax);
  return {id:e.id,name:e.name,tax_code:e.tax_code||"",sal:sl,al,bonus:bo,ot,penalty:pe,advance:advanceAuto,u,dd,xh,yt,tn,b,er,ttax,tax:tx,other_earnings:otherEarn,other_deductions:otherDeduct,net:sl+al+bo+ot+otherEarn-pe-dd-b-tx-advanceAuto-otherDeduct};
}
function payRows(){

  <div class="bu-row"><button class="p" style="width:auto;background:var(--no)" onclick="BU.doReset()"><i class="ti ti-trash"></i> ${H("Xóa & làm mới","Delete & refresh")}</button><button onclick="BU.close()">${H("Hủy","Cancel")}</button></div>`);
};
BU.doReset=async function(){
  const err=s=>{const e=$("bu-rerr");if(e)e.textContent=s};
  if(($("bu-rs")||{}).value!=="RESET")return err(H("Chưa gõ đúng RESET","Please type RESET"));
  if(!LAST_EXPORT&&!($("bu-bk")||{}).checked)return err(H("Hãy tải bản sao lưu hoặc tick ô xác nhận","Download a backup or tick the confirmation"));
  const sel=[...document.querySelectorAll(".bu-rt:checked")].map(x=>x.value);
  if(!sel.length)return err(H("Chưa chọn mục nào","Nothing selected"));
  const tables=GROUPS.filter(g=>sel.includes(g[0])).flatMap(g=>g[1]);
  const r=await sb.rpc("maintenance_reset",{p_tables:tables});
  if(r.error){const m=r.error.message||"";return err(/function|schema cache|not find/i.test(m)?H("Chưa cài hàm maintenance_reset trong Supabase – chạy file supabase_bigupdate.sql trước.","maintenance_reset is not installed in Supabase – run supabase_bigupdate.sql first."):m)}
  closeModal();MSG=H("Đã làm mới dữ liệu (giữ nguyên tài khoản, hồ sơ, lương, hợp đồng)","Data refreshed (accounts, profiles, salaries and contracts kept)");
  await load();
};

Object.assign(I18N.vi,{ct_intern:"Thực tập"});Object.assign(I18N.en,{ct_intern:"Internship"});

const stageIs=(c,k)=>c.stage==I18N.vi[k]||c.stage==I18N.en[k]||(k=="rc_onboard"&&c.stage=="Đã nhận");

const money=v=>{v=String(v||"").trim();const m_=v.match(/(\d+[.,]?\d*)\s*(triệu|tr\b|m\b)/i);if(m_)return Math.round(parseFloat(m_[1].replace(",","."))*1e6);return +v.replace(/[^\d]/g,"")||0};
const EXL={birthday:["Ngày sinh","Birthday"],dept:["Phòng ban","Department"],start_date:["Ngày vào làm dự kiến","Expected start date"],experience:["Số năm kinh nghiệm","Years of experience"],salary:["Lương (VNĐ/tháng)","Salary (VND/month)"],contract:["Loại hợp đồng","Contract type"],link_cv:["CV","CV"],link_degree:["Bằng cấp","Degrees"],link_cert:["Chứng chỉ","Certificates"],link_contract:["Hợp đồng đã ký","Signed contract"],consent:["Đồng ý lưu thông tin","Consent to store data"],form_at:["Nộp hồ sơ lúc","Submitted at"],reject_reason:["Lý do từ chối","Rejection reason"]};

const fval=(k,v)=>isUrl(v)?linkHtml(v):k=="salary"&&+v?(+v).toLocaleString(LOC())+" ₫":k=="form_at"?X(new Date(v).toLocaleString(LOC())):X(v);
const exGrid=c=>{const e=extraOf(c);const keys=Object.keys(e).filter(k=>e[k]&&k!="rejected_at");

const REASONS=()=>[
  H("Hồ sơ chưa phù hợp với yêu cầu của vị trí","Your profile does not yet match the requirements of the position"),
  H("Thông tin / giấy tờ hồ sơ chưa đầy đủ hoặc chưa hợp lệ","The information / documents provided are incomplete or invalid"),
  H("Chưa thống nhất được điều kiện làm việc (lương, thời gian, hợp đồng)","We could not agree on working conditions (salary, schedule, contract)"),
  H("Vị trí đã được tuyển đủ","The position has been filled")
];
function rejectMail(c,reason){
  const pos=c.position||"";
  const sub=H("Kết quả ứng tuyển"+(pos?" vị trí "+pos:""),"Application result"+(pos?" – "+pos:""));
  const body=H(
`Chào ${c.name},

Cảm ơn bạn đã quan tâm và dành thời gian ứng tuyển${pos?" vị trí "+pos:""} tại công ty chúng tôi.

Sau khi xem xét hồ sơ, rất tiếc chúng tôi chưa thể tiếp tục quá trình với bạn lần này.
Lý do: ${reason||"…"}.

Chúng tôi sẽ lưu lại hồ sơ của bạn và liên hệ khi có vị trí phù hợp. Chúc bạn nhiều thành công trong thời gian tới.

Trân trọng,
${ME?ME.name:""}
Phòng Nhân sự`,
`Dear ${c.name},

Thank you for your interest and for the time you invested in applying${pos?" for the "+pos+" position":""} with us.

After reviewing your application, we regret that we are unable to proceed with you this time.
Reason: ${reason||"…"}.

We will keep your details on file and get in touch if a suitable opening arises. We wish you every success.

Kind regards,
${ME?ME.name:""}
Human Resources`);
  return{sub,body};
}
BU.rejectOpen=function(id){
  const c=cand(id);if(!c)return;
  const rs=REASONS();
  modal(`<h3 style="color:var(--no)"><i class="ti ti-user-x"></i> ${H("Từ chối ứng viên","Reject candidate")}</h3><p class="bu-sub">${X(c.name)} · ${X(c.position||"")}</p>
  <div><span class="mu">${H("Lý do từ chối","Reason")}</span><select id="rj_sel" style="width:100%" onchange="BU.rjUpdate(${id})">${rs.map((r,i)=>`<option value="${i}">${X(r)}</option>`).join("")}<option value="other">${H("Lý do khác (nhập tay)","Other (type below)")}</option></select></div>
  <div id="rj_ow" style="display:none;margin-top:8px"><input id="rj_other" style="width:100%" placeholder="${H("Nhập lý do…","Type the reason…")}" oninput="BU.rjUpdate(${id},1)"></div>
  <div style="margin-top:12px"><span class="mu">${H("Email từ chối (hệ thống tự soạn, bạn có thể sửa)","Rejection email (auto-written, editable)")}</span>
   <input id="rj_sub" style="width:100%;margin:4px 0"><textarea id="rj_body" style="width:100%;min-height:210px"></textarea></div>
  ${c.email?"":`<div class="bu-warn">${H("Ứng viên chưa có email – chỉ ghi nhận từ chối, không soạn được mail.","No email on file – the rejection is recorded but no mail can be written.")}</div>`}
  <p class="mu" id="rj_err" style="color:var(--no)"></p>
  <div class="bu-row">${c.email?`<button class="p" style="width:auto;background:var(--no)" onclick="BU.rjGo(${id},1)"><i class="ti ti-mail"></i> ${H("Từ chối & mở Gmail soạn sẵn","Reject & open Gmail draft")}</button>`:""}<button onclick="BU.rjGo(${id},0)">${H("Chỉ ghi nhận từ chối","Reject without email")}</button><button onclick="BU.close()">${H("Hủy","Cancel")}</button></div>`,true);
  BU.rjUpdate(id);
};
const rjReason=()=>{const s=$("rj_sel").value;return s=="other"?($("rj_other").value||"").trim():REASONS()[+s]};
BU.rjUpdate=function(id,typing){
  const c=cand(id);$("rj_ow").style.display=$("rj_sel").value=="other"?"block":"none";
  const mm_=rejectMail(c,rjReason());$("rj_sub").value=mm_.sub;$("rj_body").value=mm_.body;
};
BU.rjGo=async function(id,sendMail){
  const c=cand(id),reason=rjReason();
  if(!reason){$("rj_err").textContent=H("Hãy nhập lý do từ chối","Please enter a reason");return}
  if(sendMail&&c.email){      // mở tab Gmail NGAY (trước mọi thao tác bất đồng bộ để không bị chặn popup)
    window.open("https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(c.email)+"&su="+encodeURIComponent($("rj_sub").value)+"&body="+encodeURIComponent($("rj_body").value),"_blank","noopener");
  }
  const ex=Object.assign({},extraOf(c),{reject_reason:reason,rejected_at:localISODateTime(new Date())});
  let r=await sb.from("candidates").update({stage:t("rc_reject"),extra:ex}).eq("id",id);
  if(r.error)r=await sb.from("candidates").update({stage:t("rc_reject"),note:(c.note?c.note+" | ":"")+H("Lý do từ chối: ","Rejected: ")+reason}).eq("id",id);
  closeModal();
  if(r.error){MSG=t("err_prefix")+": "+r.error.message;return draw()}
  await load();
};

BU.doApprove=async function(id){
  const g=i=>$(i).value.trim(),err=s=>{const e=$("ap_err");if(e)e.textContent=s;const b=$("ap_go");if(b)b.disabled=false};
  const c=cand(id),ex=extraOf(c);
  const email=g("ap_email").toLowerCase(),name=g("ap_name"),pass=rndPass()+rndPass().slice(0,4)+"!7";
  if(!name)return err(H("Cần họ tên nhân viên.","Employee name is required."));
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return err(H("Vui lòng nhập địa chỉ email hợp lệ của nhân viên.","Enter a valid employee email address."));
  if(BU._approving&&BU._approving[id])return err(H("Đang xử lý hồ sơ này, vui lòng chờ.","This candidate is already being processed."));
  const existing=P.find(p=>String(p.email||"").toLowerCase()===email);
  if(existing)return err(H("Email đã có hồ sơ trong hệ thống. Không tạo trùng; hãy kiểm tra hồ sơ nhân viên.","A profile already uses this email. Duplicate creation was blocked."));
  BU._approving=BU._approving||{};BU._approving[id]=true;
  $("ap_go").disabled=true;err(H("Đang tạo tài khoản…","Creating account…"));
  MSG="";await fn({action:"create",email,password:pass,name,pos:g("ap_pos")});
  if(MSG){const m=MSG;MSG="";delete BU._approving[id];return err(m)}
  const np=P.find(p=>String(p.email||"").toLowerCase()==email);
  if(!np){delete BU._approving[id];return err(H("Đã tạo tài khoản nhưng chưa thấy hồ sơ (profile). Kiểm tra function smart-api có tạo profile không.","Account created but no profile row found. Check that smart-api creates the profile."));}
  const bad=[];
  let r=await sb.from("profiles").update({dept:g("ap_dept")||null,pos:g("ap_pos"),phone:g("ap_phone"),birthday:g("ap_bd")||null,start_date:g("ap_sd")||null}).eq("id",np.id);if(r.error)bad.push("profile: "+r.error.message);
  r=await sb.from("salaries").upsert({user_id:np.id,sal:+g("ap_sal")||0,al:+g("ap_al")||0});if(r.error)bad.push("salary: "+r.error.message);
  const cnote=ex.link_contract?H("Hợp đồng đã ký: ","Signed contract: ")+ex.link_contract:H("Tạo từ hồ sơ nhận việc #","Created from onboarding profile #")+id;
  r=await sb.from("contracts").insert({user_id:np.id,type:g("ap_ct"),start_date:g("ap_sd")||null,end_date:g("ap_ce")||null,note:cnote});if(r.error)bad.push("contract: "+r.error.message);
  r=await sb.from("tasks").insert(TPL.tk_onboard.map(x=>({user_id:np.id,kind:t("tk_onboard"),title:x})));if(r.error)bad.push("tasks: "+r.error.message);
  r=await sb.from("candidates").update({stage:t("rc_onboard")}).eq("id",id);if(r.error)bad.push("candidate: "+r.error.message);
  // Request a reset email instead of exposing a temporary password to HR or putting it in Gmail.
  const reset=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  if(reset.error)bad.push(H("Yêu cầu email đặt lại mật khẩu thất bại: ","Password-reset email request failed: ")+reset.error.message);
  await load();delete BU._approving[id];
  const npNow=P.find(p=>String(p.email||"").toLowerCase()===email)||np;
  const code=npNow&&npNow.employee_code?npNow.employee_code:"";
  if(!code)bad.push(H("Chưa đọc được mã nhân viên từ profiles. Trigger cấp mã cần được kiểm tra; không tạo lại tài khoản.","Employee code was not returned from profiles. Check the code-generation trigger; do not recreate the account."));
  const resetStatus=reset.error
    ? `<div class="bu-warn">${H("Tài khoản đã tạo nhưng chưa yêu cầu gửi được email đặt lại mật khẩu. Bạn có thể thử gửi lại bên dưới.","The account was created, but the password-reset email request failed. You can retry below.")}</div>`
    : `<div class="bu-ok">${H("Đã yêu cầu Supabase gửi email đặt lại mật khẩu. Việc nhận thư phụ thuộc cấu hình email và hộp thư người nhận.","Supabase was asked to send a password-reset email. Delivery depends on email configuration and the recipient's mailbox.")}</div>`;
  modal(`<h3 style="color:var(--ok)"><i class="ti ti-circle-check"></i> ${H("Đã tạo tài khoản","Account created")}</h3>
  <p class="bu-sub">${X(name)}</p>
  <div class="bu-ok"><div>Email: <b>${X(email)}</b></div>${code?`<div style="margin-top:6px">${H("Mã nhân viên","Employee code")}: <b>${X(code)}</b></div>`:""}</div>
  <p class="mu">${H("Tài khoản đã được tạo. Mã nhân viên lấy từ profiles do database cấp tự động; mã số thuế và mã BHXH có thể cập nhật sau trong hồ sơ nhân viên. Các bước phát sinh lỗi được liệt kê bên dưới.","The account has been created. The employee code is read from profiles and generated by the database; tax and social-insurance identifiers can be added later in the employee profile. Any failed steps are listed below.")}</p>
  ${resetStatus}
  ${bad.length?`<div class="bu-warn">${H("Cần kiểm tra các bước sau:","Please review these steps:")}<br>${bad.map(X).join("<br>")}</div>`:""}
  <div class="bu-row"><button class="p" style="width:auto" onclick="BU.resendReset('${X(email)}',this)"><i class="ti ti-mail-forward"></i> ${H("Gửi lại email đặt mật khẩu","Resend password-reset email")}</button><button onclick="BU.close()">${H("Đóng","Close")}</button></div>`,true);
};
BU.resendReset=async(email,btn)=>{if(btn)btn.disabled=true;try{const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});alert(r.error?H("Không gửi được yêu cầu: ","Request failed: ")+r.error.message:H("Đã yêu cầu gửi lại email. Hãy kiểm tra cả thư rác.","Reset email requested again. Check spam too."))}catch(e){alert(H("Không gửi được yêu cầu: ","Request failed: ")+(e.message||String(e)))}finally{if(btn)btn.disabled=false}};

const PK="bu_print_v2";
let PR={paper:"A4",orient:"auto",sides:"one",margin:"normal",gutter:10,scale:100,smart:true,nup:1,header:true,pagenum:true,bw:false,tonly:true,wide:"auto",range:"",mode:"page",tpl:"contract",uid:"",rid:"",co:{name:"",addr:"",rep:"",title:""}};
try{const o=JSON.parse(localStorage.getItem(PK)||"{}");Object.assign(PR,o,{co:Object.assign(PR.co,o.co||{}),mode:"page"})}catch(e){}
const savePR=()=>{try{localStorage.setItem(PK,JSON.stringify(PR))}catch(e){}};
const PAPER={A3:[297,420],A4:[210,297],A5:[148,210],B5:[176,250],Letter:[215.9,279.4],Legal:[215.9,355.6]};
const MARG={narrow:8,normal:15,wide:25};
const MM=3.7795,SMIN=0.83,TARGET=0.92,NGAP=10;
const pageName=p=>p=="Letter"?"letter":p=="Legal"?"legal":p;
const sdim=o=>{const [w,h]=PAPER[PR.paper]||PAPER.A4;return o=="landscape"?[h,w]:[w,h]};
function marg(){
  if(PR.mode=="tpl")return{t:20,r:15,b:20,l:30,g:0};
  const m=MARG[PR.margin]||15;return{t:m,r:m,b:m,l:m,g:PR.sides=="one"?0:(+PR.gutter||0)};
}
function printW(o){const [w]=sdim(o),M=marg();let pw=(w-M.l-M.r-(PR.sides=="long"?M.g:0))*MM;if(PR.nup==2&&PR.mode!="tpl")pw=(pw-NGAP*MM)/2;return pw}
function pageH(o){const [,h]=sdim(o),M=marg();return(h-M.t-M.b-(PR.sides=="short"?M.g:0))*MM}
function pageCss(o){
  const M=marg(),pn=PR.pagenum?`@bottom-center{content:"${H("Trang ","Page ")}" counter(page) " / " counter(pages);font:10px Arial,sans-serif;color:#666}`:"";
  let c=`@page{size:${pageName(PR.paper)} ${o};margin:${M.t}mm ${M.r}mm ${M.b}mm ${M.l}mm;${pn}}`;
  if(PR.sides=="long"){
    if(PR.mode=="tpl")c+=`@page :right{margin-left:${M.l}mm;margin-right:${M.r}mm}@page :left{margin-left:${M.r}mm;margin-right:${M.l}mm}`;
    else c+=`@page :right{margin-left:${M.l+M.g}mm;margin-right:${M.r}mm}@page :left{margin-left:${M.l}mm;margin-right:${M.r+M.g}mm}`;
  }
  if(PR.sides=="short")c+=`@page :right{margin-top:${M.t+M.g}mm}@page :left{margin-bottom:${M.b+M.g}mm}`;
  return c;
}

function cleanMain(){
  const main=document.querySelector("main");if(!main)return"";
  const clone=main.cloneNode(true);
  const oi=main.querySelectorAll("input,select,textarea"),ci=clone.querySelectorAll("input,select,textarea");
  ci.forEach((el,k)=>{
    const o=oi[k],sp=document.createElement("span");
    if(el.tagName=="SELECT"){const op=o.options[o.selectedIndex];sp.textContent=op?op.text:""}
    else if(el.type=="checkbox"||el.type=="radio")sp.textContent=o.checked?"☑":"☐";
    else if(el.type=="hidden"){el.remove();return}
    else sp.textContent=o.value;
    el.replaceWith(sp);
  });
  clone.querySelectorAll("button,.cmd,.chips,script,.bu-fab,.bx-row button,.bu-ov").forEach(e=>e.remove());
  clone.querySelectorAll("td.mid:last-child,th.mid:last-child").forEach(e=>{if(!e.textContent.trim())e.remove()});
  clone.querySelectorAll(".f").forEach(f=>{if(![...f.querySelectorAll("span")].some(s=>s.textContent.trim()))f.remove()});
  /* ô số / mã không xuống dòng giữa chừng */
  clone.querySelectorAll("table:not(.nb) td,table:not(.nb) th").forEach(c=>{const v=c.textContent.trim();if(v&&v.length<=24&&(/^[\s\d.,:\/\-+%()₫$đ]+$/.test(v)||/^[A-Za-z]{1,6}-[\w-]+$/.test(v)))c.classList.add("nw")});
  /* chỉ in bảng dữ liệu: bỏ thẻ giao diện, ghi chú, nút, menu */
  if(PR.tonly){
    const tbs=[...clone.querySelectorAll("table:not(.nb)")].filter(t=>!t.parentElement.closest("table")&&t.rows.length);
    if(tbs.length){
      let last="";
      return tbs.map(t=>{
        const card=t.closest(".cd"),h=card&&card.querySelector("h2,h3,h4");
        let ti=h?h.textContent.replace(/\s+/g," ").trim():"";
        const show=ti&&ti!==last;last=ti||last;
        return `<section class="pr-tb">${show?`<h3 class="pr-tt">${X(ti)}</h3>`:""}${t.outerHTML}</section>`;
      }).join("");
    }
  }
  return clone.innerHTML;
}

  const head=txt.split(/\r?\n/).slice(0,5).join("\n"),cand=[",",";","\t","|"],d=cand.map(c=>[c,(head.match(new RegExp(c==="|"?"\\|":c==="\t"?"\t":c,"g"))||[]).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];

    else if(ch=='"')q=true;else if(ch===d){row.push(cur);cur=""}
    else if(ch=="\n"){row.push(cur.replace(/\r$/,""));rows.push(row);row=[];cur=""}

BU.fileLoad=async function(inp){

function tuneTables(){

      const last=rows[0].cells.length-1;
      if(last>0&&rows.some(r=>r.cells[last]&&r.cells[last].querySelector(".bx-row,.bx"))){
        rows.forEach(r=>{if(r.cells[last])r.cells[last].classList.add("stk")});
        const th=tb.tHead&&tb.tHead.rows[0]&&tb.tHead.rows[0].cells[last];if(th)th.classList.add("stk");
      }
    });

  });

      sb.from("notifications").update({is_read:true}).in("id",ids).then(r=>{if(!r.error){NTF.forEach(n=>{n.is_read=true});const d=document.querySelector(".tb-btn .badge-dot");if(d)d.remove();fixNtf()}});
    }
  }
};
function fixNtf(){
  const p=$("notif-panel");if(!p)return;
  const read=NTF.filter(n=>n.is_read).length;
  let h=p.querySelector(".ntf-h");
  if(!h){h=document.createElement("div");h.className="ntf-h";p.insertBefore(h,p.firstChild)}
  h.innerHTML=`<b>${t("notif_title")}</b><span><button class="bx" ${read?"":"disabled style='opacity:.45;cursor:default'"} onclick="BU.ntfClear()">${ICON.trash}<span>${H("Xóa đã xem","Clear read")}${read?" ("+read+")":""}</span></button></span>`;
  if(ntfOpen){p.style.display="block";p.classList.add("show")}
}
BU.ntfClear=async function(){
  const r=await sb.from("notifications").delete().eq("user_id",ME.id).eq("is_read",true);
  if(r.error){ntfOpen=true;MSG=H("Chưa xóa được thông báo: ","Could not clear notifications: ")+r.error.message+H(" – chạy file supabase_ui_update.sql để cấp quyền."," – run supabase_ui_update.sql to grant permission.");return draw()}
  ntfOpen=true;await load();
};

function fitKpi(){
  document.querySelectorAll(".kpicard>div:nth-child(2)").forEach(v=>{
    v.style.fontSize="";let fs=parseFloat(getComputedStyle(v).fontSize);
    while(v.scrollWidth>v.clientWidth+1&&fs>13){fs-=1;v.style.fontSize=fs+"px"}
  });
}
const _draw2=draw;
draw=function(){_draw2();try{addTabs();tuneTables();upgradeButtons();fixNtf();fitKpi()}catch(e){console.warn(e)}};
window.addEventListener("resize",()=>{try{fitKpi()}catch(e){}});

syncFab();
})();

/* STT is UI-only: it never changes database IDs or business codes. */
(function(){
  const applySTT = () => {
    document.querySelectorAll('.tw table').forEach(table => {
      const headRow=table.tHead&&table.tHead.rows&&table.tHead.rows[0], body=table.tBodies&&table.tBodies[0];
      if(!headRow||!body)return;
      let th=headRow.querySelector('th.stt-col');
      if(!th){th=document.createElement('th');th.className='stt-col';th.setAttribute('scope','col');headRow.insertBefore(th,headRow.firstChild)}
      th.textContent=(typeof LANG!=='undefined'&&LANG==='en')?'No.':'Số thứ tự';
      let n=0;
      Array.from(body.rows).forEach(row=>{
        const first=row.firstElementChild;
        if(first&&first.hasAttribute('colspan')){if(!first.dataset.sttColspan){first.colSpan=Number(first.colSpan||1)+1;first.dataset.sttColspan='1'}return}
        let cell=row.querySelector(':scope > td.stt-col');if(!cell){cell=document.createElement('td');cell.className='stt-col';row.insertBefore(cell,row.firstChild)}
        cell.textContent=String(++n);
      });
    });
  };
  let queued=false;const schedule=()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;applySTT()})};
  const init=()=>{applySTT();new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true});document.addEventListener('click',schedule,true);document.addEventListener('change',schedule,true)};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();

/* ---------- Forgot password by email OTP ---------- */
const otp={
  s:{step:1,email:"",cool:0,timer:null,busy:false,mode:"own"},
  ov(){return document.getElementById("otp-ov")},
  open(){
    const pre=((document.getElementById("le")||{}).value||"").trim();
    clearInterval(this.s.timer);
    this.s={step:1,email:pre,cool:0,timer:null,busy:false,mode:"own"};
    let ov=this.ov();if(ov)ov.remove();
    ov=document.createElement("div");ov.id="otp-ov";ov.className="otp-ov";ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");
    document.body.appendChild(ov);this.render();
  },
  close(){clearInterval(this.s.timer);const ov=this.ov();if(ov)ov.remove()},
  mask(e){const [u,d]=String(e).split("@");return (u.length>2?u.slice(0,2):u.slice(0,1))+"***@"+(d||"")},
  render(){
    const ov=this.ov();if(!ov)return;const s=this.s;
    const x=`<button class="otp-x" onclick="hrOtp.close()" aria-label="${T2("Đóng","Close")}"><i class="ti ti-x"></i></button>`;
    if(s.step===1){
      ov.innerHTML=`<div class="otp-card">${x}<span class="otp-ic"><i class="ti ti-mail-fast"></i></span>
        <h2>${t("forgot")}</h2><p class="otp-sub">${T2("Nhập email đăng nhập. Hệ thống sẽ gửi mã OTP để bạn tự đặt mật khẩu mới.","Enter your sign-in email. We will send an OTP so you can set a new password yourself.")}</p>
        <div class="nf"><i class="ti ti-mail"></i><input id="otp-email" type="email" autocomplete="username" placeholder="${t("email")}" value="${esc(s.email)}"></div>
        <p class="otp-err" id="otp-err"></p>
        <button class="nm-btn" id="otp-go" onclick="hrOtp.send()">${T2("Gửi mã OTP","Send OTP")}</button>
        <a class="otp-link" href="#" onclick="hrOtp.close();return false">${T2("Quay lại đăng nhập","Back to sign in")}</a></div>`;
      const i=document.getElementById("otp-email");i.addEventListener("keydown",e=>{if(e.key==="Enter")this.send()});i.focus();
    }else{
      ov.innerHTML=`<div class="otp-card">${x}<span class="otp-ic"><i class="ti ti-shield-check"></i></span>
        <h2>${T2("Nhập mã OTP","Enter the OTP")}</h2><p class="otp-sub">${T2("Mã đã được gửi tới","The code was sent to")} <b>${esc(this.mask(s.email))}</b>. ${T2("Kiểm tra cả thư rác nếu chưa thấy.","Check your spam folder too.")}</p>
        <div class="nf otp-code"><input id="otp-code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="••••••"></div>
        <p class="otp-err" id="otp-err"></p>
        <button class="nm-btn" id="otp-go" onclick="hrOtp.verify()">${T2("Xác nhận","Verify")}</button>
        <div class="otp-foot"><button class="otp-resend" id="otp-rs" onclick="hrOtp.resend()" disabled>${T2("Gửi lại mã","Resend code")}</button><a href="#" onclick="hrOtp.back();return false">${T2("Đổi email","Change email")}</a></div></div>`;
      const c=document.getElementById("otp-code");
      c.addEventListener("input",()=>{c.value=c.value.replace(/\D/g,"")});
      c.addEventListener("keydown",e=>{if(e.key==="Enter")this.verify()});c.focus();this.tick();
    }
  },
  err(m){const e=document.getElementById("otp-err");if(e)e.textContent=m||""},
  busy(on){this.s.busy=on;const b=document.getElementById("otp-go");if(b)b.classList.toggle("ld",on)},
  cool(n){clearInterval(this.s.timer);this.s.cool=n;this.s.timer=setInterval(()=>{this.s.cool--;if(this.s.cool<=0)clearInterval(this.s.timer);this.tick()},1000)},
  tick(){const b=document.getElementById("otp-rs");if(!b)return;const n=this.s.cool;b.disabled=n>0;b.textContent=n>0?T2("Gửi lại mã sau ","Resend in ")+n+"s":T2("Gửi lại mã","Resend code")},
  back(){clearInterval(this.s.timer);this.s.step=1;this.render()},
  mapErr(e){const m=String((e&&e.message)||"");if((e&&e.status===429)||/rate|too many|seconds|limit/i.test(m))return T2("Bạn yêu cầu quá nhiều lần. Vui lòng đợi vài phút rồi thử lại.","Too many requests. Please wait a few minutes and try again.");return T2("Chưa gửi được mã. Vui lòng thử lại sau.","Could not send the code. Please try again later.")},
  /* OTP do HR Portal tự tạo: gọi Edge Function "hr-otp" (xem thư mục otp-setup). */
  async api(body){
    let res,j={};
    try{
      res=await fetch(URL_+"/functions/v1/hr-otp",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify(body)});
      try{j=await res.json()}catch(e){}
    }catch(e){return{error:{message:String((e&&e.message)||e)}}}
    if(res.status===404)return{error:{missing:true,message:"not deployed"}};
    if(!res.ok)return{error:{status:res.status,message:j.error||"error",code:j.error}};
    return{data:j};
  },
  async request(email){
    const r=await this.api({action:"send",email});
    if(r.error&&r.error.missing){            /* chưa triển khai hàm riêng → dùng OTP mặc định của Supabase */
      this.s.mode="sb";let x;try{x=await sb.auth.resetPasswordForEmail(email)}catch(e){x={error:e}}return x;
    }
    this.s.mode="own";return r;
  },
  async send(){
    if(this.s.busy)return;
    const email=((document.getElementById("otp-email")||{}).value||"").trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return this.err(T2("Email chưa đúng định dạng.","Enter a valid email address."));
    this.err("");this.busy(true);const r=await this.request(email);this.busy(false);
    if(r.error)return this.err(this.mapErr(r.error));
    this.s.email=email;this.s.step=2;this.cool(60);this.render();
  },
  async resend(){
    if(this.s.busy||this.s.cool>0)return;
    this.err("");this.busy(true);const r=await this.request(this.s.email);this.busy(false);
    if(r.error)return this.err(this.mapErr(r.error));
    this.cool(60);this.tick();this.err("");
  },
  async verify(){
    if(this.s.busy)return;
    const tok=((document.getElementById("otp-code")||{}).value||"").replace(/\D/g,"");
    if(tok.length<6)return this.err(T2("Nhập đủ mã OTP trong email.","Enter the full code from the email."));
    this.err("");this.busy(true);
    if(this.s.mode==="own"){
      const a=await this.api({action:"verify",email:this.s.email,code:tok});
      if(a.error){this.busy(false);return this.err(a.error.status===429?T2("Nhập sai quá nhiều lần. Hãy gửi mã mới.","Too many wrong attempts. Request a new code."):T2("Mã không đúng hoặc đã hết hạn. Hãy kiểm tra lại hoặc gửi mã mới.","The code is wrong or expired. Check it or request a new one."))}
      let v;try{v=await sb.auth.verifyOtp({token_hash:a.data.token_hash,type:"recovery"})}catch(e){v={error:e}}
      this.busy(false);
      if(v.error||!(v.data&&v.data.session))return this.err(T2("Không mở được phiên đặt mật khẩu. Hãy gửi mã mới.","Could not open the password session. Request a new code."));
      this.close();RECOV=true;MSG="";draw();return;
    }
    let r;try{r=await sb.auth.verifyOtp({email:this.s.email,token:tok,type:"recovery"})}catch(e){r={error:e}}
    this.busy(false);
    if(r.error||!(r.data&&r.data.session))return this.err(T2("Mã không đúng hoặc đã hết hạn. Hãy kiểm tra lại hoặc gửi mã mới.","The code is wrong or expired. Check it or request a new one."));
    this.close();RECOV=true;MSG="";draw();
  }
};
window.hrOtp=otp;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&otp.ov())otp.close()});

/* ---------- Set-new-password page helpers ---------- */
window.rcvCheck=()=>{
  const a=(document.getElementById("np")||{}).value||"",b=(document.getElementById("np2")||{}).value||"";
  let sc=0;if(a.length>=6)sc++;if(a.length>=10)sc++;if(/[a-z]/.test(a)&&/[A-Z]/.test(a))sc++;if(/\d/.test(a)&&/[^A-Za-z0-9]/.test(a))sc++;
  const m=document.getElementById("rcvm");if(m)[...m.children].forEach((i,k)=>{i.className=a&&k<sc?"on":""});

window.hx.adv=async function(tb,id,to,kind){
  if(!to)return;const row=(DB[tb]||[]).find(r=>String(r.id)===String(id));if(!row)return;
  if(!(FLOW[kind][row.status]||[]).includes(to)){MSG=HX('Chuyển trạng thái không hợp lệ.','Invalid status transition.');return draw()}
  if(to==='submitted'&&!confirm(HX('Xác nhận hồ sơ này ĐÃ ĐƯỢC NỘP thực tế cho cơ quan có thẩm quyền? Hệ thống không tự nộp thay bạn.','Confirm this file has ACTUALLY been submitted to the authority? The system never submits on your behalf.')))return draw();
  if(to==='accepted'&&!confirm(HX('Xác nhận cơ quan đã chấp nhận hồ sơ (có thông báo/biên nhận)?','Confirm the authority accepted the file (notice/receipt received)?')))return draw();
  const nt=prompt(HX('Ghi chú / lý do (không bắt buộc):','Note / reason (optional):'),'');if(nt===null)return draw();
  const patch={status:to};const d=todayISO();
  if(to==='submitted'&&('submitted_on' in row))patch.submitted_on=d;
  if((to==='accepted'||to==='completed')&&('result_on' in row))patch.result_on=d;
  const r=await sb.from(tb).update(patch).eq('id',id);
  if(r.error){MSG=HX('Lỗi: ','Error: ')+r.error.message;return draw()}
  await logC(tb,id,'status_change',row.status,to,nt);
  MSG=HX('Đã chuyển trạng thái: ','Status changed: ')+stName(to);await load();
};

/* ---------- tính mức đóng bảo hiểm bắt buộc theo hồ sơ từng người ---------- */
function insCalc(e,ym){
  const s=sal(e.id)||{},region=s.region||1,mw=MW[region]||MW[1];
  const raw=(s.ins_base!=null&&s.ins_base!=='')?+s.ins_base:(+s.sal||0);
  const insured=s.insured!==false&&raw>0;
  const base=Math.max(raw,mw),capSI=ruleAt('si_cap_multiplier',ym,20)*refSal(ym),capUI=20*mw;
  const b1=Math.min(base,capSI),b2=Math.min(base,capUI),R=Math.round;
  const pEE=payrollRule('bhxh_employee_pct',8),pER=payrollRule('bhxh_employer_pct',17.5),yEE=payrollRule('bhyt_employee_pct',1.5),yER=payrollRule('bhyt_employer_pct',3),uEE=payrollRule('bhtn_employee_pct',1),uER=payrollRule('bhtn_employer_pct',1);
  const SICK=3,TNLD=0.5,RET=Math.max(0,pER-SICK-TNLD);
  const z=v=>insured?R(v):0;
  const ee={xh:z(b1*pEE/100),yt:z(b1*yEE/100),tn:z(b2*uEE/100)},er={ret:z(b1*RET/100),sick:z(b1*SICK/100),tnld:z(b1*TNLD/100),yt:z(b1*yER/100),tn:z(b2*uER/100)};
  ee.tot=ee.xh+ee.yt+ee.tn;er.tot=er.ret+er.sick+er.tnld+er.yt+er.tn;
  return{insured,region,mw,raw,base,b1,b2,capSI,capUI,below:insured&&raw<mw,above:insured&&base>capSI,ee,er,total:ee.tot+er.tot,noSal:!(+s.sal>0)&&!(raw>0)};
}
const insRows=ym=>P.filter(isActive).map(e=>({e,c:insCalc(e,ym)}));
