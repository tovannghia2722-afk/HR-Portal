function cls(e){return (DB.labor_classification||[]).find(x=>String(x.user_id)===String(e.id))||{}}
function laborCol(Y){
  const asOf=Y===Y0?todayISO():Y+'-12-31',start=Y+'-01-01',prevEnd=(Y-1)+'-12-31';
  const st=e=>e.start_date||'',en=e=>cls(e).end_date||'';
  const at=d=>P.filter(e=>st(e)&&st(e)<=d&&(!en(e)||en(e)>d));
  const begin=at(prevEnd),endL=at(asOf);
  const inc=P.filter(e=>st(e)>=start&&st(e)<=asOf),dec=P.filter(e=>en(e)>=start&&en(e)<=asOf);
  const hasContract=(e,d)=>(DB.contracts||[]).some(c=>String(c.user_id)===String(e.id)&&(!c.start_date||c.start_date<=d)&&(!c.end_date||c.end_date>=d));
  const g=e=>String(cls(e).gender||'').toLowerCase();
  const direct=endL.filter(e=>cls(e).labor_type==='direct'),indirect=endL.filter(e=>cls(e).labor_type!=='direct');
  const lvl=k=>indirect.filter(e=>(cls(e).job_level||'professional')===k).length;
  const lastM=Y===Y0?NOW.getMonth()+1:12;let sum=0;for(let m=1;m<=lastM;m++)sum+=at(Y+'-'+String(m).padStart(2,'0')+'-'+String(lastDay(Y+'-'+String(m).padStart(2,'0'))).padStart(2,'0')).length;
  const noStart=P.filter(e=>!st(e)).length,noCls=endL.filter(e=>!cls(e).id).length,noGender=endL.filter(e=>!g(e)).length;
  return{begin:begin.length,inc:inc.length,dec:dec.length,retire:dec.filter(e=>cls(e).end_reason==='retire').length,surplus:dec.filter(e=>cls(e).end_reason==='redundant').length,end:endL.length,
    female:endL.filter(e=>g(e)==='female').length,contract:endL.filter(e=>hasContract(e,asOf)).length,waiting:endL.filter(e=>cls(e).waiting_for_work).length,
    direct:direct.length,indirect:indirect.length,lead:lvl('leadership'),prof:lvl('professional'),support:lvl('support'),avg:lastM?Math.round(sum/lastM):0,noStart,noCls,noGender,asOf};
}

/* ---------- đối soát: bảo hiểm tính theo hồ sơ vs bảng lương đã chốt ---------- */
function reconcile(ym){
  const runs=(RUN||[]).filter(r=>r.month===ym);if(!runs.length)return{locked:false,diffs:[]};
  const diffs=[];
  runs.forEach(r=>{const e=P.find(p=>String(p.id)===String(r.user_id));if(!e)return;const c=insCalc(e,ym);
    const d1=(+r.bhxh||0)-c.ee.xh,d2=(+r.bhyt||0)-c.ee.yt,d3=(+r.bhtn||0)-c.ee.tn;
    if(Math.abs(d1)>1||Math.abs(d2)>1||Math.abs(d3)>1)diffs.push({e,run:r,c,d1,d2,d3});});
  return{locked:true,diffs,count:runs.length};
}

/* =====================================================================
   CHẾ ĐỘ ỐM ĐAU & THAI SẢN: kiểm tra điều kiện, tính mức hưởng dự kiến, lưu hồ sơ, chuyển trạng thái có xác nhận
   ===================================================================== */
const gv=id=>{const el=document.getElementById(id);return el?(el.type==='checkbox'?el.checked:el.value):''};
const empSelect=(id,cur)=>`<select id="${id}"><option value="">— ${HX('Chọn nhân viên','Select employee')} —</option>${P.filter(isActive).map(e=>`<option value="${e.id}" ${String(cur)===String(e.id)?'selected':''}>${E(e.name)}${e.employee_code?' ('+E(e.employee_code)+')':''}</option>`).join('')}</select>`;
const workdays=(a,b)=>{if(!a||!b||b<a)return 0;let n=0;for(let d=new Date(a);d<=new Date(b);d.setDate(d.getDate()+1)){if(d.getDay()!==0)n++}return n};
const baseOf=(uid,ym)=>{const e=P.find(p=>String(p.id)===String(uid));return e?insCalc(e,ym).b1:0};
const monthsPaid=(uid,fromYm,toYm)=>{const set=new Set();(RUN||[]).forEach(r=>{if(String(r.user_id)===String(uid)&&r.month>=fromYm&&r.month<=toYm&&(+r.bhxh>0||+r.insurance>0))set.add(r.month)});return set.size};

/* ---------- ỐM ĐAU ---------- */
window.hx.sickCalc=function(){
  const s=S.sick;s.uid=gv('sk-emp');s.type=gv('sk-type');s.start=gv('sk-start');s.end=gv('sk-end');s.days=+gv('sk-days')||0;s.years=+gv('sk-years')||0;s.heavy=!!gv('sk-heavy');s.age=gv('sk-age')||'u3';s.base=+gv('sk-base')||0;s.doc=gv('sk-doc');s.note=gv('sk-note');
  if(!s.uid||!s.start){MSG=HX('Chọn nhân viên và ngày bắt đầu nghỉ.','Select an employee and start date.');return draw()}
  if(!s.days)s.days=workdays(s.start,s.end||s.start);
  const ym=s.start.slice(0,7),prev=ymAdd(ym,-1),yr=s.start.slice(0,4);
  const base=s.base||baseOf(s.uid,prev);
  const used=(DB.si_sickness_claims||[]).filter(c=>String(c.user_id)===String(s.uid)&&c.claim_type===s.type&&String(c.start_date||'').slice(0,4)===yr&&c.status!=='cancelled').reduce((n,c)=>n+(+c.entitled_days||0),0);
  let max=0,rule='';
  if(s.type==='sick'){const idx=s.years<15?0:s.years<30?1:2;max=(s.heavy?[40,50,70]:[30,40,60])[idx];rule=HX(`Đóng BHXH ${s.years} năm${s.heavy?', làm nghề nặng nhọc/độc hại':''} → tối đa ${max} ngày/năm`,`${s.years} yrs contributions${s.heavy?', hazardous work':''} → max ${max} days/year`)}
  else if(s.type==='child_sick'){max=s.age==='u3'?20:15;rule=s.age==='u3'?HX('Con dưới 3 tuổi → tối đa 20 ngày/năm','Child under 3 → max 20 days/year'):HX('Con từ 3 đến dưới 7 tuổi → tối đa 15 ngày/năm','Child 3–<7 → max 15 days/year')}
  else{max=10;rule=HX('Dưỡng sức, phục hồi sức khỏe: tối đa 10 ngày/năm (5–10 ngày tùy trường hợp) — cần đối chiếu','Convalescence: up to 10 days/year (5–10 depending on case) — verify')}
  const room=Math.max(0,max-used),ent=Math.min(s.days,room);
  const pct=ruleAt('sick_benefit_pct',ym,75);
  const amount=s.type==='convalescence'?ent*0.3*refSal(ym):(base*pct/100/24)*ent;
  s.res={max,used,room,ent,base,pct,amount,rule,ym,over:Math.max(0,s.days-ent)};draw();
};
window.hx.sickSave=async function(){
  const s=S.sick,r=s.res;if(!r){MSG=HX('Hãy bấm “Tính” trước khi lưu.','Click “Calculate” before saving.');return draw()}
  const row={user_id:s.uid,claim_type:s.type,start_date:s.start,end_date:s.end||s.start,leave_days:s.days,entitled_days:r.ent,wage_base:r.base,est_amount:Math.round(r.amount),medical_doc:s.doc||null,status:'draft',note:s.note||null,received_on:todayISO()};
  const x=await sb.from('si_sickness_claims').insert(row).select('id').maybeSingle();
  if(x.error){MSG=HX('Không lưu được: ','Could not save: ')+x.error.message;return draw()}
  await logC('si_sickness_claims',x.data&&x.data.id,'create',null,'draft','Tạo hồ sơ ốm đau');S.sick={};MSG=HX('Đã lưu hồ sơ ốm đau (bản nháp). Chưa được xem là đã nộp.','Sickness file saved as draft. It is not treated as submitted.');await load();
};

window.hx.filCreate=async function(){
  const ym=S.tax.month||ym0();const rows=pitMonth(ym);
  if((DB.pit_filings||[]).some(f=>f.period_type==='month'&&f.period_label===ym)){MSG=HX('Đã có kỳ kê khai tháng '+ym+'.','A filing for '+ym+' already exists.');return draw()}
  const taxed=rows.filter(r=>r.tax>0);
  const r=await sb.from('pit_filings').insert({period_type:'month',period_label:ym,employees_count:taxed.length,total_income:Math.round(rows.reduce((n,x)=>n+x.sal+x.al+x.bonus+x.ot-x.dd,0)),taxable_income:Math.round(rows.reduce((n,x)=>n+(x.ttax||0),0)),tax_withheld:Math.round(rows.reduce((n,x)=>n+x.tax,0)),due_date:DEADLINE.month(ym),status:'draft',note:(RUN||[]).some(x=>x.month===ym)?'Từ bảng lương đã chốt':'Từ số liệu dự tính (chưa chốt lương)'}).select('id').maybeSingle();
  if(r.error){MSG=HX('Không tạo được: ','Failed: ')+r.error.message;return draw()}
  await logC('pit_filings',r.data&&r.data.id,'create',null,'draft','Tạo kỳ '+ym);MSG=HX('Đã tạo kỳ kê khai (bản nháp) từ bảng lương.','Filing created as draft from payroll.');await load();
};
window.hx.filPay=async function(id){
  const f=(DB.pit_filings||[]).find(x=>x.id==id);if(!f)return;
  const amt=prompt(HX('Số tiền ĐÃ NỘP vào ngân sách (₫):','Amount ACTUALLY paid (₫):'),f.tax_withheld||0);if(amt===null)return;
  const dt=prompt(HX('Ngày nộp (YYYY-MM-DD):','Payment date (YYYY-MM-DD):'),todayISO());if(dt===null)return;
  const rc=prompt(HX('Số chứng từ nộp tiền / mã giao dịch:','Payment receipt no.:'),f.receipt_ref||'');if(rc===null)return;
  const r=await sb.from('pit_filings').update({tax_paid:+amt||0,paid_on:dt||null,receipt_ref:rc||null}).eq('id',id);
  if(r.error){MSG=r.error.message;return draw()}await logC('pit_filings',id,'payment',f.status,f.status,'Nộp '+amt+' ngày '+dt+' – '+rc);MSG=HX('Đã ghi nhận nộp tiền.','Payment recorded.');await load();
};
window.hx.filAdd=async function(){
  const t=gv('fl-type'),l=gv('fl-label').trim();if(!l){MSG=HX('Nhập nhãn kỳ (vd 2026-10, 2026-Q4, 2026).','Enter a period label.');return draw()}
  const due=t==='month'?DEADLINE.month(l):t==='quarter'?DEADLINE.quarter(l):DEADLINE.yearOrg(l);
  const r=await sb.from('pit_filings').insert({period_type:t,period_label:l,due_date:due,status:'draft'});
  if(r.error){MSG=r.error.message;return draw()}MSG=HX('Đã thêm kỳ.','Period added.');await load();
};

function finalCalc(Y){
  const out=[];const pd=payrollRule('pit_personal_deduction',15500000),dd=payrollRule('pit_dependent_deduction',6200000);
  P.forEach(e=>{
    const rs=(RUN||[]).filter(r=>String(r.user_id)===String(e.id)&&String(r.month).slice(0,4)===String(Y));if(!rs.length)return;
    const months=new Set(rs.map(r=>r.month)).size,sum=f=>rs.reduce((n,r)=>n+(+r[f]||0),0);
    const income=rs.reduce((n,r)=>n+(+r.sal||0)+(+r.al||0)+(+r.bonus||0)+(+r.ot||0)-(+r.deduct||0),0),ins=sum('insurance'),tx=sum('taxable'),withheld=sum('tax');
    const deps=+sal(e.id).dependents||0,fam=pd*months+dd*deps*months,due=pitAnnual(tx),diff=withheld-due,pp=pitProf(e.id);
    let au,tone;
    if(!e.tax_code){au=HX('Thiếu MST – bổ sung trước','Missing tax code');tone='bad'}
    else if(pp.other_income===true){au=HX('Có thu nhập nơi khác → tự quyết toán','Other income → self-file');tone='warn'}
    else if(pp.other_income===false&&pp.authorization_status==='authorized'){au=HX('Đã ủy quyền – cần giấy ủy quyền hợp lệ','Authorized – keep valid form');tone='ok'}
    else if(pp.other_income===false){au=HX('Có thể ủy quyền (cần xác nhận)','May authorize (confirm)');tone='blue'}
    else{au=HX('Cần xác minh nguồn thu nhập','Verify income sources');tone=''}
    const left=!isActive(e);
    out.push({e,months,income,ins,fam,tx,due,withheld,diff,au,tone,left,deps,pp});
  });
  return out;
}

const DEFAULT_CRIT=[['Chuyên môn phù hợp vị trí',2],['Giải quyết vấn đề & tư duy',2],['Giao tiếp & trình bày',1],['Làm việc nhóm & thái độ',1],['Phù hợp giá trị công ty',1]];
window.hx.scSet=(id,v)=>{const s=S.score;s.ev=gv('sc-ev');s.rec=gv('sc-rec')||s.rec;s.scores=s.scores||{};s.scores[id]=v;draw()};
window.hx.scPick=()=>{S.score.cand=gv('sc-cand');S.score.scores={};S.score.ev='';draw()};
window.hx.scSave=async function(){
  const s=S.score,c=(DB.candidates||[]).find(x=>x.id==s.cand);if(!c)return;
  const crit=critFor(c),sc=s.scores||{};if(crit.some(x=>!sc[x.id])){MSG=HX('Chấm đủ tất cả tiêu chí (1–5) trước khi lưu.','Score every criterion (1–5) before saving.');return draw()}
  const ev=gv('sc-ev');if(!ev.trim()){MSG=HX('Nhập bằng chứng/ghi chú quan sát cho điểm số (bắt buộc).','Enter evidence for the scores (required).');return draw()}
  const tw=crit.reduce((n,x)=>n+x.w,0),ws=crit.reduce((n,x)=>n+sc[x.id]*x.w,0)/tw;
  const r=await sb.from('rec_scorecards').insert({candidate_id:c.id,interviewer_id:ME.id,round_type:gv('sc-round')||'competency',job_title:c.position||null,scores_json:Object.fromEntries(crit.map(x=>[x.name,sc[x.id]])),weighted_score:Math.round(ws*100)/100,recommendation:gv('sc-rec')||'hold',evidence:ev});
  if(r.error){MSG=HX('Không lưu được: ','Could not save: ')+r.error.message;return draw()}
  S.score={cand:s.cand};MSG=HX('Đã lưu thẻ điểm. Điểm của từng người phỏng vấn được giữ riêng, không ghi đè lên nhau.','Scorecard saved. Each interviewer’s scores are stored independently.');await load();
};
function critFor(c){
  const pos=String(c.position||'').trim().toLowerCase();
  const rows=(DB.rec_criteria||[]).filter(x=>x.active!==false&&String(x.job_title||'').trim().toLowerCase()===pos);
  if(rows.length)return rows.map(x=>({id:'c'+x.id,name:x.criterion,w:+x.weight||1,desc:x.scale_desc||''}));
  return DEFAULT_CRIT.map((d,i)=>({id:'d'+i,name:d[0],w:d[1],desc:'',def:true}));
}

/* =====================================================================
   ĐÀO TẠO & PHÁT TRIỂN: TNA → Kế hoạch → ADDIE → Quản lý khóa học → Năng lực → IDP → Kirkpatrick → KPI
   ===================================================================== */
const latestAss=(uid,cid)=>{const a=(DB.ld_assessments||[]).filter(x=>String(x.user_id)===String(uid)&&String(x.competency_id)===String(cid)).sort((x,y)=>String(y.assessed_on||'').localeCompare(String(x.assessed_on||'')));return a[0]||null};
const jobKey=e=>String(e.pos||e.title||'').trim().toLowerCase();
function gaps(){
  const out=[];const reqs=DB.ld_job_competencies||[],comps=DB.ld_competencies||[];
  P.filter(isActive).forEach(e=>{
    const k=jobKey(e);if(!k)return;
    reqs.filter(r=>String(r.job_title||'').trim().toLowerCase()===k).forEach(r=>{
      const cm=comps.find(c=>c.id==r.competency_id),a=latestAss(e.id,r.competency_id),lvl=a?+a.level:null;
      out.push({e,cm,req:+r.required_level||0,lvl,gap:lvl===null?null:Math.max(0,(+r.required_level||0)-lvl),evidence:a&&a.evidence});
    });
  });
  return out;
}

    const hrsCourse=comp.reduce((n,e)=>{const c=courses.find(c=>c.id==e.course_id);return n+(c&&+c.hours?+c.hours:0)},0);
    const hrs=hrsAtt||hrsCourse,hrsSrc=hrsAtt?HX('từ điểm danh','from attendance'):hrsCourse?HX('từ số giờ khóa học đã hoàn thành','from completed course hours'):HX('chưa có dữ liệu giờ học','no hours data');

    const cost=enr.reduce((n,e)=>n+(+e.cost||0),0);
    const planDone=plans.filter(p=>p.status==='completed').length,planAll=plans.filter(p=>p.status!=='cancelled').length;

     ${kpi('ti-target-arrow','Plan Achievement '+Y,planAll?PCT(planDone,planAll)+'%':'—',planAll?`${planDone}/${planAll}`:HX('chưa có kế hoạch','no plan'),'')}
     ${kpi('ti-chart-arrows-vertical','Competency Gap Closure',first?PCT(closed,first)+'%':'—',first?HX('khoảng cách đã thu hẹp','gap closed'):HX('cần ≥2 lần đánh giá','needs ≥2 assessments'),'')}
     ${kpi('ti-user-bolt','Behavior Change (L3)',l3a===null?'—':l3a+'/5',l3.length?`${l3.length} ${HX('đánh giá','evaluations')}`:HX('chưa có L3','no L3 yet'),'')}

addView('ldGap','Ma trận năng lực & khoảng cách','Competency gap matrix','ti-grid-dots',function(){
  const comps=(DB.ld_competencies||[]).filter(c=>c.active!==false),g=gaps(),emps=[...new Set(g.map(x=>x.e.id))].map(id=>P.find(p=>p.id===id));
  const tbl=emps.length&&comps.length?`<div class="hx-ov"><table class="hx-tbl" id="hx-gap"><thead><tr><th>${HX('Nhân viên','Employee')}</th><th>${HX('Chức danh','Position')}</th>${comps.map(c=>`<th class="n" title="${E(c.description||'')}">${E(c.code||c.name)}</th>`).join('')}</tr></thead><tbody>${emps.map(e=>`<tr><td>${E(e.name)}</td><td>${E(e.pos||'')}</td>${comps.map(c=>{const x=g.find(y=>y.e.id===e.id&&y.cm&&y.cm.id===c.id);if(!x)return '<td class="n mu">·</td>';const cl=x.gap===null?'':x.gap===0?'ok':x.gap>=2?'bad':'warn';return `<td class="n">${chip(`${x.lvl===null?'?':x.lvl}/${x.req}`,cl)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class="hx-law">${HX('Ô hiển thị: mức hiện tại / mức yêu cầu. “?” = chưa đánh giá. Xanh = đạt, vàng = thiếu 1 mức, đỏ = thiếu ≥ 2 mức.','Cell = current / required. “?” = not assessed. Green = met, amber = 1 short, red = 2+ short.')}</p><p><button onclick="hx.exp('hx-gap','ma-tran-nang-luc')"><i class="ti ti-file-spreadsheet"></i> Excel</button> <button onclick="hx.print()"><i class="ti ti-printer"></i> ${HX('In','Print')}</button></p>`:note('blue',HX('Chưa đủ dữ liệu: cần (1) thư viện năng lực, (2) yêu cầu năng lực theo chức danh (trùng với chức danh trong hồ sơ nhân viên), (3) đánh giá năng lực. Đánh giá phải dựa trên tiêu chí và bằng chứng, không chỉ nhận xét cảm tính.','Needs a competency library, requirements per job title (matching the employee position) and assessments. Assessments must rest on criteria and evidence.'));
  return `<div class="hx-wrap">${hero('ti-grid-dots',HX('Ma trận năng lực & khoảng cách','Competency gap matrix'),HX('So sánh mức năng lực yêu cầu của chức danh với mức hiện tại được đánh giá có bằng chứng.','Compares each position’s required level with the evidence-based current level.'),'')}${miss('ld_competencies','ld_job_competencies','ld_assessments')}${card('ti-table',HX('Ma trận','Matrix'),tbl)}</div>`;
});
