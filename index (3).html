V.rp=function(){const m=Array(12).fill(0),dp={},y=td.slice(0,4),n=x=>L.filter(l=>l.status==x).length;L.filter(l=>l.status=="Duyet").forEach(l=>dl(l.from_date,l.to_date).forEach(d=>{if(d.slice(0,4)==y){m[+d.slice(5,7)-1]++;const k=em(l.user_id).dept||"Chưa có phòng";dp[k]=(dp[k]||0)+1}}));P.forEach(e=>{const k=e.dept||"Chưa có phòng";dp[k]=dp[k]||0});
const mx=Math.max(1,...m),dm=Math.max(1,...Object.values(dp));
return`<div class="g"><div class="cd st"><span class="mu">Nhân viên</span><b>${P.length}</b></div><div class="cd st"><span class="mu">Đơn chờ duyệt</span><b>${n("Cho")}</b></div><div class="cd st"><span class="mu">Đơn đã duyệt</span><b>${n("Duyet")}</b></div></div><div class="cd"><h2>Ngày nghỉ đã duyệt theo tháng (${y})</h2><div class="bars">${m.map((v_,i)=>`<div class="bc"><div class="bv" style="height:${v_/mx*100}%"></div><b>${v_}</b><span>T${i+1}</span></div>`).join("")}</div></div><div class="cd"><h2>Ngày nghỉ theo phòng ban</h2>${Object.entries(dp).map(([k,c])=>`<div class="hb2"><span>${esc(k)}</span><div><i style="width:${c/dm*100}%"></i></div><b>${c}</b></div>`).join("")}</div>`};
const adj=(id,f,x)=>run(sb.from("payroll_adj").upsert({month:PM,user_id:id,[f]:+x||0}));
function slip(id){const r=payRows().find(x=>x.id==id);if(!r)return;const w=window.open("","_blank"),row=(a,b)=>`<tr><td>${a}</td><td style="text-align:right">${b}</td></tr>`;
w.document.write(`<html><head><meta charset="utf-8"><title>Phiếu lương</title><style>body{font-family:sans-serif;max-width:560px;margin:30px auto}table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:1px solid #ddd}</style></head><body><h2>PHIẾU LƯƠNG THÁNG ${PM.slice(5)}/${PM.slice(0,4)}</h2><p>Nhân viên: <b>${esc(r.name)}</b></p><table>${row("Lương cơ bản",vnd(r.sal))}${row("Phụ cấp",vnd(r.al))}${row("Thưởng",vnd(r.bonus))}${row("Tăng ca",vnd(r.ot))}${row("Phạt","-"+vnd(r.penalty))}${row("Nghỉ không lương ("+r.u+" ngày)","-"+vnd(r.dd))}${row("Bảo hiểm (10,5%)","-"+vnd(r.b))}${row("Thuế TNCN","-"+vnd(r.tax))}${row("<b>THỰC NHẬN</b>","<b>"+vnd(r.net)+"</b>")}</table><script>setTimeout(function(){print()},300)<\/script></body></html>`);w.document.close()}
async function fn(body){const r=await sb.functions.invoke("smart-api",{body});if(r.error){let m=r.error.message;try{m=(await r.error.context.json()).error||m}catch(e){}MSG="Lỗi: "+m}else MSG=r.data&&r.data.error?"Lỗi: "+r.data.error:"";await load()}
const addStaff=()=>{if(!v("s1")||v("s2").length<6){MSG="Cần email và mật khẩu từ 6 ký tự";return draw()}fn({action:"create",email:v("s1"),password:v("s2"),name:v("s3"),dept:v("s4"),pos:v("s5"),sal:+v("s6")||0})};
function admAct(id,a){if(!a)return;if(a=="delete"&&!confirm("Xóa vĩnh viễn nhân viên này cùng toàn bộ đơn nghỉ, chấm công, lương?"))return draw();if(a=="reset"){const p=prompt("Mật khẩu mới (từ 6 ký tự)");if(!p||p.length<6)return draw();return fn({action:"reset",id,password:p})}fn({action:a,id})}
function oneTap(){const a=AT.find(x=>x.user_id==ME.id&&x.day==td)||{},f=t=>new Date(t).toTimeString().slice(0,5),p=L.filter(l=>l.status=="Cho"&&(hr()||l.user_id==ME.id)).length,o=C.filter(l=>l.status=="Duyet"&&dl(l.from_date,l.to_date).includes(td)).length,lk=RUN.some(x=>x.month==PM),r=hr()?null:payRows()[0],
tile=(c,i)=>`<div class="ic ${c}"><i class="ti ${i}"></i></div>`,dot=(t,w)=>`<span class="dt ${w?"w":""}">● ${t}</span>`;
return`<div class="oc-g"><div class="oc">${dot(a.check_out?"Hoàn tất":a.check_in?"Đang làm":"Chưa check-in",!a.check_in)}${tile("b","ti-clock")}<b>Chấm công</b><span class="mu">${a.check_in?"Vào "+f(a.check_in)+(a.check_out?" · Ra "+f(a.check_out):""):"Chạm một lần để check-in"}</span><div class="oa"><button class="p" ${a.check_out?"disabled":""} onclick="ck('${a.check_in?"out":"in"}')">${a.check_in?"Check-out":"Check-in"}</button></div></div>
<div class="oc">${dot("Còn "+(QUOTA-used(ME.id))+" ngày phép")}${tile("p","ti-plane-departure")}<b>Xin nghỉ nhanh</b><span class="mu">Phép năm, gửi 1 chạm</span><div class="oa"><button onclick="qLeave(0)">Hôm nay</button><button onclick="qLeave(1)">Ngày mai</button><button onclick="go('leave')">Khác</button></div></div>
<div class="oc ck" onclick="go('leave')">${dot(p+" chờ duyệt",p>0)}${tile("n","ti-file-text")}<b>${hr()?"Duyệt đơn":"Đơn của tôi"}</b><span class="mu">${p?p+" đơn đang chờ":"Không có đơn chờ"}</span>${hr()&&p?`<div class="oa"><button class="p" onclick="event.stopPropagation();apAll()">Duyệt tất cả</button></div>`:""}</div>
<div class="oc ck" onclick="go('pay')">${dot(hr()?(lk?"Đã chốt":"Chưa chốt"):"Tháng "+PM.slice(5),hr()&&!lk)}${tile("g","ti-cash")}<b>Bảng lương</b><span class="mu">${hr()?"Chạm để xem, chốt, in phiếu":"Thực nhận "+vnd(r?r.net:0)}</span></div>
<div class="oc ck" onclick="go('cal')">${dot(o+" người nghỉ")}${tile("o","ti-calendar-event")}<b>Lịch nghỉ</b><span class="mu">Xem ai nghỉ hôm nay</span></div></div>`}
function qLeave(off){const d=new Date();d.setDate(d.getDate()+off);const k=iso(d);MSG="";if(!dl(k,k).length){MSG="Ngày "+k+" là cuối tuần hoặc ngày lễ";return draw()}if(QUOTA-used(ME.id)<1){MSG="Không đủ ngày phép năm còn lại";return draw()}if(!confirm("Gửi đơn nghỉ phép năm ngày "+k+"?"))return;run(sb.from("leaves").insert({type:"Phép năm",from_date:k,to_date:k,reason:"Nghỉ nhanh"}))}
function apAll(){const n=L.filter(l=>l.status=="Cho").length;if(!n||!confirm("Duyệt tất cả "+n+" đơn đang chờ?"))return;run(sb.from("leaves").update({status:"Duyet"}).eq("status","Cho"))}
const mv=k=>{CM=new Date(CM.getFullYear(),CM.getMonth()+k,1);draw()};
async function run(p){const r=await p;MSG=r.error?"Lỗi: "+r.error.message:"";await load()}
const addAnn=()=>v("at")&&run(sb.from("announcements").insert({title:v("at")}));
const delAnn=id=>run(sb.from("announcements").delete().eq("id",id));
function addLv(){const f=v("lf"),o=v("lo"),t=v("lt"),n=f&&o&&o>=f?dl(f,o).length:-1;
if(n<0){MSG="Ngày không hợp lệ";return draw()}if(!n){MSG="Khoảng ngày chỉ có thứ Bảy, Chủ Nhật";return draw()}
if(t=="Phép năm"&&n>QUOTA-used(ME.id)){MSG="Không đủ ngày phép năm còn lại";return draw()}
run(sb.from("leaves").insert({type:t,from_date:f,to_date:o,reason:v("lr")}))}
const dec=(id,s)=>{let x={status:s};if(s=="Tu"){const r=prompt("Lý do từ chối (có thể để trống)");if(r===null)return;x.reject_reason=r}run(sb.from("leaves").update(x).eq("id",id))};
const cancel=id=>run(sb.from("leaves").delete().eq("id",id));
const upd=(tb,k,id,f,x)=>run(sb.from(tb).update({[f]:x}).eq(k,id));
sb.auth.onAuthStateChange(ev=>{if(ev=="PASSWORD_RECOVERY"){RECOV=true;draw()}});sb.auth.getSession().then(load);
</script></body></html>
